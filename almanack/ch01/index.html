// A gold sapling: trunk and branches drawn on, coins on the tips. Returns { g, parts: [[el, start offset, dur, key]] }.
function a1Tree(p, { x = 0, y = 0, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o }), parts = [];
  const trunk = path(g, 'M0 0C4 -50 -6 -96 0 -150', { stroke: WEALTH, 'stroke-width': 7 }, { d: 0 });
  parts.push([trunk, 0, .7, 'd']);
  const br = [[-1, -70, -80, -118], [1, -96, 74, -150], [-1, -124, -58, -196], [1, -138, 38, -214], [0, -150, -4, -222]];
  br.forEach(([sd, y0, x1, y1], i) => {
    const b = path(g, `M0 ${y0}Q${x1 * .4} ${(y0 + y1) / 2 - 10} ${x1} ${y1}`, { stroke: WEALTH, 'stroke-width': 4 }, { d: 0 });
    parts.push([b, .45 + i * .12, .5, 'd']);
    const c = a1Coin(g, x1, y1, 15, EV.goldHi, 1); put(c, { s: 0 });

// Generic city skyline period of width W (towers and one spire), baseline at y=0.
function a1Skyline(p, W = 1600, { color = '#121a1f', edge = '#2b3632', spire = true } = {}) {
  const g = G(p);
  const B = [[0, 160, 120], [130, 240, 90], [230, 190, 140], [380, 310, 70], [460, 220, 110], [580, 150, 160], [750, 270, 90], [850, 200, 130],
    [990, 330, 80], [1080, 180, 150], [1240, 260, 100], [1350, 210, 120], [1480, 170, 120]];
  B.forEach(([bx, h, w]) => {
    const x = bx * W / 1600;
    mk('rect', { x, y: -h, width: w, height: h, fill: color, stroke: edge, 'stroke-width': 2 }, g);
    for (let wy = -h + 24; wy < -20; wy += 34) for (let wx = x + 16; wx < x + w - 14; wx += 30)
      if (((wx * 7 + wy * 3) % 5) < 2) mk('rect', { x: wx, y: wy, width: 8, height: 12, fill: EV.goldHi, opacity: .35 }, g);

  return g;
}

  p3b: 'തകരാർ കണ്ടെത്താനുള്ള തന്റെ സ്വന്തം രീതി, ഗൾഫിലെ ബിൽഡിങ് മാനേജർമാർക്ക് ഉപയോഗിക്കാവുന്ന ഒരു ചെറിയ ആപ്പാക്കുക.',

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
