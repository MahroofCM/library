  q1b: 'കടയിൽ വർഷങ്ങളോളം ചെയ്ത് മൂർച്ച കൂട്ടിയ, ഒരു കസ്റ്റമർക്ക് എന്ത് വേണമെന്ന് മനസ്സിലാക്കാനുള്ള അമീന്റെ കഴിവ്.',
  q1c: 'ഒരു എൻട്രൻസ് പരീക്ഷയുടെ ഉത്തരസൂചിക കാണാതെ പഠിക്കുന്നത്.',
  q1y: 'അതെ. അത് അവന്റെ സ്വന്തം കഴിവിൽ നിന്നും വർഷങ്ങളുടെ പ്രവൃത്തിയിൽ നിന്നും വളർന്നതാണ്. ഒരു കോഴ്സിനും അത് അടുത്തയാൾക്ക് കൈമാറാനാകില്ല.',
  q1na: 'ആർക്കും ചേർന്ന് ആറാഴ്ചയിൽ പഠിക്കാവുന്നതാണെങ്കിൽ, അത് പഠിച്ച ആർക്കും നിങ്ങൾക്ക് പകരം വരാം.',
  q1nc: 'കാണാതെ പഠിച്ച ഉത്തരങ്ങൾ എല്ലാവരെയും ഒരുപോലെ പഠിപ്പിക്കുന്നതാണ്. അതിൽ നിങ്ങളുടേതായി ഒന്നുമില്ല.',
  q2p: 'ഫൈസലിന്റെ കസിൻ, തൃശ്ശൂരിലെ സന, ഒരു കോഴ്സ് തിരഞ്ഞെടുക്കുന്നു. ഈ അധ്യായത്തിന് ഏറ്റവും ചേരുന്ന ഉപദേശം ഏത്?',
  q2a: 'ഈ വർഷം ഏറ്റവും കൂടുതൽ ശമ്പളമുള്ളത് എടുക്കുക.',
  q2b: 'നിക്ഷേപകർ ഏറ്റവും ഹോട്ട് എന്ന് പറയുന്ന മേഖല എടുക്കുക.',
  q2c: 'ആരും പറയാതെ അവൾ മണിക്കൂറുകളോളം ചെയ്യുന്നത് എന്താണെന്ന് ശ്രദ്ധിച്ച്, അത് ഉപയോഗിക്കുന്ന ഒരു വഴി പരീക്ഷിക്കുക.',
  q2y: 'ശരി. സ്വന്തം കഴിവിനെയും കൗതുകത്തെയും പിന്തുടർന്നാണ് സ്പെസിഫിക് നോളജ് കണ്ടെത്തുന്നത്, ആൾക്കൂട്ടത്തെയല്ല.',
  q2na: 'ഈ വർഷത്തെ ഉയർന്ന ശമ്പളം അടുത്ത വർഷം മാറാം, മറ്റെല്ലാവരും അതിന്റെ പിന്നാലെയുമാണ്.',
  q2nb: 'ഏറ്റവും ഹോട്ടായ മേഖലയിലാണ് ഏറ്റവും വലിയ ആൾക്കൂട്ടം; അതിൽ മുഴുവൻ മനസ്സും കൊടുക്കുന്നവർ പകുതി മനസ്സുള്ളവരെ മറികടക്കും.',
  q3p: 'അടിത്തറയോ അധികമോ? ഈ അധ്യായം പറയുന്നതുപോലെ ഓരോ കഴിവും തരംതിരിക്കൂ.',
  q3f: 'അടിത്തറ', q3x: 'അധികം',
  q3r1: 'ദൈനംദിന കണക്ക്: ശതമാനം, പലിശ, ഒരു പെട്ടെന്നുള്ള ഏകദേശക്കണക്ക്',
  q3r2: 'കാൽക്കുലസ്',
  q3r3: 'ഒരു ആശയം ലളിതമായ വാക്കുകളിൽ വിശദീകരിക്കൽ',
  q3r4: 'അപൂർവ വാക്കുകളുടെ ഒരു വലിയ പദസമ്പത്ത്',
  q3w1: 'അടിത്തറ: പണവുമായി ബന്ധപ്പെട്ട മിക്ക തീരുമാനങ്ങളും ഇതിലാണ് നടക്കുന്നത്.',
  q3w2: 'മിക്ക ജീവിതത്തിലും അധികം: ചില ജോലികളിൽ ഉപകാരപ്പെടും, പക്ഷേ കണക്കാണ് കൂടുതൽ ആവശ്യം വരുന്നത്.',
  q3w3: 'അടിത്തറ: ലളിതമായ വാക്കുകൾ ആശയങ്ങളെ കൂടുതൽ പേരിലേക്ക് എത്തിക്കുന്നു.',
  q3w4: 'അധികം: അപൂർവ വാക്കുകൾ കുറച്ചുപേരെ ആകർഷിക്കും; ലളിതമായ വാക്കുകൾ ഒരുപാട് പേരിലെത്തും.',
  p1p: 'നിങ്ങളുടെ സ്പെസിഫിക് നോളജ് കണ്ടെത്താൻ ഏറ്റവും സഹായിക്കുന്ന ചോദ്യം ഏത്?',
  p1a: 'ഇപ്പോൾ ഏറ്റവും കൂടുതൽ ശമ്പളമുള്ള ജോലി ഏത്?',
  p1b: 'കുട്ടിക്കാലത്ത് ആരും പറയാതെ ഞാൻ ചെയ്തിരുന്നത്, മറ്റുള്ളവർ ശ്രദ്ധിച്ചത് എന്താണ്?',
  p1c: 'എന്റെ കസിൻസിൽ മിക്കവരും എടുത്ത കോഴ്സ് ഏത്?',
  p1y: 'അതെ. അത് ഇപ്പോൾത്തന്നെ നിങ്ങളുടേതായ കഴിവുകളിലേക്ക് വിരൽ ചൂണ്ടുന്നു.',
  p1na: 'ശമ്പളം മാറിക്കൊണ്ടിരിക്കും; നിങ്ങൾ എന്തിനായി ഉണ്ടാക്കപ്പെട്ടു എന്ന് അത് പറയുന്നില്ല.',
  p1nc: 'കസിൻസിന്റെ തിരഞ്ഞെടുപ്പ് കസിൻസിനാണ് ചേരുന്നത്.',
  p2p: 'ഫൈസലിന്റെ സ്കൂട്ടർ റിപ്പയർ ചാനലിനോട് മത്സരിക്കാൻ എന്തുകൊണ്ട് ബുദ്ധിമുട്ടാണ്?',
  p2a: 'അവന്റെ കയ്യിലാണ് ഏറ്റവും വിലകൂടിയ ക്യാമറ.',
  p2b: 'മറ്റാരെക്കാളും കൂടുതൽ വീഡിയോകൾ അവൻ ഇടുന്നു.',
  p2c: 'അത് അവന്റെ സ്വന്തം ചേരുവയാണ്: ഒരു റൈഡറുടെ അറിവ്, മലയാളം, അവന്റെ വിശദീകരണ രീതി.',
  p2y: 'ശരി. ആ ചേരുവ മറ്റാർക്കുമില്ല, അതുകൊണ്ട് ആർക്കും അവനെ പകർത്തി മറികടക്കാനാകില്ല.',
  p2na: 'ക്യാമറ ആർക്കും വാങ്ങാം.',
  p2nb: 'കൂടുതൽ ആർക്കും ഇടാം. എണ്ണം പകർത്താം; ഫൈസലിനെ പകർത്താനാകില്ല.',
  p3p: 'അബുദാബിയിൽ ഫിൻടെക്കിൽ ഒരു പുതിയ മേഖല തുറക്കുന്നു. ജീവിതകാലം മുഴുവൻ പഠിക്കുന്ന ഒരാൾക്ക് ചേരുന്ന പ്ലാൻ ഏത്?',
  p3a: 'ഉറച്ച അടിസ്ഥാനങ്ങൾ വെച്ച് ഒരു വർഷത്തിനുള്ളിൽ അതിൽ മിടുക്കനാകുക, പിന്നെയും പഠനം തുടരുക.',
  p3b: 'നൂറ് വിഷയങ്ങൾ ഓരോന്നും കുറച്ചുവീതം ഓടിച്ചുനോക്കുക.',
  p3c: 'പതിനഞ്ച് വർഷം മുൻപത്തെ ഡിഗ്രിയെ മാത്രം ആശ്രയിക്കുക.',
  p3y: 'അതെ. അടിസ്ഥാനങ്ങൾ പുതിയ മേഖലയെ പഠിക്കാവുന്നതാക്കുന്നു, ചക്രം തുടരുന്നു.',
  p3nb: 'വളരെ വിശാലം, വളരെ ആഴം കുറഞ്ഞത്: ഒന്നിലും ആഴമില്ല.',
  p3nc: 'മേഖലകൾ മാറുമ്പോൾ പഴയ അറിവ് മാത്രം പഴകിപ്പോകും.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'ആവേശം കണ്ടെത്താൻ മാത്രമേ കഴിയൂ, വളർത്തിയെടുക്കാനാകില്ല.',
  p4r2: 'താൽപ്പര്യം ജോലിക്ക് ചേരുന്നവർ കുറച്ചുകൂടി നന്നായി ചെയ്യാറുണ്ട്.',
  p4r3: 'മുഴുവൻ മനസ്സ് കൊടുത്താൽ എല്ലാവരെയും വലിയ വ്യത്യാസത്തിൽ തോൽപ്പിക്കുമെന്ന് തെളിഞ്ഞിട്ടുണ്ട്.',
  p4r4: '2023-ലെ ഒരു സർവേയിൽ, പല പ്രധാന കഴിവുകളും അഞ്ച് വർഷത്തിനുള്ളിൽ മാറുമെന്ന് തൊഴിലുടമകൾ പ്രതീക്ഷിച്ചു.',
  p4w1: 'തെറ്റ്. 2018-ലെ ഒരു സ്റ്റാൻഫോർഡ് പഠനത്തിൽ, താൽപ്പര്യം വളർത്താമെന്ന് വിശ്വസിച്ചവർ കടുപ്പമുള്ള പാഠത്തിലും കൂടുതൽ നേരം പിടിച്ചുനിന്നു.',
  p4w2: 'ശരി. 2012-ലെ ഒരു വലിയ അവലോകനം യഥാർത്ഥമായ, പക്ഷേ മിതമായ ഒരു ബന്ധം കണ്ടെത്തി.',
  p4w3: 'തെറ്റ്. താൽപ്പര്യം സഹായിക്കും, പക്ഷേ തെളിവ് കാണിക്കുന്നത് മിതമായ മുൻതൂക്കമാണ്, വൻ വിജയമല്ല.',
  p4w4: 'ശരി. ഏകദേശം 44% മാറുമെന്ന് തൊഴിലുടമകൾ പ്രതീക്ഷിച്ചു. അത് ഒരു പ്രവചനമാണ്, അളവല്ല.',
});
const PRACTICE = [
  { id: 'p-find', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-channel', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 2, L('p2y'), [L('p2na'), L('p2nb'), null]) },
  { id: 'p-learner', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 0, L('p3y'), [null, L('p3nb'), L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['f'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['t'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['t'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
