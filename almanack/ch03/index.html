  q2b: 'അറബിയിൽ മുഴുവനായി ഇറങ്ങുക; എങ്ങുമെത്തില്ലെന്ന് ഇപ്പോൾ അറിയാവുന്നവ ഉപേക്ഷിക്കുക.',
  q2c: 'മുൻവർഷങ്ങൾ മുഴുവൻ പാഴായെന്ന് ഖേദിക്കുക.',
  q2y: 'അതെ. പതിറ്റാണ്ടുകൾ മൂല്യമുള്ള കഷണം അവർ കണ്ടെത്തി. ഇനി അതിന് മുഴുവൻ പ്രയത്നവും കൊടുക്കാം, അത് കൂടിക്കൂടി വളരും.',
  q2na: 'എല്ലാറ്റിനും തുല്യമായി വീതിച്ചാൽ, ഒന്നിനും പതിറ്റാണ്ടുകളുടെ വളർച്ച കിട്ടില്ല. പരീക്ഷിക്കൽ തിരയുന്ന കാലത്തേക്കായിരുന്നു; തിരച്ചിൽ കഴിഞ്ഞു.',
  q2nc: 'പഠനം എന്ന നിലയിൽ അവ പാഴായില്ല: അവ അവരെ രൂപപ്പെടുത്തി, അറബി കണ്ടെത്താൻ സഹായിച്ചു. ലക്ഷ്യത്തിന്റെ കണക്കിൽ മാത്രമാണ് അവ ഫലം തരാതിരുന്നത്.',
  q3p: 'ഈ അധ്യായം പറയുന്ന അർഥത്തിൽ ഉത്തരവാദിത്തം ഏറ്റെടുക്കുന്നത് ഏത്?',
  q3a: 'ആരും കുറ്റപ്പെടുത്താതിരിക്കാൻ, അമീൻ പഴയ കമ്പനിയുടെ ലോഗോയ്ക്ക് കീഴിലേക്ക് തിരിച്ചുപോകുന്നു.',
  q3b: 'അമീൻ വാനിൽ സ്വന്തം പേരും നമ്പറും നിലനിർത്തുന്നു, ഓരോ ജോലിക്കും നേരിട്ട് ഉത്തരം പറയുന്നു.',
  q3c: 'ധൈര്യശാലിയായി തോന്നിക്കാൻ, തിരിച്ചടയ്ക്കാനാകാത്ത ഒരു ലോണിന് അമീൻ വലിയൊരു സെക്യൂരിറ്റി ചെക്ക് ഒപ്പിടുന്നു.',
  q3y: 'ശരി. ജോലിയിൽ അവന്റെ പേരുണ്ട്: ക്രെഡിറ്റും പഴിയും അവൻ ഏറ്റെടുക്കുന്നു. അങ്ങനെയാണ് വിശ്വാസവും ലിവറേജും വരുന്നത്.',
  q3na: 'പഴിയിൽ നിന്ന് രക്ഷപ്പെടാം, പക്ഷേ ആരും കാണില്ല: പേരില്ലെങ്കിൽ വിശ്വാസ്യതയില്ല, ലിവറേജുമില്ല.',
  q3nc: 'അത് ഉത്തരവാദിത്തമല്ല, ചൂതാട്ടമാണ്. ഇന്ത്യയിൽ ചെക്ക് മടങ്ങിയാൽ ക്രിമിനൽ കേസാകാം; യുഎഇയിൽ ചെക്ക് കൈവശമുള്ളയാൾക്ക് സ്വത്ത് പിടിച്ചെടുക്കാം. റിസ്കിന്റെ വലിപ്പം നോക്കൂ.',
  p1p: 'ഒരു ബന്ധത്തിലെ കൂട്ടുപലിശ കാണിക്കുന്നത് ഏത്?',
  p1a: 'ഏറ്റവും കുറഞ്ഞ വിലയ്ക്കായി എല്ലാ മാസവും സപ്ലയറെ മാറ്റുന്നത്.',
  p1b: 'പത്ത് വർഷമായി ഒരേ ന്യായക്കാരനായ പങ്കാളിയോടൊപ്പം ജോലി ചെയ്യുന്നത്; ഇപ്പോൾ ഒരു ഡീലിന് ഒരു ഫോൺ കോൾ മതി.',
  p1c: 'അപരിചിതനുമായി കൂടുതൽ നീണ്ട കരാർ ഒപ്പിടുന്നത്.',
  p1y: 'അതെ. പത്ത് വർഷത്തെ ന്യായമായ ഇടപാട് വിശ്വാസം പണിതു. വിശ്വാസം ഓരോ പുതിയ ഡീലിനെയും വേഗത്തിലും ചെലവുകുറച്ചും ആക്കുന്നു.',
  p1na: 'എല്ലാ മാസവും പുതുതായി തുടങ്ങിയാൽ, വിശ്വാസത്തിന് വളരാൻ വേണ്ട വർഷങ്ങൾ ഒരിക്കലും കിട്ടില്ല.',
  p1nc: 'നീണ്ട കരാറും വിശ്വാസത്തിന് പകരമുള്ള കടലാസ് മാത്രം. വിശ്വാസം കാലക്രമേണ പ്രവൃത്തികൾ കൊണ്ട് നേടണം.',
  p2p: 'അമീൻ ഘടിപ്പിച്ച ഒരു കംപ്രസർ കേടാകുന്നു. ഉപഭോക്താവ് അമീൻ കൂളിങ്ങിന്റെ പേരെടുത്ത് ദേഷ്യം നിറഞ്ഞ ഒരു റിവ്യൂ ഇടുന്നു. ഉത്തരവാദിത്തം എങ്ങനെയായിരിക്കും?',
  p2a: 'പൊതു മറുപടിയിൽ പാർട്സ് സപ്ലയറെ കുറ്റപ്പെടുത്തുക.',
  p2b: 'റിവ്യൂ പിന്തുടരാതിരിക്കാൻ വാനിലെ പേര് മായ്ച്ചുകളയുക.',
  p2c: 'തെറ്റ് ഏറ്റുപറയുക, ശരിയാക്കുക, ജോലിയിൽ സ്വന്തം പേര് നിലനിർത്തുക.',
  p2y: 'ശരി. ക്രെഡിറ്റും പഴിയും ഒരുമിച്ചാണ് വരുന്നത്. ഒരു പരാജയം സത്യസന്ധമായി ഏറ്റെടുക്കുന്നതാണ് ഒരു പേരിനെ വിശ്വസനീയമാക്കുന്നത്.',
  p2na: 'പഴി മറ്റൊരാളിലേക്ക് മാറ്റുന്നത്, അവന്റെ പേരിനെ ആശ്രയിക്കാനാകില്ലെന്ന് വായിക്കുന്ന എല്ലാവരോടും പറയുന്നു.',
  p2nb: 'പേര് മാറ്റിയാൽ റിസ്ക് പോകും; അതോടൊപ്പം വിശ്വാസ്യതയും ലിവറേജും.',
  p3p: 'കോഡിനെയും മീഡിയയെയും പോലെയല്ലാതെ, അധ്വാനവും മൂലധനവും നിങ്ങളുടെ പേരിനെ ഇത്ര ആശ്രയിക്കുന്നത് എന്തുകൊണ്ട്?',
  p3a: 'കാരണം മറ്റുള്ളവർ അവ നിങ്ങൾക്ക് തരാൻ തീരുമാനിക്കണം; അവർ അത് കൊടുക്കുന്നത് വിശ്വസിക്കുന്ന പേരുകൾക്കാണ്.',
  p3b: 'കാരണം കൂടുതൽ മണിക്കൂർ ജോലി ചെയ്താൽ മാത്രമേ അവ വരൂ.',
  p3c: 'കാരണം ചോദിക്കുന്ന ആർക്കും ബാങ്കുകൾ ഒരേ തുക കടം കൊടുക്കും.',
  p3y: 'അതെ. ആളുകൾ നിങ്ങളോടൊപ്പം ജോലി ചെയ്യാൻ തീരുമാനിക്കുന്നു, പണം നിങ്ങളെ വിശ്വസിച്ച് ഏൽപ്പിക്കുന്നു. രണ്ടും വിശ്വാസ്യതയെ പിന്തുടരുന്നു.',
  p3nb: 'കൂടുതൽ മണിക്കൂറുകൾ നിങ്ങളുടെ സ്വന്തം സമയമാണ്. അധ്വാനവും മൂലധനവും മറ്റുള്ളവരുടേതാണ്, നിങ്ങൾക്ക് തരുന്നതാണ്.',
  p3nc: 'കടം തരുന്നവരും പങ്കാളികളും നിങ്ങളുടെ ചരിത്രം ശ്രദ്ധിച്ചുനോക്കും. ആ ചരിത്രമാണ് നിങ്ങളുടെ പേര്.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'പ്രയത്നത്തിന്റെ കൃത്യം 99% പാഴാണെന്ന് പഠനങ്ങൾ അളന്നിട്ടുണ്ട്.',
  p4r2: 'വീണ്ടും ഇടപാട് നടത്തുമെന്ന് പ്രതീക്ഷിക്കുമ്പോൾ ആളുകൾ കൂടുതൽ സഹകരിക്കുന്നു.',
  p4r3: 'ഇന്ന് ഇന്ത്യയിൽ, ചെക്ക് മടങ്ങിയാൽ ഇപ്പോഴും ക്രിമിനൽ കേസാകാം.',
  p4r4: 'സ്വന്തം പേരിൽ പരാജയപ്പെടുന്നതിന് ലോകത്ത് എല്ലായിടത്തും ഒരേ ചെറിയ റിസ്കാണ്.',
  p4w1: 'തെറ്റ്. തൊണ്ണൂറ്റൊമ്പത് ശതമാനം ഒരു പറച്ചിൽ രീതിയാണ്. പലതും പരീക്ഷിക്കുന്നത് കൂടുതൽ ചേരുന്ന കരിയറിലേക്ക് പോലും നയിക്കാം.',
  p4w2: 'ശരി. ആക്സൽറോഡിന്റെ മത്സരങ്ങളിലെന്ന പോലെ, ആവർത്തിക്കുന്ന കളികളിൽ ആദ്യം സഹകരിച്ച് അതേ നാണയത്തിൽ തിരിച്ചുകൊടുക്കുന്ന രീതികളാണ് ജയിക്കുന്നത്.',
  p4w3: 'ശരി. നെഗോഷ്യബിൾ ഇൻസ്ട്രുമെന്റ്സ് ആക്ടിലെ 138-ാം വകുപ്പ് പ്രകാരം ചെക്ക് മടങ്ങുന്നത് ക്രിമിനൽ കുറ്റമാണ്.',
  p4w4: 'തെറ്റ്. നാടിനെ ആശ്രയിച്ചിരിക്കും: അമേരിക്കയിൽ പുതിയ തുടക്കം, ഇന്ത്യയിൽ ചെക്ക് കേസ് ക്രിമിനൽ, യുഎഇയിൽ സിവിൽ നടപടിയിലൂടെ സ്വത്ത് പിടിച്ചെടുക്കൽ.',
});
const PRACTICE = [
  { id: 'p-long', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-own', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 2, L('p2y'), [L('p2na'), L('p2nb'), null]) },
  { id: 'p-lever', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 0, L('p3y'), [null, L('p3nb'), L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['f'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['t'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
