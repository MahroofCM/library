Object.assign(TXT.ml, {
  q1p: 'രണ്ട് നാവികർ: ഒരാൾ നൂറിൽ 75 തവണ ശരിയായ തീരുമാനമെടുക്കുന്നു, മറ്റേയാൾ 85. രണ്ടാമത്തെയാൾക്ക് കുറച്ചല്ല, പലമടങ്ങ് കൂടുതൽ കിട്ടാവുന്നത് എന്തുകൊണ്ട്?',
  q1a: 'കാരണം അവർ കൂടുതൽ മണിക്കൂറുകൾ ജോലി ചെയ്യുന്നുണ്ടാകും.',
  q1b: 'കാരണം ഓരോ തീരുമാനവും ഒരു കൂറ്റൻ കപ്പലിനെ നയിക്കുന്നു; ലിവറേജ് ചെറിയ മുൻതൂക്കത്തെ പലമടങ്ങാക്കുന്നു.',
  q1c: 'കാരണം 85, 75-നേക്കാൾ പലമടങ്ങ് വലുതാണ്.',
  q1y: 'ശരി. മുൻതൂക്കം ചെറുതാണ്, പക്ഷേ അത് ശതകോടിക്കണക്കിന് ദിർഹത്തിന്റെ ചരക്കിലാണ് പ്രയോഗിക്കുന്നത്. ലിവറേജ് ചെറിയ വ്യത്യാസത്തെ വലിയ മൂല്യമാക്കുന്നു.',
  q1na: 'മണിക്കൂറുകൾ ചെലവിടുന്നത് മാത്രമാണ്. പ്രതിഫലം തീരുമാനങ്ങളുടെ മൂല്യത്തെയാണ് പിന്തുടരുന്നത്, സമയത്തെയല്ല.',
  q1nc: '85, 75-നേക്കാൾ ഏകദേശം 13% മാത്രമേ കൂടുതലുള്ളൂ. വലിയ വ്യത്യാസം വരുന്നത് ഓരോ തീരുമാനവും എന്ത് നിയന്ത്രിക്കുന്നു എന്നതിൽ നിന്നാണ്.',
  q2p: 'നിഷ തന്റെ ഒരു മണിക്കൂറിന് ₹2,000 വില ഇടുന്നു. അധ്യായത്തിലെ നിയമം പാലിക്കുന്ന തീരുമാനം ഏത്?',
  q2a: 'രണ്ട് മണിക്കൂർ വീഡിയോ എഡിറ്റ് ചെയ്യാൻ ഒരു വിദ്യാർഥിക്ക് ₹800 കൊടുക്കുക, ആ സമയം പഠിപ്പിക്കാൻ ഉപയോഗിക്കുക.',
  q2b: 'അറബി ക്ലാസുകൾക്കാണ് ഏറ്റവും സമയം വേണ്ടത്, അതുകൊണ്ട് പഠിപ്പിക്കാൻ മറ്റൊരാളെ വെക്കുക.',
  q2c: 'ഒരു റീഫണ്ടായി ₹900 തിരികെ കിട്ടാൻ മൂന്ന് മണിക്കൂർ ബസ്സിൽ യാത്ര ചെയ്യുക.',
  q2y: 'അതെ. എഡിറ്റിങ്ങിന് അവരുടെ നിരക്കിനേക്കാൾ ചെലവ് കുറവാണ്. അത് ഏൽപ്പിച്ച്, അവർക്ക് മാത്രം ചെയ്യാവുന്ന ഭാഗത്തിന് ആ മണിക്കൂറുകൾ കൊടുക്കുന്നു.',
  q2nb: 'പഠിപ്പിക്കലാണ് നിഷയുടെ സ്വന്തം അറിവ്, അവർക്ക് മാത്രം ചെയ്യാവുന്ന ഭാഗം. നിരക്കിനേക്കാൾ വിലകുറഞ്ഞതാണ് ഏൽപ്പിക്കേണ്ടത്, നിങ്ങളുടെ മികവല്ല.',
  q2nc: 'മൂന്ന് മണിക്കൂർ × ₹2,000 = ₹6,000 വിലയുള്ള സമയം, ₹900 തിരികെ കിട്ടാൻ.',
  q3p: 'ഫൈസലിന് ദോഹയിൽ ഒരു ജോലി ഓഫർ വരുന്നു, പത്ത് വർഷം കൂടെ ജീവിക്കേണ്ടി വന്നേക്കാവുന്ന ഒരു മാറ്റം. ഈ അധ്യായത്തിന് ചേരുന്നത് ഏത്?',
  q3a: 'ഓഫർ പോകും മുൻപ്, വെള്ളിയാഴ്ചയ്ക്കകം സമ്മതിക്കുക.',
  q3b: 'കുറച്ച് മാസങ്ങൾ എടുക്കുക: ദോഹ പോയി കാണുക, അവിടെ ജീവിക്കുന്ന മലയാളികളോട് സംസാരിക്കുക, അടുത്ത പത്ത് വർഷം താരതമ്യം ചെയ്യുക.',
  q3c: 'ഫാമിലി വാട്സ്ആപ്പ് ഗ്രൂപ്പിൽ വോട്ടിനിടുക.',
  q3y: 'ശരി. ജീവിക്കുന്ന നഗരം മൂന്ന് വലിയ തീരുമാനങ്ങളിൽ ഒന്നാണ്. ഒരു പതിറ്റാണ്ടിന്റെ തീരുമാനത്തിന് മാസങ്ങളുടെ ആലോചന വേണം.',
  q3na: 'തിടുക്കത്തിലുള്ള സമ്മതമാണ് വലിയ തീരുമാനങ്ങളെ പലപ്പോഴും തെറ്റിക്കുന്നത്. ഇത്ര നീളുന്ന തീരുമാനത്തിന് വേഗം കുറയ്ക്കണം.',
  q3nc: 'മറ്റുള്ളവർക്ക് ഉപദേശിക്കാം, പക്ഷേ വോട്ട് വിവേകമല്ല. ഇത് ഫൈസൽ തന്നെ ആലോചിക്കേണ്ട പത്ത് വർഷമാണ്.',
  p1p: 'വിവേകത്തിന് പ്രതിഫലം കിട്ടുന്നതിനോട് ഏറ്റവും അടുത്ത ജോലി ഏത്?',
  p1a: 'മേശയ്ക്കരികിലെ ഓരോ മണിക്കൂറിനും കൂലി കിട്ടുന്ന ഡാറ്റാ എൻട്രി ക്ലർക്ക്.',
  p1b: 'ഏത് മാമ്പഴം ഇറക്കുമതി ചെയ്യണം എന്ന് തീരുമാനിക്കുന്ന, ലാഭം കൊണ്ട് അളക്കപ്പെടുന്ന, അബുദാബിയിലെ ഒരു സൂപ്പർമാർക്കറ്റ് ശൃംഖലയുടെ ബയർ.',
  p1c: 'പന്ത്രണ്ട് മണിക്കൂർ ഷിഫ്റ്റിന് കൂലി കിട്ടുന്ന സെക്യൂരിറ്റി ഗാർഡ്.',
  p1y: 'അതെ. അവരെ അളക്കുന്നത് തീരുമാനങ്ങളുടെ ഫലം കൊണ്ടാണ്, മണിക്കൂറുകൾ കൊണ്ടല്ല. ഓരോ തീരുമാനവും ഒരുപാട് ചരക്ക് നീക്കുന്നു.',
  p1na: 'മേശയിലെ ഓരോ മണിക്കൂറിനും കൂലി എന്നാൽ ചെലവിട്ട സമയത്തിനുള്ള കൂലി.',
  p1nc: 'ഷിഫ്റ്റിന് കിട്ടുന്നത് അവിടെ ചെലവിട്ട സമയത്തിനാണ്: വീണ്ടും മണിക്കൂറുകൾ.',
  p2p: 'മണിക്കൂറുകളെക്കുറിച്ച് ഒന്നും ചോദിക്കാതെ നിക്ഷേപകർ വാറൻ ബഫറ്റിനെ വൻതുകകൾ ഏൽപ്പിക്കുന്നത് എന്തുകൊണ്ട്?',
  p2a: 'പതിറ്റാണ്ടുകളായി എല്ലാവരുടെയും മുന്നിൽ, ഉത്തരവാദിത്തത്തോടെ തീരുമാനങ്ങളെടുത്തതുകൊണ്ട്; അദ്ദേഹത്തിന്റെ വിവേകം വിശ്വസിക്കപ്പെടുന്നു.',
  p2b: 'കാരണം അദ്ദേഹം മറ്റാരേക്കാളും കഠിനാധ്വാനം ചെയ്യുന്നു.',
  p2c: 'കാരണം എല്ലാ വർഷവും ഒരു നിശ്ചിത ലാഭം അദ്ദേഹം വാഗ്ദാനം ചെയ്യുന്നു.',
  p2y: 'ശരി. തെളിയിക്കപ്പെട്ട വിവേകവും എല്ലാവരും കണ്ട നീണ്ട ട്രാക്ക് റെക്കോർഡുമാണ് ലിവറേജിനെ ആകർഷിക്കുന്നത്.',
  p2nb: 'അദ്ദേഹത്തിന്റെ മണിക്കൂറുകൾ ആരും നോക്കുന്നില്ല. ആളുകൾ വിശ്വസിക്കുന്നത് തീരുമാനങ്ങളുടെ ചരിത്രത്തെയാണ്.',
  p2nc: 'ഉറപ്പുള്ള ലാഭം ഒന്നും വാഗ്ദാനമില്ല. വിശ്വാസം വരുന്നത് അദ്ദേഹത്തിന്റെ ചരിത്രത്തിൽ നിന്നാണ്.',
  p3p: '“പണക്കാരെല്ലാം കള്ളന്മാരാണ്” എന്ന് ഷഫീഖ് പോസ്റ്റ് ചെയ്യുന്നു, എന്നിട്ട് അവരിൽ ഒരാളോട് ഡീൽ ചോദിക്കുന്നു. ഈ അധ്യായത്തിന്റെ ഭാഷയിൽ അവൻ ചെയ്യുന്നത് എന്താണ്?',
  p3a: 'സ്റ്റാറ്റസിന്റെ കളി: മറ്റുള്ളവരെ താഴ്ത്തി സ്വയം മെച്ചമായി കാണിക്കാൻ ശ്രമിക്കുന്നു.',
  p3b: 'പണത്തിന്റെ കളി: മറ്റുള്ളവരോടൊപ്പം സമ്പത്ത് ഉണ്ടാക്കുന്നു.',
  p3c: 'എല്ലാവർക്കും നേട്ടമുള്ള ഒരു പോസിറ്റീവ്-സം കളി.',
  p3y: 'അതെ. സമ്പത്തിനെ പരിഹസിക്കുന്നത് പലപ്പോഴും സ്റ്റാറ്റസിനുള്ള ശ്രമമാണ്. സ്റ്റാറ്റസ് സീറോ-സം ആണ്: ഒരാളെ താഴ്ത്തണം.',
  p3nb: 'പണത്തിന്റെ കളി എന്നാൽ ഒരുമിച്ച് സമ്പത്ത് ഉണ്ടാക്കൽ. ഇടപാട് നടത്തേണ്ടവരെ അപമാനിക്കുന്നത് അതിന് എതിരാണ്.',
  p3nc: 'ആളുകളെ താഴ്ത്തുന്നത് നേരെ മറിച്ചാണ്: സീറോ-സം കളി കളിക്കുന്നത് അങ്ങനെയാണ്.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'മറ്റുള്ളവർ ഒളിപ്പിക്കുന്നത് ആളുകൾക്ക് സാധാരണ അറിയാം: പഠനങ്ങളിൽ മിക്കപ്പോഴും അവർ കള്ളം കണ്ടുപിടിക്കുന്നു.',
  p4r2: 'ഇഷ്ടമില്ലാത്ത വീട്ടുജോലികൾ പണം കൊടുത്ത് ഒഴിവാക്കുന്നത് കൂടുതൽ ജീവിതസംതൃപ്തിയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.',
  p4r3: 'മിക്ക രാത്രികളിലും വീട്ടിൽ അത്താഴം പാകം ചെയ്യുന്നവർ പൊതുവേ കുറഞ്ഞ കലോറിയും പഞ്ചസാരയും കഴിക്കുന്നു.',
  p4r4: 'ഏറ്റവും ശുഭാപ്തിവിശ്വാസമുള്ള സംരംഭകരുടെ ബിസിനസുകളാണ് ഏറ്റവും വേഗം വളരുന്നത്.',
  p4w1: 'തെറ്റ്. നൂറുകണക്കിന് പഠനങ്ങളിൽ, കള്ളം തിരിച്ചറിയൽ ഏകദേശം 54% മാത്രമേ ശരിയായുള്ളൂ, നാണയം ടോസ് ചെയ്യുന്നതിനേക്കാൾ കഷ്ടിച്ച് മെച്ചം.',

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
