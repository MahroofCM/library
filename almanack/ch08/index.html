  q3c: 'എല്ലാ കാര്യത്തിലും എതിർ പാർട്ടിയുടെ നിലപാടിലേക്ക് മാറുക.',

  q3na: 'കൂറും ചിന്തയും ഒന്നല്ല. എല്ലാ അഭിപ്രായവും ഒത്തുവരുന്നുണ്ടെങ്കിൽ, അവൻ അത് ഒരു സെറ്റായി എടുത്തതാകാം.',
  q3nc: 'എല്ലാം മറിച്ചിടുന്നത് ശീലം കൊണ്ടുള്ള എതിർപ്പാണ്: ഇപ്പോഴും ഒരു ആൾക്കൂട്ടത്തിന് പിന്നാലെ, തിരിഞ്ഞുനിന്ന് എന്ന് മാത്രം.',
  p1p: 'അറിവ് അടിത്തറയിൽ നിന്ന് പണിയുക എന്നാൽ എന്താണ്?',
  p1a: 'അകത്തുള്ളയാളായി തോന്നാൻ, ആദ്യം മുന്തിയ ആശയങ്ങൾ പഠിക്കുക.',
  p1b: 'വേണ്ടപ്പോൾ കടുപ്പമുള്ള ആശയങ്ങൾ വീണ്ടും പണിയാൻ പറ്റുംവിധം അടിസ്ഥാനങ്ങൾ നന്നായി അറിയുക.',
  p1c: 'പറ്റുന്നത്ര ഫോർമുലകൾ കാണാപ്പാഠമാക്കുക.',
  p1y: 'അതെ. റിയയെപ്പോലെ, കാണാപ്പാഠമാക്കിയത് ചേരുമെന്ന് പ്രതീക്ഷിക്കുന്നതിന് പകരം, വേണ്ടത് സ്വയം കണ്ടെത്താം.',
  p1na: 'മുന്തിയ ആശയങ്ങളാണ് പലപ്പോഴും ഏറ്റവും കുറച്ച് തെളിയിക്കപ്പെട്ടത്. അടിസ്ഥാനമില്ലെങ്കിൽ അവ ആടിയുലയും.',
  p1nc: 'അമീൻ ചെയ്തത് അതാണ്. ചോദ്യം മാറിയപ്പോൾ, അവന്റെ ഫോർമുലകൾ ചേർന്നില്ല.',
  p2p: 'ജോലി വിട്ട് അജ്മാനിൽ ഒരു ക്ലൗഡ് കിച്ചൻ തുടങ്ങണോ എന്ന് ഫൈസലിന് തീരുമാനിക്കാനാവുന്നില്ല. വ്യക്തമായി കാണാൻ അധ്യായത്തിലെ ഏത് വഴി സഹായിക്കും?',
  p2a: 'ഒരു കൂട്ടുകാരനെ ഉപദേശിക്കുന്നതുപോലെ, “ഫൈസൽ എന്ത് ചെയ്യണം?” എന്ന് ചോദിക്കുക.',
  p2b: 'ഏറ്റവും ആവേശം തോന്നുന്ന രാത്രിയിൽ തീരുമാനിക്കുക.',
  p2c: 'തന്നോട് യോജിക്കുന്നവരോട് മാത്രം ചർച്ച ചെയ്യുക.',
  p2y: 'ശരി. മൂന്നാമതൊരാളെപ്പോലെ ചിന്തിക്കുമ്പോൾ, മറ്റുള്ളവരുടെ പ്രശ്നത്തിലും സ്വന്തം പ്രശ്നത്തിലുമുള്ള വിവേകത്തിന്റെ വ്യത്യാസം കുറയുന്നു.',
  p2nb: 'ഒരു തോന്നൽ പറയുന്നത് വസ്തുതകളെക്കുറിച്ചുള്ള നിങ്ങളുടെ ഊഹത്തെക്കുറിച്ചാണ്, വസ്തുതകളെക്കുറിച്ചല്ല.',
  p2nc: 'അത് ആഗ്രഹത്തെ സംരക്ഷിക്കുന്നു. വ്യക്തമായി കാണാൻ, ഇല്ല എന്ന് പറഞ്ഞേക്കാവുന്ന അഭിപ്രായങ്ങൾ വേണം.',
  p3p: 'നവൽ പറയുന്ന അർഥത്തിൽ, വേറിട്ട് ചിന്തിക്കുന്നയാൾ ആര്?',
  p3a: 'കൂട്ടം എന്ത് പറഞ്ഞാലും എതിർക്കുന്ന രവി.',
  p3b: 'ഓരോ ചോദ്യവും സ്വയം ആലോചിച്ച് ഉറപ്പിക്കുന്ന ഹിബ; ചിലപ്പോൾ കൂട്ടത്തോട് യോജിക്കും, ചിലപ്പോൾ ഇല്ല.',
  p3c: 'എല്ലാ പുതിയ ആശയത്തെയും പുച്ഛിക്കുന്ന ഷഫീഖ്.',
  p3y: 'അതെ. വേറിട്ട് ചിന്തിക്കുന്നയാൾ അടിത്തറയിൽ നിന്ന് ആലോചിക്കുന്നു, ഏത് വശത്തേക്കായാലും സമ്മർദ്ദത്തിൽ ഉറച്ചുനിൽക്കുന്നു.',
  p3na: 'എപ്പോഴും എതിർക്കുന്നതും ആൾക്കൂട്ടത്തിന് പിന്നാലെ പോകലാണ്, തിരിഞ്ഞുനിന്ന് എന്ന് മാത്രം.',
  p3nc: 'പുച്ഛിക്കാൻ എളുപ്പമാണ്. അപൂർവം, പ്രതീക്ഷയോടെ വേറിട്ട് ചിന്തിക്കുന്നവരാണ്.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'സ്വന്തം പ്രശ്നത്തേക്കാൾ, ഒരു കൂട്ടുകാരന്റെ പ്രശ്നത്തെക്കുറിച്ചാണ് ആളുകൾ പൊതുവേ കൂടുതൽ വിവേകത്തോടെ ചിന്തിക്കുന്നത്.',
  p4r2: 'ഒരു സിപ്പ് എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്ന് വിശദീകരിക്കാൻ ശ്രമിക്കുമ്പോൾ, ആളുകൾ സാധാരണ സ്വന്തം അറിവിന് കൂടുതൽ മാർക്കിടുന്നു.',
  p4r3: 'ബെയർഡിന്റെ പഠനത്തിൽ, 12 മിനിറ്റ് വെറുതെ വിശ്രമിച്ചവർക്കാണ് ഏറ്റവും പുതുമയുള്ള ആശയങ്ങൾ കിട്ടിയത്.',
  p4r4: 'ആ പഠനത്തിൽ, ഇടവേള സഹായിച്ചത് നേരത്തേ പണിയെടുത്ത പ്രശ്നങ്ങളിലാണ്, പുതിയവയിലല്ല.',
  p4w1: 'ശരി. ഗ്രോസ്മാനും ക്രോസും ഇത് കണ്ടെത്തി. സ്വന്തം പ്രശ്നം മൂന്നാമതൊരാളുടേത് പോലെ ആലോചിച്ചപ്പോൾ ആ വ്യത്യാസം ഇല്ലാതായി.',
  p4w2: 'തെറ്റ്. വിശദീകരിച്ചപ്പോൾ തങ്ങൾക്ക് എത്ര കുറച്ചേ അറിയൂ എന്ന് ആളുകൾ കണ്ടു, മാർക്ക് കുറഞ്ഞു.',
  p4w3: 'തെറ്റ്. മനസ്സിനെ അലയാൻ വിടുന്ന എളുപ്പമുള്ള ജോലിയാണ്, കഠിനമായ ജോലിയെയും വെറും വിശ്രമത്തെയും മറികടന്നത്.',
  p4w4: 'ശരി. പുതിയ പ്രശ്നങ്ങളിൽ നേട്ടം കണ്ടില്ല. ആദ്യം പ്രശ്നത്തിൽ പണിയെടുക്കൂ, പിന്നെ അതിന് ഇടം കൊടുക്കൂ.',
});
const PRACTICE = [
  { id: 'p-basics', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-distance', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 0, L('p2y'), [null, L('p2nb'), L('p2nc')]) },
  { id: 'p-contrarian', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['t'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
