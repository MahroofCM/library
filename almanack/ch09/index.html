  p2na: 'അത് 100 രണ്ടുതവണ കൂട്ടിയതാണ്. കൂട്ടുപലിശയിൽ, രണ്ടാം വർഷം ആദ്യ വർഷത്തെ 100-നും പലിശ കിട്ടും.',
  p2nb: 'വർഷം 10%-ൽ ഇരട്ടിക്കാൻ ഏകദേശം ഏഴ് വർഷം വേണം, രണ്ടല്ല.',
  p3p: 'ഒരു പരീക്ഷണം കൊണ്ട് തെറ്റാണെന്ന് തെളിയിക്കാവുന്ന അവകാശവാദം ഏത്?',
  p3a: '“മനസ്സ് ശുദ്ധമായ എല്ലാവരെയും ഈ ഏലസ്സ് സംരക്ഷിക്കും.”',
  p3b: '“ദിവസം 20 മിനിറ്റ് ഈ ആപ്പ് ഉപയോഗിക്കുന്ന വിദ്യാർഥികൾക്ക്, ഉപയോഗിക്കാത്തവരേക്കാൾ മാർച്ച് പരീക്ഷയിൽ മാർക്ക് കൂടും.”',
  p3c: '“എല്ലാം സംഭവിക്കുന്നത് ഒരു കാരണത്താലാണ്.”',
  p3y: 'അതെ. രണ്ട് കൂട്ടരുടെയും മാർച്ച് മാർക്ക് താരതമ്യം ചെയ്യൂ: ആപ്പ് ഉപയോഗിച്ചവർക്ക് കൂടുതലില്ലെങ്കിൽ, അവകാശവാദം പൊളിയും.',
  p3na: 'ദോഷം വന്നാൽ, മനസ്സ് വേണ്ടത്ര ശുദ്ധമായിരുന്നില്ല എന്നാകും. ഒന്നിനും അതിനെ എതിർക്കാനാവില്ല.',
  p3nc: 'ഏത് സംഭവവും അതിൽ ചേരും, അതുകൊണ്ട് ഒരു ഫലത്തിനും അത് തെറ്റാണെന്ന് തെളിയിക്കാനാവില്ല.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: '99 പഠനങ്ങളുടെ ഒരു അവലോകനത്തിൽ, കൂടുതൽ വായിക്കുന്നവർക്ക് മികച്ച പദസമ്പത്തും ഭാഷാശേഷിയും ഉള്ളതായി കണ്ടു.',
  p4r2: 'ആ ബന്ധം തനിയെ, വായനയാണ് മികച്ച ശേഷിക്ക് കാരണം എന്ന് തെളിയിക്കുന്നു.',
  p4r3: 'ദിവസം ഒരു മണിക്കൂർ വായിച്ചാൽ ഏഴ് വർഷത്തിൽ മുൻനിരയിലെത്തും എന്ന നവലിന്റെ വാഗ്ദാനം ഒരു പഠനവും പരീക്ഷിച്ചിട്ടില്ല.',
  p4r4: 'നമ്മുടെ പൂർവികർ 150 പേരുള്ള കൂട്ടങ്ങളിലാണ് ജീവിച്ചത് എന്നത് ഉറപ്പിച്ച ശാസ്ത്രമാണ്.',
  p4w1: 'ശരി. പ്രീസ്കൂൾ മുതൽ യൂണിവേഴ്സിറ്റി വരെ, വായിക്കുന്നവർക്ക് ഭാഷാശേഷി കൂടുതലായിരുന്നു.',
  p4w2: 'തെറ്റ്. ബന്ധം കാരണത്തിന് തെളിവല്ല: ശേഷി കൂടുതലുള്ളവർക്ക് വായന കൂടുതൽ ഇഷ്ടമാകാനും സാധ്യതയുണ്ട്.',
  p4w3: 'ശരി. പറഞ്ഞ രൂപത്തിൽ “വിജയം” നിർവചിച്ചിട്ടുപോലുമില്ല, അതുകൊണ്ട് പരീക്ഷിക്കാൻ പ്രയാസമാണ്.',
  p4w4: 'തെറ്റ്. 2021-ലെ ഒരു പുനഃപരിശോധനയിൽ, ഏകദേശം 2 മുതൽ 520 വരെ ആളുകൾ എന്ന പരിധിയാണ് കിട്ടിയത്. പ്രശസ്ത സംഖ്യ തർക്കത്തിലാണ്.',
});

  { id: 'p-compound', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 2, L('p2y'), [L('p2na'), L('p2nb'), null]) },
  { id: 'p-falsify', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
