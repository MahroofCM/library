  p1y: 'അതെ. ധാരാളം വായന ബുദ്ധിക്ക് തുല്യമല്ല. ഉറച്ചതിൽ അടിത്തറ വീണ്ടും പണിയൂ: ഗണിതം, ശാസ്ത്രം, അടിസ്ഥാനങ്ങൾ.',
  p1na: 'അതേതരം കൂടുതൽ വായിച്ചാൽ ഇളകുന്ന അടിത്തറ കട്ടിയാകുകയേ ഉള്ളൂ. ക്രമവും ഗുണമേന്മയുമാണ് പ്രധാനം.',
  p1nc: 'വായനയല്ല പ്രശ്നം. തെറ്റായത് ആദ്യം വായിച്ചതാണ്.',
  p2p: 'വിപണിയിൽ വില എങ്ങനെ നിശ്ചയിക്കപ്പെടുന്നു എന്ന് അൻവറിന് മനസ്സിലാക്കണം. നവലിന്റെ ഉപദേശം അനുസരിച്ച് എവിടെ തുടങ്ങണം?',
  p2a: 'സാമ്പത്തികരംഗത്തെക്കുറിച്ച് ഒരാളുടെ ചൂടൻ അഭിപ്രായമുള്ള ഒരു വൈറൽ വീഡിയോ.',
  p2b: 'ഇന്നത്തെ ബിസിനസ് വാർത്തകൾ.',
  p2c: 'ആഡം സ്മിത്ത്, അല്ലെങ്കിൽ ഒരു അടിസ്ഥാന സാമ്പത്തികശാസ്ത്ര പാഠപുസ്തകം.',
  p2y: 'അതെ. ആദ്യം ഉറവിടവും അടിസ്ഥാനവും; പുനരാഖ്യാനങ്ങൾ പിന്നീട് മനസ്സിലാകും.',
  p2na: 'ചൂടൻ അഭിപ്രായം ഒരു പുനരാഖ്യാനത്തിന്റെ പുനരാഖ്യാനമാണ്; ഓരോ ഘട്ടത്തിലും ചായ്‌വ് കൂടും.',
  p2nb: 'വാർത്ത ഇന്നത്തെ ബഹളമാണ്. ആദ്യം അടിത്തറ പണിയൂ, പിന്നെ വാർത്തയെ അതുവെച്ച് അളക്കൂ.',
  p3p: 'സമ്പാദ്യത്തെക്കുറിച്ച് ഫൈസൽ ഒരു അധ്യായം വായിച്ചു. അത് മനസ്സിൽ ഉറയ്ക്കാൻ ഏറ്റവും സഹായിക്കുന്നത് എന്ത്?',
  p3a: 'സ്വന്തം വാക്കുകളിൽ റൂംമേറ്റിന് വിശദീകരിച്ചുകൊടുക്കുക.',
  p3b: 'തീർത്ത പുസ്തകങ്ങളുടെ എണ്ണത്തിൽ ഒന്ന് കൂട്ടുക.',
  p3c: 'സമ്പാദ്യത്തെക്കുറിച്ച് മൂന്ന് പുസ്തകം കൂടി വാങ്ങുക.',
  p3y: 'അതെ. പഠിപ്പിക്കുമ്പോൾ മനസ്സിലാക്കാതെ വയ്യ. ഒരു പാഠം ഉറക്കെ വിശദീകരിക്കുന്ന വിദ്യാർഥികൾ പിന്നീട് അത് നന്നായി ഓർക്കുന്നു.',
  p3nb: 'തീർത്ത പുസ്തകങ്ങളുടെ എണ്ണം, എന്ത് മനസ്സിൽ നിന്നു എന്നതിനെക്കുറിച്ച് ഒന്നും പറയുന്നില്ല.',
  p3nc: 'കൂടുതൽ പുസ്തകങ്ങൾ പിന്നീട് സഹായിക്കാം; പക്ഷേ ഇത് ഉറപ്പിക്കുന്നത് വിശദീകരിക്കലാണ്.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: '2023-ൽ, ഏതെങ്കിലും ഒരു ദിവസം, നൂറിൽ ഏകദേശം 16 അമേരിക്കക്കാർ ഇഷ്ടത്തിന് വായിച്ചു.',
  p4r2: 'ദിവസം ഒരു മണിക്കൂർ വായിച്ചാൽ നിങ്ങൾ കോടിയിൽ ഒരാളാകും.',
  p4r3: 'ബ്ലഡ്‌ലെറ്റിങ് ഏകദേശം 3,000 വർഷം നിലനിന്നു; അത്രയും കാലം നിലനിന്നാൽ ഒരു ആരോഗ്യ ആശയം ഫലിക്കുമെന്ന് തെളിയും.',
  p4r4: 'ഒരു പാഠം ഉറക്കെ പഠിപ്പിക്കുന്ന വിദ്യാർഥികൾ പിന്നീടുള്ള പരീക്ഷയിൽ അത് നന്നായി ഓർക്കാറുണ്ട്.',
  p4w1: 'ശരി. അമേരിക്കൻ ടൈം യൂസ് സർവേയിൽ നിന്നാണ് ഇത്; ആ വായനക്കാരിൽ പകുതിപ്പേർ ഒരു മണിക്കൂറോ അതിലേറെയോ വായിച്ചു.',
  p4w2: 'തെറ്റ്. ഏതെങ്കിലും ഒരു ദിവസം ഏകദേശം 12-ൽ ഒരു അമേരിക്കക്കാരൻ ഒരു മണിക്കൂറോ അതിലേറെയോ വായിക്കുന്നു. അപൂർവം, പക്ഷേ കോടിയിൽ ഒന്നിന്റെ അടുത്തുപോലുമില്ല.',
  p4w3: 'തെറ്റ്. കാലത്തിന്റെ അരിപ്പ കടന്നിട്ടും മിക്ക രോഗങ്ങൾക്കും ബ്ലഡ്‌ലെറ്റിങ് തെറ്റായിരുന്നു. പഴയത് നോക്കാനുള്ള ഇടമാണ്, തെളിവല്ല.',
  p4w4: 'ശരി. പഠിപ്പിച്ച് പഠിക്കുന്നതിനെക്കുറിച്ചുള്ള പഠനങ്ങളിൽ, പാഠം വിശദീകരിച്ച വിദ്യാർഥികൾ പിന്നീട് അത് നന്നായി ഓർത്തു.',
});
const PRACTICE = [
  { id: 'p-foundation', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-source', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 2, L('p2y'), [L('p2na'), L('p2nb'), null]) },
  { id: 'p-teach', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 0, L('p3y'), [null, L('p3nb'), L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['t'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
