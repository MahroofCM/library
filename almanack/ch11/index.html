  q2na: 'ഇരട്ടകളിലെ പഠനങ്ങൾ പറയുന്നത് ഏകദേശം മൂന്നിലൊന്ന്, മുഴുവനുമല്ല. ജീവിത സംഭവങ്ങളും ശീലങ്ങളും ഇപ്പോഴും സന്തോഷത്തെ മാറ്റുന്നു.',
  q2nc: 'അത് മറുവശത്തേക്ക് അതിരുകടക്കലാണ്: വ്യത്യാസങ്ങളുടെ ഏകദേശം മൂന്നിലൊന്ന് ജീനുകളുമായി ബന്ധപ്പെട്ടതാണ്.',
  q3p: 'ഫൈസലിന് സന്തോഷത്തിന്റെ അടിസ്ഥാന നില ഉയർത്തണം. ഈ അധ്യായത്തിന് ഏറ്റവും ചേരുന്ന പദ്ധതി ഏത്?',
  q3a: 'ആഗ്രഹിക്കുന്ന പുതിയ ഫോൺ വാങ്ങുക; ആ ഉന്മേഷം നിലനിൽക്കും.',
  q3b: 'വാടകയും ജോലിയും കുടുംബവും എല്ലാം തികഞ്ഞതാകുന്നതുവരെ കാത്തിരിക്കുക.',
  q3c: 'ജിമ്മിലെ ഒരു ദിനചര്യ പോലെ, ചെറിയ ചില ദൈനംദിന ശീലങ്ങൾ മാസങ്ങളോളം തുടരുക.',
  q3y: 'ശരി. ഫിറ്റ്നസ് പോലെ പതുക്കെയാണ് നവലിന്റെ അടിസ്ഥാന നില ഉയർന്നത്: ചെറിയ ശീലങ്ങൾ, മുടങ്ങാതെ.',
  q3na: 'ഒരു വാങ്ങൽ ഒരു “കുറവ്” നികത്തും, പിന്നെ അടുത്ത ആഗ്രഹം വരും. ആ ഉന്മേഷം മങ്ങിപ്പോകും.',
  q3nb: 'പുറംലോകം തികഞ്ഞതാകാൻ കാത്തിരുന്നാൽ സന്തോഷം എന്നേക്കും നീളും. സമാധാനം മിക്കവാറും വരുന്നത് സ്വീകരിക്കലിൽ നിന്നാണ്.',
  p1p: 'നവലിന്റെ ഇപ്പോഴത്തെ കാഴ്ചപ്പാടിൽ, സന്തോഷം എന്താണ്?',
  p1a: 'പോസിറ്റീവ് ചിന്തകളുടെ ഒരു നിലയ്ക്കാത്ത ഒഴുക്ക്.',
  p1b: 'ആഗ്രഹിക്കുന്നതെല്ലാം ഒന്നൊന്നായി നേടൽ.',
  p1c: 'എന്തോ കുറവുണ്ട് എന്ന തോന്നൽ മാഞ്ഞുപോകുമ്പോൾ ബാക്കിയാകുന്നത്.',
  p1y: 'അതെ. അദ്ദേഹം അതിനെ സ്വാഭാവിക അവസ്ഥ എന്ന് വിളിക്കുന്നു: ഒന്നിനും കുറവില്ലെന്ന് തോന്നുമ്പോൾ മനസ്സ് ശാന്തമാകും.',
  p1na: 'ഓരോ പോസിറ്റീവ് ചിന്തയിലും അതിന്റെ വിപരീതം ഒളിഞ്ഞിരിക്കുന്നു എന്നാണ് നവൽ പറയുന്നത്. അവ കൂട്ടിവയ്ക്കലല്ല കാര്യം.',
  p1nb: 'നിറവേറുന്ന ഓരോ ആഗ്രഹവും അടുത്തതിന് ഇടമൊരുക്കും, മനസ്സ് ഓടിക്കൊണ്ടേയിരിക്കും.',
  p2p: 'കൊച്ചിയിൽ ഒരു കല്യാണത്തിന് മഴ പെയ്യുന്നു. വധുവിന്റെ അമ്മായി ആ ദിവസം നശിച്ചു എന്ന് പറയുന്നു; പാലക്കാട്ടെ ഒരു കർഷകൻ അതിനെ അനുഗ്രഹം എന്ന് വിളിക്കുന്നു. നവലിന്റെ ഭാഷയിൽ ഇത് എന്ത് കാണിക്കുന്നു?',
  p2a: 'സംഭവം നിഷ്പക്ഷമാണ്; ഓരോ മനസ്സും അത് വായിക്കുന്ന രീതിയിൽ നിന്നാണ് അർഥം.',
  p2b: 'കല്യാണങ്ങൾക്ക് മഴ ദൗർഭാഗ്യമാണ്.',
  p2c: 'കർഷകർ കൂടുതൽ സന്തോഷമുള്ളവരാണ്.',
  p2y: 'ശരി. യാഥാർഥ്യം നിഷ്പക്ഷമാണ്. വായനയിലാണ് തിരഞ്ഞെടുപ്പും പരിശീലനവും വരുന്നത്.',
  p2nb: 'അത് ഒരു വായന മാത്രമാണ്. കർഷകന്, അതേ മഴ നല്ല വാർത്തയാണ്.',
  p2nc: 'പൊതുവെ ആരാണ് കൂടുതൽ സന്തോഷമുള്ളവർ എന്നതല്ല കാര്യം. രണ്ടുപേരും ഒരേ മഴ കാണുന്നു, വ്യത്യസ്തമായി വായിക്കുന്നു.',
  p3p: 'സ്വയം ചെറുതായി കാണുന്നത് സഹായിക്കും എന്ന് നവൽ പറയുന്നത് എന്തുകൊണ്ട്?',
  p3a: 'ഒന്നിനെക്കുറിച്ചും പിന്നെ ശ്രദ്ധിക്കേണ്ടതില്ല.',
  p3b: 'ലോകം മുഴുവൻ നിങ്ങളുടെ ആഗ്രഹത്തിനൊത്ത് വളയണം എന്ന പ്രതീക്ഷ മാറുന്നു.',
  p3c: 'ചെറിയ ആളുകൾക്ക് പ്രശ്നങ്ങൾ കുറവാണ്.',
  p3y: 'അതെ. ജീവിതം എങ്ങനെ പോകണം എന്ന തിരക്കഥയില്ലെങ്കിൽ, അസന്തോഷത്തിന് കാരണം കുറയും. ഒരു കുട്ടിയെപ്പോലെ, വെറുതെ അവിടെ ആയിരിക്കാം.',
  p3na: 'അശ്രദ്ധ എന്നല്ല അർഥം: ഓരോ നിമിഷവും വിലപ്പെട്ടതാണ്. ജീവിതം നിങ്ങളെ അനുസരിക്കണം എന്ന വാശി മാത്രം ഉപേക്ഷിക്കുന്നു.',
  p3nc: 'വലിപ്പമോ പദവിയോ അല്ല കാര്യം. പ്രതീക്ഷകളാണ്: ലോകം മിക്കവാറും വളയില്ല.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'ആളുകൾക്കിടയിലെ സന്തോഷവ്യത്യാസങ്ങളുടെ ഏകദേശം മൂന്നിലൊന്ന് ജീനുകളുമായി ബന്ധപ്പെട്ടതാണെന്ന് ഇരട്ടകളിലെ പഠനങ്ങൾ കാണിക്കുന്നു.',
  p4r2: 'ദീർഘകാല തൊഴിലില്ലായ്മയോ ഗുരുതരമായ വൈകല്യമോ ഏതാനും ആഴ്ചയിൽ കൂടുതൽ സന്തോഷം കുറയ്ക്കില്ല.',
  p4r3: 'ഒരു പഠനത്തിൽ, മനസ്സ് അലയുമ്പോൾ ആളുകൾക്ക് സന്തോഷം കുറവായിരുന്നു.',
  p4r4: 'വ്യായാമത്തേക്കാളും മറ്റ് സജീവ ചികിത്സകളേക്കാളും ധ്യാനം വളരെ മെച്ചമാണെന്ന് 2014-ലെ ഒരു അവലോകനം കണ്ടെത്തി.',
  p4w1: 'ശരി. ഏകദേശം 56,000 പേരെ ഉൾക്കൊള്ളിച്ച 2015-ലെ ഒരു അവലോകനം അത് ഏകദേശം 36% ആയി കണക്കാക്കി.',
  p4w2: 'തെറ്റ്. ജർമനിയിലെയും ബ്രിട്ടനിലെയും ദീർഘ സർവേകളിൽ, പലരും വർഷങ്ങളോളം സന്തോഷം കുറഞ്ഞവരായി തുടർന്നു.',
  p4w3: 'ശരി. ഏകദേശം 2,250 പേരോട് ദിവസം മുഴുവൻ ചോദിച്ചു; അലയുന്ന മനസ്സിനൊപ്പം സന്തോഷം കുറവായിരുന്നു, മടുപ്പുള്ള ജോലികളിൽ പോലും.',
  p4w4: 'തെറ്റ്. ഉത്കണ്ഠയ്ക്കും വിഷാദത്തിനും മിതമായ സഹായം കണ്ടു; മറ്റ് സജീവ ചികിത്സകളേക്കാൾ മെച്ചമാണെന്നതിന് തെളിവ് കണ്ടില്ല.',
});
const PRACTICE = [
  { id: 'p-default', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 2, L('p1y'), [L('p1na'), L('p1nb'), null]) },
  { id: 'p-neutral', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 0, L('p2y'), [null, L('p2nb'), L('p2nc')]) },
  { id: 'p-small', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
