// A tilted verdict stamp.
function a13Stamp(p, key, x, y, t, color = SCI) {
  const g = G(p, { x, y, o: 0, r: -7 });

}
// Walking along several legs of a route from one clock: segs [[t0, t1, x0, x1], …] in time order.
function a13Walk(P, segs, D, stride = 60) {
  prog(q => {
    const t = q * D; let x = segs[0][2], moving = false, dist = 0;
    for (const [t0, t1, x0, x1] of segs) if (t >= t0) { const u = Math.min(1, (t - t0) / (t1 - t0)); x = x0 + (x1 - x0) * u; if (u < 1) { moving = true; dist = Math.abs(x - x0); } }
    const ph = dist / stride * Math.PI, sw = moving ? Math.sin(ph) * 14 : 0;
    put(P.g, { x }); put(P.legL, { r: sw }); put(P.legR, { r: -sw });
    put(P.torso, { y: -178 - (moving ? Math.abs(Math.sin(ph)) * 5 : 0) });
  }, 0, D, lin);
}

  q1na: 'ഓരോന്നും അസ്വസ്ഥതയ്ക്കുള്ള ഓരോ കരാറാണ്. അഞ്ചിന്റെയും പിന്നാലെ ഒരുമിച്ച് ഓടിയാൽ അഞ്ച് കരാറും തുറന്നുകിടക്കും.',
  q1nc: 'പ്രവർത്തിക്കാനും പണിയാനുമാണ് നമ്മൾ എന്ന് നവൽ പറയുന്നു. ആഗ്രഹങ്ങൾ തിരഞ്ഞെടുക്കലാണ് കാര്യം, ജീവിതം ഉപേക്ഷിക്കലല്ല.',
  q2p: 'ഇരുപത്തിനാലുകാരനായ ഫൈസൽ, ഇരുപത് വർഷം ദിവസവും പതിനാറ് മണിക്കൂർ പണിയെടുത്ത്, പിന്നെ ജീവിതം ആസ്വദിക്കാൻ പദ്ധതിയിടുന്നു. മൂന്ന് പ്രായങ്ങളെക്കുറിച്ചുള്ള നവലിന്റെ ചിത്രം എന്ത് മുന്നറിയിപ്പ് നൽകുന്നു?',
  q2a: 'ഒന്നുമില്ല: ആദ്യം പണം, അതാണ് സുരക്ഷിതമായ ക്രമം.',
  q2b: 'ചെറുപ്പക്കാർ എപ്പോഴും ഏറ്റവും സന്തോഷവാന്മാരാണ്, അതുകൊണ്ട് പ്രശ്നമില്ല.',
  q2c: 'ആവശ്യത്തിന് പണം എത്തുമ്പോഴേക്കും സമയവും ആരോഗ്യവും പോയേക്കാം; മൂന്നും കാക്കാൻ ശ്രമിക്കുക.',
  q2y: 'ശരി. സമയവും ആരോഗ്യവും പണവും ഒരുമിച്ചാണ് സമ്മാനം; ഒന്നിനുവേണ്ടി മറ്റുള്ളവ കളയുന്നതല്ല.',
  q2na: 'ആദ്യം പണം എന്നാൽ പലപ്പോഴും സമയവും ആരോഗ്യവും അവസാനം എന്നാണ്. പണം തികയുമ്പോഴേക്കും അവ തീർന്നേക്കാം.',
  q2nb: 'നവൽ കാണുന്നത് മറിച്ചാണ്: ഒരുപാട് ആഗ്രഹങ്ങളുള്ള ചെറുപ്പക്കാർ പലപ്പോഴും സന്തോഷം കുറഞ്ഞവരായി തോന്നുന്നു.',
  q3p: 'അറുപത്തൊന്നുകാരനായ ഹംസയ്ക്ക് ഷാർജയിൽ മൂന്ന് സൂപ്പർമാർക്കറ്റുകളുണ്ട്. മക്കളാണ് അവ നടത്തുന്നത്; എന്നിട്ടും അദ്ദേഹം നാലാമത്തേത് തുടങ്ങുന്നു, ആധി കാരണം ഉറക്കമില്ല. ഈ അധ്യായത്തിലെ ഏത് ആശയമാണ് ഏറ്റവും ചേരുന്നത്?',
  q3a: 'വളർന്നുകഴിഞ്ഞ ഒരു കളിയിൽ അദ്ദേഹം കുടുങ്ങിയിരിക്കാം; അടുത്ത ജയം അദ്ദേഹം തേടുന്ന സമാധാനം തരില്ല.',
  q3b: 'നാലാമത്തെ കട ഒടുവിൽ ശാശ്വതമായ സമാധാനം നൽകും.',
  q3c: 'കഠിനാധ്വാനം തുടക്കം മുതലേ തെറ്റായിരുന്നു.',
  q3y: 'ശരി. നന്നായി കളിക്കാനറിയുന്ന കളി നിർത്താൻ പ്രയാസമാണ്; അത് ഗുണം ചെയ്യാതായിട്ടും ശീലിച്ചുപോകൽ ഓട്ടം തുടരിക്കുന്നു.',
  q3nb: 'ഓരോ നേട്ടവും വേഗം സാധാരണമാകും. അതാണ് ഹെഡോണിക് അഡാപ്റ്റേഷൻ: നാലാമത്തേതും മൂന്നാമത്തേത് പോലെ തോന്നും.',
  q3nc: 'പുറത്തെ പണി ചെയ്യണം എന്നുതന്നെയാണ് നവൽ പറയുന്നത്. കളി ഗുണം ചെയ്യാതായിട്ടും അത് തുടരുന്നതാണ് കെണി.',
  p1p: 'ആഗ്രഹത്തെ, നിങ്ങൾ നിങ്ങളോടുതന്നെ ഒപ്പിടുന്ന കരാർ എന്ന് നവൽ വിളിക്കുന്നു. അതിൽ എന്താണ് എഴുതിയിരിക്കുന്നത്?',
  p1a: 'ഉള്ളതിന് ഞാൻ നന്ദിയുള്ളവനായിരിക്കും.',
  p1b: 'ഞാൻ കഠിനമായി പണിയെടുത്ത് പണക്കാരനാകും.',
  p1c: 'ആഗ്രഹിച്ചത് കിട്ടുംവരെ അസ്വസ്ഥനായിരിക്കാൻ ഞാൻ സമ്മതിക്കുന്നു.',
  p1y: 'അതെ. ഓരോ ആഗ്രഹവും സ്വസ്ഥതയ്ക്ക് ഒരു നിബന്ധന വയ്ക്കുന്നു. കുറച്ചെണ്ണം മാത്രം, മനഃപൂർവം ഒപ്പിടൂ.',
  p1na: 'അത് തൃപ്തിയോടാണ് അടുത്ത്; ആഗ്രഹത്തിന്റെ നേർവിപരീതം.',
  p1nb: 'ഇതൊരു ബിസിനസ് പദ്ധതിയല്ല. കാത്തിരിക്കുമ്പോൾ നിങ്ങൾക്ക് എങ്ങനെ തോന്നുന്നു എന്നതാണ് കാര്യം.',
  p2p: 'ഷഫീഖിന്റെ പുതിയ കാർ ഒരാഴ്ച അവനെ ആവേശം കൊള്ളിച്ചു; ഇപ്പോൾ അത് താഴെ പാർക്ക് ചെയ്യുന്ന വെറുമൊരു വണ്ടി. ഇതിനെ എന്ത് വിളിക്കുന്നു?',
  p2a: 'ഹെഡോണിക് അഡാപ്റ്റേഷൻ (ശീലിച്ചുപോകൽ)', p2b: 'സ്പെസിഫിക് നോളജ്', p2c: 'കൂട്ടുപലിശ',
  p2y: 'ശരി. നേട്ടങ്ങൾ നമ്മൾ വേഗം ശീലിക്കും; ആവേശം പഴയ നിലയിലേക്ക് മടങ്ങും.',
  p2nb: 'അത് ഒന്നാം ഭാഗത്തിലെ ആശയമാണ്: നിങ്ങൾക്ക് മാത്രമുള്ള അറിവ്. ഇവിടെ കാർ ശീലമായതുകൊണ്ടാണ് ആവേശം മങ്ങിയത്.',
  p2nc: 'കൂട്ടുപലിശ കാര്യങ്ങളെ വളർത്തുന്നു. ഇവിടെ നേരെ മറിച്ചാണ്: കാർ ശീലമായപ്പോൾ ആവേശം ചുരുങ്ങി.',
  p3p: 'ഉള്ളതിൽ തൃപ്തിപ്പെടുന്നതാണ് സന്തോഷം, തൃപ്തിയില്ലായ്മയിൽ നിന്നാണ് വിജയം എന്ന് നവൽ പറയുന്നു. അതിൽ നിന്ന് എന്ത് മനസ്സിലാക്കാം?',
  p3a: 'രണ്ടും ഒന്നുതന്നെ; രണ്ടിന്റെയും പിന്നാലെ മുഴുവൻ വേഗത്തിൽ ഓടുക.',
  p3b: 'ഏതിനെയാണ്, എപ്പോഴാണ് പോറ്റുന്നതെന്ന് അറിഞ്ഞുകൊണ്ട് തിരഞ്ഞെടുക്കുക.',
  p3c: 'ഒന്നിലും വിജയിക്കാൻ ശ്രമിക്കരുത്.',
  p3y: 'ശരി. പരിശ്രമത്തിന് അതിന്റേതായ കാലമുണ്ട്; അത് ഓടുന്നത് അതൃപ്തിയിലാണെന്ന് അറിഞ്ഞാൽ മതി.',
  p3na: 'രണ്ടും എതിർദിശകളിലേക്ക് വലിക്കുന്നു: ഒന്ന് “മതി” എന്ന്, മറ്റേത് “ഇനിയും” എന്ന്.',
  p3nc: 'നവൽ ഇപ്പോഴും പണിയുന്നു, പ്രവർത്തിക്കുന്നു. തിരഞ്ഞെടുക്കാനാണ് അദ്ദേഹം പറയുന്നത്, ഉപേക്ഷിക്കാനല്ല.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'ഒരു സ്വീഡിഷ് പഠനത്തിൽ, വലിയ ലോട്ടറി ജേതാക്കൾക്ക് പത്ത് വർഷത്തിനു ശേഷവും ജീവിതത്തിൽ കൂടുതൽ തൃപ്തിയുണ്ടായിരുന്നു.',
  p4r2: 'ഏത് തരം ആഗ്രഹവും സന്തോഷം കുറയ്ക്കുമെന്ന് ഗവേഷണം കാണിക്കുന്നു.',
  p4r3: '145 രാജ്യങ്ങളിലെ കണക്കുകളിൽ, മധ്യവയസ്സിൽ, 50-നടുത്ത്, സന്തോഷം താഴുന്ന പ്രവണത കണ്ടു.',
  p4r4: '44 രാജ്യങ്ങളിലെ പുതിയ സർവേകളിൽ, ഏറ്റവും കുറവ് മാനസിക ക്ലേശം ചെറുപ്പക്കാർക്കാണ്.',
  p4w1: 'ശരി. ഏകദേശം 3,300 കളിക്കാരെ സർവേ ചെയ്തു; വലിയ തുക നേടിയവർക്ക് ജീവിതത്തിൽ കൂടുതൽ തൃപ്തി തുടർന്നു, ദൈനംദിന സന്തോഷത്തിൽ കാര്യമായ വ്യത്യാസമില്ലെങ്കിലും.',
  p4w2: 'തെറ്റ്. പണത്തിനും വസ്തുക്കൾക്കും ഒന്നാം സ്ഥാനം നൽകുന്നതിന് ചെറിയൊരു ദോഷബന്ധമുണ്ട്; പക്ഷേ പ്രധാന ലക്ഷ്യങ്ങളിലേക്കുള്ള പുരോഗതി കൂടുതൽ സന്തോഷത്തിനൊപ്പമാണ്.',
  p4w3: 'ശരി. പല രാജ്യങ്ങളിലും കണ്ട, പ്രശസ്തമായ U ആകൃതിയാണിത്; പുതിയ മാറ്റത്തിന് മുൻപുള്ള ചിത്രം.',
  p4w4: 'തെറ്റ്. ഇപ്പോൾ ഏറ്റവും കൂടുതൽ ക്ലേശം ചെറുപ്പക്കാർക്കാണ്; പ്രായം കൂടുംതോറും അത് കുറയുന്നു.',
});
const PRACTICE = [
  { id: 'p-contract', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 2, L('p1y'), [L('p1na'), L('p1nb'), null]) },
  { id: 'p-adapt', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 0, L('p2y'), [null, L('p2nb'), L('p2nc')]) },
  { id: 'p-success', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
