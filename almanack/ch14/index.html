  q1a: 'സിംഗിൾ-പ്ലെയർ കളിയെ അവൾ മൾട്ടിപ്ലെയർ കളിയാക്കി. ഉള്ളിലെ സ്കോർകാർഡിനായി ഓടൂ.',

  q1c: 'ഓട്ടം അവൾക്ക് ചേരില്ലെന്ന് വ്യക്തം. നിർത്തിക്കോളൂ.',
  q1y: 'ശരി. ആ ശാന്തത അവളുടെ സ്വന്തം കളിയായിരുന്നു. ഓരോ ഓട്ടവും പോസ്റ്റ് ചെയ്തപ്പോൾ സ്കോർകാർഡ് മറ്റുള്ളവരുടെ കയ്യിലായി.',
  q1nb: 'ഒരാളെ തോൽപ്പിച്ചാൽ സ്കോർബോർഡ് മാറുകയേ ഉള്ളൂ. കൂടുതൽ വേഗമുള്ള ആരെങ്കിലും എപ്പോഴും വരും.',
  q1nc: 'ഓട്ടം സഹായിക്കുകയായിരുന്നു. അതിനെ മത്സരമാക്കിയതാണ് നോവിച്ചത്.',
  q2p: 'ഫൈസൽ പത്തുദിവസത്തെ മൗനധ്യാനം പരീക്ഷിച്ചു; അവന് അത് തീരെ ഇഷ്ടപ്പെട്ടില്ല. നവൽ എന്ത് നിർദേശിക്കും?',
  q2a: 'ധ്യാനം അവനുള്ളതല്ല; അതുകൊണ്ട് അവന് സന്തോഷം പഠിക്കാനാവില്ല.',
  q2b: 'അതേ റിട്രീറ്റ് വീണ്ടും ബുക്ക് ചെയ്ത് നിർബന്ധിച്ച് പൂർത്തിയാക്കുക.',
  q2c: 'പരീക്ഷണം തുടരുക: ചെറിയ ധ്യാനം, ഫുട്ബോൾ, പാചകം. ഫലിക്കുന്നത് നിലനിർത്തുക.',
  q2y: 'ശരി. പരീക്ഷിച്ചും പിഴച്ചും എന്നാണ് നവൽ പറയുന്നത്. ഒരു വഴി പാളിയാൽ കഴിവിനെക്കുറിച്ച് അത് ഒന്നും പറയുന്നില്ല.',
  q2na: 'ഒരു വഴി പാളിയെന്ന് വെച്ച് കഴിവ് കൈയെത്താത്തതാകുന്നില്ല. വേറൊരു വഴി നോക്കൂ.',
  q2nb: 'ചേരാത്തതിനെ നിർബന്ധിക്കുകയല്ല ആശയം. മറ്റൊന്ന് പരീക്ഷിച്ച്, ഫലിക്കുന്നത് നിലനിർത്തൂ.',
  q3p: 'ദോഹയിലെ ഓഫീസിൽ, ഹിബയുടെ സഹപ്രവർത്തക ഒരു ഹലോ പോലും പറയാതെ കടന്നുപോകുന്നു. ഹിബ കരുതുന്നു: “എന്തൊരു അഹങ്കാരം!” നവലിന്റെ ഏത് വിദ്യയാണ് ചേരുന്നത്?',
  q3a: 'നാളെ അവളെയും അവഗണിക്കുക.',
  q3b: 'ദയയോടെയുള്ള വായന തേടുക: ഒരുപക്ഷേ അവൾക്ക് എന്തെങ്കിലും വിഷമമുണ്ടാകാം.',
  q3c: 'അവൾ എങ്ങനെയുള്ളവളാണെന്ന് ടീമിനെ അറിയിക്കുക.',
  q3y: 'ശരി. ദയയോടെയുള്ള വായന ചോദിക്കൂ. വിധിക്കുന്നത് ഒരു നിമിഷം സുഖം തരും; പിന്നെ ഒറ്റപ്പെടുത്തും.',
  q3na: 'അത് വിധിക്കൽ തുടരുകയാണ്; അകലം കൂടുകയേ ഉള്ളൂ.',
  q3nc: 'വിധി പരത്തുന്നത് ഹിബയെ ആളുകളിൽ നിന്ന് കൂടുതൽ അകറ്റും.',
  p1p: 'അബുദാബിയിലെ റിയാസിന്റെ വില്ല കണ്ട് ഷഫീഖിന് അസൂയ. നവലിന്റെ ‘വെച്ചുമാറൽ’ പരീക്ഷണം എന്താണ്?',
  p1a: 'റിയാസിന്റെ ഏതൊക്കെ സാധനങ്ങൾ ഷഫീഖിനും വാങ്ങാം?',
  p1b: 'ആധികളും കുടുംബവും മനോനിലകളും ഉൾപ്പെടെ, തന്റെ ജീവിതം മുഴുവൻ റിയാസിന്റേതുമായി എന്നേക്കുമായി ഷഫീഖ് വെച്ചുമാറുമോ?',
  p1c: 'റിയാസിന്റെ വിജയം എങ്ങനെ കുറച്ചുകൂടി നഷ്ടപ്പെടുത്താം?',
  p1y: 'അതെ. ഒരാളുടെ ജീവിതത്തിൽ നിന്ന് ഒരു കഷണം മാത്രം എടുക്കാനാവില്ല. മുഴുവൻ വെച്ചുമാറില്ലെങ്കിൽ, അസൂയയ്ക്ക് അർഥമില്ല.',
  p1na: 'അത് ഇപ്പോഴും കഷണങ്ങൾ പെറുക്കലാണ്. പരീക്ഷണം ആ മനുഷ്യനെ മുഴുവനായി, എല്ലാ സമയത്തും, കുറിച്ചാണ്.',
  p1nc: 'ഒരാൾ താഴെ വീഴണമെന്ന ആഗ്രഹം ദുഷിച്ച അസൂയയാണ്. അതുകൊണ്ട് നിങ്ങൾക്ക് ഒരു നേട്ടവുമില്ല.',
  p2p: 'ഇവയിൽ ഏതാണ് സിംഗിൾ-പ്ലെയർ കളി?',
  p2a: 'ദുബായിലെ ട്രാഫിക്കിൽ കൂടുതൽ ശാന്തനാകുക.',
  p2b: 'കുടുംബത്തിലെ ഏറ്റവും വലിയ കാർ സ്വന്തമാക്കുക.',
  p2c: 'ഒരു പോസ്റ്റിന് ഏറ്റവും കൂടുതൽ ലൈക്ക് നേടുക.',
  p2y: 'അതെ. ആ സ്കോർ മറ്റാരും കാണുന്നില്ല. കഴിഞ്ഞ മാസത്തെക്കാൾ ശാന്തനാണോ എന്ന് നിങ്ങൾക്ക് മാത്രം അറിയാം.',
  p2nb: 'ആ സ്കോർ ഇടുന്നത് മറ്റുള്ളവരാണ്. അതൊരു മൾട്ടിപ്ലെയർ പദവിക്കളിയാണ്.',
  p2nc: 'ലൈക്കുകൾ മറ്റുള്ളവരുടെ സ്കോർകാർഡാണ്. അത് മൾട്ടിപ്ലെയർ.',
  p3p: 'രാത്രി കിടക്കയിൽ കിടന്ന് സ്ക്രോൾ ചെയ്യുന്നത് നിർത്താൻ തൃശ്ശൂരിലെ അഞ്ജലി ആഗ്രഹിക്കുന്നു. നവലിന്റെ കുറിപ്പടിക്ക് ചേരുന്ന പ്ലാൻ ഏത്?',
  p3a: 'തിങ്കളാഴ്ച മുതൽ അഞ്ച് ശീലങ്ങൾ ഒരുമിച്ച് മാറ്റുക.',
  p3b: 'പ്ലാൻ വേണ്ട. മനക്കരുത്ത് മതി.',
  p3c: 'ഈ ഒരു ശീലം മാത്രം എടുക്കുക, ട്രിഗർ അറിയുക (കിടക്കയിലെ ഫോൺ), പകരക്കാരനെ കണ്ടെത്തുക (ഒരു പുസ്തകം), കൂട്ടുകാരിയോട് പറയുക, രേഖപ്പെടുത്തുക.',
  p3y: 'അതെ. ഒരു കാര്യം, തുടരാവുന്ന പ്ലാൻ, ട്രിഗറും പകരക്കാരനും, അറിയുന്ന ഒരു കൂട്ടുകാരി, പിന്നെ രേഖപ്പെടുത്തൽ.',
  p3na: 'നവലിന്റെ കുറിപ്പടി ഒരു കാര്യത്തിൽ തുടങ്ങുന്നു. അഞ്ചെണ്ണം ഒരുമിച്ച് തുടർന്നുപോകാൻ പ്രയാസമാണ്.',
  p3nb: 'മനക്കരുത്ത് മാത്രം മങ്ങിപ്പോകും. കുറിപ്പടി ഒരു പ്ലാനും ട്രിഗറും പകരക്കാരനും രേഖപ്പെടുത്തലും ചേർക്കുന്നു.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: '31 പഠനങ്ങളുടെ ഒരു അവലോകനത്തിൽ, പഞ്ചസാര ഏകദേശം ഒരു മണിക്കൂർ മനസ്സ് തെളിയിച്ചു.',
  p4r2: 'വ്യായാമം വിഷാദവും ഉത്കണ്ഠയും കുറയ്ക്കുമെന്ന് ആയിരത്തിലേറെ പരീക്ഷണങ്ങൾ കാണിക്കുന്നു.',
  p4r3: 'അസൂയ ഒരിക്കലും ആരെയും സഹായിക്കില്ല.',
  p4r4: 'കഫീൻ നിർത്തുമ്പോൾ പലർക്കും കുറച്ചു ദിവസം തലവേദന വരാറുണ്ട്.',
  p4w1: 'തെറ്റ്. പഞ്ചസാര മനസ്സ് തെളിയിച്ചില്ല; ഒരു മണിക്കൂറിനുള്ളിൽ ആളുകൾക്ക് കൂടുതൽ ക്ഷീണം തോന്നി.',
  p4w2: 'ശരി. ഏറ്റവും നന്നായി തെളിയിക്കപ്പെട്ട ശീലങ്ങളിലൊന്നാണിത്. കഠിനമായ പരിശീലനത്തിന് മുൻപ്, പ്രത്യേകിച്ച് രോഗമുണ്ടെങ്കിൽ, ഡോക്ടറോട് ചോദിക്കൂ.',
  p4w3: 'തെറ്റ്. ഒപ്പം കയറാനുള്ള നല്ല അസൂയ, പരീക്ഷണങ്ങളിൽ ആളുകളെ കൂടുതൽ പരിശ്രമിപ്പിച്ചു.',
  p4w4: 'ശരി. നിർത്തുമ്പോഴുള്ള തലവേദന സാധാരണമാണ്, ദിവസങ്ങൾക്കുള്ളിൽ മാറും. എങ്കിലും കാപ്പി കുടിക്കുന്നവരിൽ വിഷാദം അല്പം കുറവാണ്; ദീർഘകാല ചിത്രം വ്യക്തമല്ല.',
});
const PRACTICE = [
  { id: 'p-swap', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-single', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 0, L('p2y'), [null, L('p2nb'), L('p2nc')]) },
  { id: 'p-habit', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 2, L('p3y'), [L('p3na'), L('p3nb'), null]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['f'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['t'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['t'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
