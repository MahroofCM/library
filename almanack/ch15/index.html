Object.assign(TXT.ml, {
  q1p: 'മസ്കത്തിലെ അജ്മലിന് രണ്ട് വർഷമായി ഓഫീസിലേക്കുള്ള തൊണ്ണൂറ് മിനിറ്റ് ഡ്രൈവ് വെറുപ്പാണ്. ദിവസവും പരാതി പറയും; പക്ഷേ അടുത്തൊരു ഫ്ലാറ്റോ പുതിയ ജോലിയോ നോക്കിയിട്ടില്ല. നവൽ എന്ത് പറയും?',
  q1a: 'പരാതി തുടരുക: അവൻ സത്യസന്ധനാണല്ലോ.',
  q1b: 'ഒന്ന് തിരഞ്ഞെടുക്കുക: മാറ്റുക (അടുത്തേക്ക് താമസം), വിടുക (പുതിയ ജോലി), അല്ലെങ്കിൽ സ്വീകരിച്ച് ഡ്രൈവ് ഉപയോഗപ്പെടുത്തുക. വെറുതെ ആഗ്രഹിക്കൽ നിർത്തുക.',
  q1c: 'ജോലിയും ഫ്ലാറ്റും കാറും ഭക്ഷണരീതിയും, എല്ലാം ഈ മാസം തന്നെ മാറ്റുക.',
  q1y: 'ശരി. മാറ്റാം, സ്വീകരിക്കാം, വിടാം: മൂന്നും കൊള്ളാം. ഒന്നും ചെയ്യാതെ ആഗ്രഹിച്ചുനിൽക്കുന്ന ഇടയിലെ കുടുക്കിലാണ് ദുരിതം വളരുന്നത്.',
  q1na: 'സത്യസന്ധം തന്നെ, പക്ഷേ ഇതാണ് ഇടയിലെ കുടുക്ക്: മാറ്റാതെ, വിടാതെ, സ്വീകരിക്കാതെ, വേറെയായിരുന്നെങ്കിൽ എന്ന് ആഗ്രഹിക്കൽ.',
  q1nc: 'ഓരോ മാറ്റവും നടക്കുംവരെ നോവുന്ന ഓരോ ആഗ്രഹമാണ്. ഒരുമിച്ച് പലതായാൽ മനസ്സ് ചിതറും; ഒന്ന് തിരഞ്ഞെടുക്കൂ.',
  q2p: 'ഷാർജയിൽ കോളേജിലേക്കുള്ള വഴിയിൽ ഹിബയുടെ ബസ് കേടാകുന്നു. ഇരുപത് മിനിറ്റ് വൈകും; അവൾക്ക് ആദ്യത്തെ ഒരു അലോസരം തോന്നുന്നു. ഏത് ചിന്തയാണ് നവലിന്റെ സൂത്രത്തിന് ചേരുന്നത്?',
  q2a: '“ശരി. ഇതിൽ എന്താണ് നല്ലത്? ഇന്നലെ വിട്ടുപോയ വായന തീർക്കാമല്ലോ.”',
  q2b: '“ബസ് കമ്പനിക്ക് ഇപ്പോൾത്തന്നെ ദേഷ്യത്തോടെ ഒരു റിവ്യൂ ഇടും.”',
  q2c: '“എനിക്ക് ഒട്ടും അലോസരമില്ല.”',
  q2y: 'ശരി. ആ മിന്നൽ എന്തായാലും വരും; പിന്നാലെ വരുന്ന ചോദ്യമാണ് സൂത്രം: ഇതിൽ നല്ലതെന്ത്?',
  q2nb: 'അത് ആ മിന്നലിന് എണ്ണ ഒഴിക്കലാണ്. ആ നിമിഷത്തിൽ നല്ലതെന്തെന്ന് ചോദിച്ച് അത് ഉപയോഗിക്കുന്നതാണ് നവലിന്റെ സൂത്രം.',
  q2nc: 'ആ മിന്നൽ ഇല്ലെന്ന് നവൽ നടിക്കുന്നില്ല. അത് ശ്രദ്ധിക്കുന്നു, പിന്നെ നല്ലതെന്തെന്ന് ചോദിക്കുന്നു.',
  q3p: 'ഒരു കല്യാണത്തിലെ ചെറിയൊരു അവഗണനയുടെ പേരിൽ ഷഫീഖ് ആറ് മാസമായി കസിനോട് മിണ്ടുന്നില്ല. മരണത്തെയും മിന്നാമിനുങ്ങിനെയും കുറിച്ചുള്ള ആശയങ്ങൾ വച്ച് നവൽ എന്ത് പറയും?',
  q3a: 'വാദം ജയിക്കുക, താനാണ് ശരി എന്ന് കുടുംബം ഓർക്കാൻ.',
  q3b: 'ചെറിയൊരു ജീവിതത്തിനു മുന്നിൽ ഇത് എത്ര ചെറുതാണെന്ന് കാണുക; വിട്ടുകളയുക, ആ സമയം പ്രധാനപ്പെട്ടതിന് ചെലവാക്കുക.',
  q3c: 'എല്ലാം പൊടിയാകുമല്ലോ, അതുകൊണ്ട് ഒന്നിനെക്കുറിച്ചും ശ്രദ്ധിക്കാതിരിക്കുക.',
  q3y: 'ശരി. ഈഗോ വഴക്കുകൾ നമ്മുടെ ചെറുതും വിലപ്പെട്ടതുമായ സമയം തിന്നുന്നു. ആസ്വദിക്കൂ, ദയ കാണിക്കൂ, ജോലി ചെയ്യൂ.',
  q3na: 'കാലക്രമേണ ആരാണ് ശരി എന്ന് ആരും ഓർക്കില്ല. ആ പിണക്കം അവന്റെ ചെറിയ സമയം ചെലവാക്കുന്നു എന്നു മാത്രം.',
  q3nc: 'ശ്രദ്ധിക്കാതിരിക്കലല്ല കാര്യം. ഈഗോ വഴക്കുകൾ വിട്ട്, സമയം നന്നായി ചെലവാക്കലാണ്.',
  p1p: 'ഏത് സാഹചര്യത്തിലും മൂന്ന് നല്ല വഴികളുണ്ടെന്ന് നവൽ പറയുന്നു. ഇവയിൽ ഏതാണ് അതിൽ പെടാത്തത്?',
  p1a: 'മാറ്റുക', p1b: 'സ്വീകരിക്കുക', p1c: 'മാറ്റാതെ, വിടാതെ, സ്വീകരിക്കാതെ, വേറെയായിരുന്നെങ്കിൽ എന്ന് ആഗ്രഹിക്കുക', p1d: 'വിട്ടുപോവുക',
  p1y: 'ശരി. നവൽ മുന്നറിയിപ്പ് നൽകുന്നത് ഈ ഇടയിലെ കുടുക്കിനെക്കുറിച്ചാണ്: അത് മല്ലിടൽ തുടരിക്കുന്നു.',
  p1na: 'മാറ്റൽ നവലിന്റെ മൂന്ന് വഴികളിൽ ഒന്നാണ്. ചെയ്യാതെ ആഗ്രഹിക്കുന്നതാണ് പ്രശ്നം.',
  p1nb: 'സ്വീകരിക്കൽ മൂന്നിൽ ഒന്നാണ്: നവൽ സ്വയം ഏറ്റവും കൂടുതൽ പറയുന്ന വാക്ക്.',
  p1nd: 'വിട്ടുപോകലും മൂന്നിൽ ഒന്നാണ്, സമീറയ്ക്ക് മസ്കത്തിലുള്ള ഒഴിവ് പോലെ.',
  p2p: 'ചെറിയൊരു ശല്യം വരുമ്പോൾ നവൽ സ്വയം എന്താണ് ചോദിക്കുന്നത്?',
  p2a: 'ഇത് ആരുടെ കുറ്റമാണ്?', p2b: 'ഇതിൽ എന്താണ് നല്ലത്?', p2c: 'എങ്ങനെ തിരിച്ചടിക്കാം?',
  p2y: 'അതെ. ഒന്നും നല്ലതായി തോന്നിയില്ലെങ്കിൽ: “ജീവിതം എന്തോ പഠിപ്പിക്കാൻ പോകുന്നു.”',
  p2na: 'കുറ്റം ചാർത്തൽ ശല്യത്തെ ജീവനോടെ നിർത്തും. പകരം അതിലെ നല്ലതാണ് നവൽ തിരയുന്നത്.',
  p2nc: 'തിരിച്ചടി ആ മിന്നലിന് എണ്ണ ഒഴിക്കും. ഇതിൽ നല്ലതെന്ത് എന്ന് ചോദിക്കുന്നതാണ് സൂത്രം.',
  p3p: 'കൊച്ചിയിലെ റഫീഖിന്റെ ഇലക്ട്രോണിക്സ് കടയിലെ വിൽപ്പന കുറയുന്നു; സ്ഥിരം ഉപഭോക്താക്കളെ വിളിക്കുന്നത് അവൻ നിർത്തിയതാണ് കാരണം. “എല്ലാം നല്ലതിനാണ്” എന്ന് അവൻ സ്വയം പറയുന്നു. ഈ അധ്യായം എന്ത് നിർദേശിക്കുന്നു?',
  p3a: 'നല്ല റീഫ്രെയിമിങ്: അത് തന്നെ പറഞ്ഞുകൊണ്ടിരിക്കട്ടെ.',
  p3b: 'ഇത് അവന് മാറ്റാനാകുന്നതാണ്: ഉപഭോക്താക്കളെ വിളിക്കുക. റീഫ്രെയിമിങ് നിയന്ത്രണത്തിലില്ലാത്തതിന് വേണ്ടി വയ്ക്കുക.',
  p3c: 'കട ഉടനെ അടച്ചുപൂട്ടണം.',
  p3y: 'ശരി. പരിഹരിക്കാവുന്ന പ്രശ്നത്തെ റീഫ്രെയിം ചെയ്താൽ, അത് പരിഹരിക്കാതെ പോയേക്കാം. മാറ്റാനാകുന്നത് മാറ്റൂ.',
  p3na: '170 മുതിർന്നവരിലെ പഠനത്തിൽ, നിയന്ത്രിക്കാവുന്ന സമ്മർദം നേരിട്ട നല്ല റീഫ്രെയിമർമാർക്ക് വിഷാദം കൂടുതലായിരുന്നു. ഇവിടെ പരിഹാരം അവന്റെ കൈയിലാണ്.',
  p3nc: 'വിട്ടുപോകൽ ഒരു വഴിയാണ്, പക്ഷേ ആദ്യം ലളിതമായൊരു മാറ്റം അവന്റെ കൈയിലുണ്ട്.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'വിഷമമുള്ള വികാരങ്ങളെ വിധിക്കാതെ സ്വീകരിക്കുന്ന ശീലമുള്ളവർക്ക് പൊതുവെ മാനസികാരോഗ്യം മെച്ചമാണ്.',
  p4r2: 'സമ്മർദമുള്ള സംഭവം നിയന്ത്രിക്കാനാകുമോ ഇല്ലയോ എന്നത് നോക്കാതെ, റീഫ്രെയിമിങ് ഒരുപോലെ സഹായിക്കും.',
  p4r3: 'മരണത്തിന്റെ ചെറിയ ഓർമപ്പെടുത്തലുകൾ ആളുകളുടെ പെരുമാറ്റം മാറ്റുമെന്ന് 21 ലാബുകളിലെ ആവർത്തനം ഉറപ്പിച്ചു.',
  p4r4: 'സ്വീകരിക്കലിൽ ഊന്നിയ ആക്ട് (ACT) ചികിത്സ, വെയിറ്റിങ് ലിസ്റ്റിനെക്കാളും സാധാരണ ചികിത്സയെക്കാളും നന്നായി ഫലിച്ചിട്ടുണ്ട്.',
  p4w1: 'ശരി. ഏകദേശം 1,400 പേരിലെ മൂന്ന് പഠനങ്ങളിൽ, വികാരങ്ങളെ സ്വീകരിക്കൽ മെച്ചപ്പെട്ട മാനസികാരോഗ്യത്തിനൊപ്പം കണ്ടു; ഭാഗികമായി, സമ്മർദം അവരെ കുറച്ചേ ഉലച്ചുള്ളൂ.',
  p4w2: 'തെറ്റ്. സമ്മർദം നിയന്ത്രണത്തിന് പുറത്തായപ്പോൾ നല്ല റീഫ്രെയിമർമാർക്ക് വിഷാദം കുറവായിരുന്നു; നിയന്ത്രണത്തിലായപ്പോൾ കൂടുതലും.',
  p4w3: 'തെറ്റ്. ഇരുപത്തൊന്ന് ലാബുകളിലും രണ്ടായിരത്തിലേറെ ആളുകളിലും ഫലമൊന്നും കണ്ടില്ല.',
  p4w4: 'ശരി. പന്ത്രണ്ടായിരത്തിലേറെ ആളുകളിലെ ഇരുപത് അവലോകനങ്ങൾ ഇത് കാണിക്കുന്നു; സിബിടിയോളം ഫലവും.',
});
const PRACTICE = [
  { id: 'p-three', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')], [L('p1d')]], 2, L('p1y'), [L('p1na'), L('p1nb'), null, L('p1nd')]) },
  { id: 'p-hack', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 1, L('p2y'), [L('p2na'), null, L('p2nc')]) },
  { id: 'p-reframe', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['t'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
