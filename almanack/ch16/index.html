  q1na: 'പകർത്തിയാൽ അവൾ മറ്റൊരാളുടെ രണ്ടാംതരം പതിപ്പാകും. നിങ്ങളാകുന്നതിൽ നിങ്ങളെ ആരും തോൽപ്പിക്കില്ല.',
  q1nc: 'മറ്റുള്ളവരെ കേൾക്കാനും പഠിക്കാനുമാണ് നവൽ പറയുന്നത്; അനുകരിക്കരുത് എന്ന് മാത്രം.',
  q2p: 'ദുബായിലെ ഒരു കഫ്റ്റീരിയയിൽ ഊണ് കഴിഞ്ഞ് ഫൈസൽ ഒരു കഷണം കുനാഫയും മധുരച്ചായയും കഴിക്കും; നാലുമണിയോടെ വീണ്ടും വിശക്കും. പ്രമേഹത്തിന് മരുന്നും കഴിക്കുന്നുണ്ട്. അധ്യായത്തിനും തെളിവുകൾക്കും ചേരുന്ന ആദ്യപടി ഏത്?',
  q2a: 'ബേക്കൺ നിറഞ്ഞ കീറ്റോ ഡയറ്റിലേക്ക് മാറുക; കൊഴുപ്പ് വയർ നിറച്ചുവയ്ക്കും.',
  q2b: 'കുനാഫ-മധുരച്ചായ ശീലം നിർത്തുക, സംസ്കരിച്ച പലഹാരങ്ങൾ കുറയ്ക്കുക; വലിയ ഡയറ്റ് മാറ്റങ്ങൾ ഡോക്ടറോട് ചോദിച്ച് മാത്രം.',
  q2c: 'ഈ ആഴ്ച മുതൽ ഒന്നിടവിട്ട ദിവസങ്ങളിൽ സ്വന്തം ഇഷ്ടത്തിന് ഉപവസിക്കുക.',
  q2y: 'ശരി. പഞ്ചസാര-കൊഴുപ്പ് ജോടി അമിതമായി തീറ്റിക്കും, സംസ്കരിച്ച ഭക്ഷണം കലോറി കൂട്ടും; പ്രമേഹമരുന്ന് കഴിക്കുന്നതിനാൽ വലിയ മാറ്റങ്ങൾ ഡോക്ടർ അറിയണം.',
  q2na: 'ആശുപത്രി പരീക്ഷണത്തിൽ കീറ്റോയിൽ ആളുകൾ ദിവസം 700 കലോറിയോളം കൂടുതൽ കഴിച്ചു; പ്രമേഹമരുന്നിനിടെ വലിയ മാറ്റത്തിന് ഡോക്ടർ വേണം.',
  q2nc: 'ഒരു വർഷത്തെ പരീക്ഷണത്തിൽ ഉപവാസം എളുപ്പമായില്ല; പ്രമേഹമരുന്ന് കഴിക്കുമ്പോൾ ഡോക്ടറില്ലാതെ അത് അപകടവുമാകാം.',
  q3p: 'ക്ലാസും പേപ്പർ നോക്കലും കുടുംബവും കാരണം വ്യായാമത്തിന് സമയമില്ലെന്ന് നിഷ പറയുന്നു. നവൽ എന്ത് പറയും?',
  q3a: 'ന്യായം തന്നെ. വേനലവധി വരെ കാത്തിരിക്കട്ടെ.',
  q3b: '“സമയമില്ല” എന്നാൽ “മുൻഗണനയല്ല”. ആരോഗ്യം ആദ്യമെങ്കിൽ, ഇഷ്ടമുള്ളത് (ഒരു ചെറിയ നടത്തമായാലും) മിക്ക ദിവസവും ചെയ്യാം.',
  q3c: 'ജിമ്മിൽ ഒരു മണിക്കൂർ മുഴുവൻ ചെയ്താലേ കണക്കിലുള്ളൂ; അതുകൊണ്ട് കാര്യമില്ല.',
  q3y: 'ശരി. ആരോഗ്യം മുൻഗണനയാക്കിയാൽ സമയം ഉണ്ടാകും. ഇഷ്ടമുള്ള ഏത് തരവും കണക്കിലുണ്ട്; എത്ര കുറച്ചായാലും ഒന്നുമില്ലാത്തതിനെക്കാൾ നല്ലത്.',
  q3na: '“സമയമില്ല” എന്നത് നവൽ കേൾക്കുന്നത് “മുൻഗണനയല്ല” എന്നാണ്. മാസങ്ങൾ കാത്തിരുന്നാൽ ശീലം പോകും.',
  q3nc: 'ഏത് തരം എന്നതിനെക്കാൾ ചെയ്യുന്നതാണ് പ്രധാനം. ആഴ്ചയിൽ ഒന്നോ രണ്ടോ തവണ പോലും ഒന്നുമില്ലാത്തതിനെക്കാൾ നല്ലത്.',
  p1p: 'നിങ്ങൾ ആരാധിക്കുന്നവരെക്കുറിച്ച് നവൽ എന്ത് പറയുന്നു?',
  p1a: 'അവരെ പറ്റുന്നത്ര അടുത്ത് പകർത്തുക.',
  p1b: 'അവരെ കേൾക്കൂ, പഠിക്കൂ, പക്ഷേ പകർത്തരുത്: നിങ്ങളാകുന്നതിൽ നിങ്ങളെ ആരും തോൽപ്പിക്കില്ല.',
  p1c: 'അവർ സ്വാധീനിക്കാതിരിക്കാൻ അവരെ ഒഴിവാക്കുക.',
  p1y: 'അതെ. അവരിൽ നിന്ന് പഠിക്കൂ; പിന്നെ നിങ്ങളെ ഏറ്റവും ആവശ്യമുള്ള ജോലി കണ്ടെത്തൂ.',
  p1na: 'അവരാകുന്നതിൽ അവരോളം നിങ്ങൾ ഒരിക്കലും നന്നാവില്ല. പഠിക്കൂ, അനുകരിക്കരുത്.',
  p1nc: 'കേൾക്കാനും ഉൾക്കൊള്ളാനുമാണ് നവൽ പറയുന്നത്. അവരായിത്തീരാൻ ശ്രമിക്കരുത് എന്ന് മാത്രം.',
  p2p: 'നവലിന്റെ മുൻഗണനാക്രമത്തിൽ ഒന്നാമത് എന്താണ്?',
  p2a: 'അദ്ദേഹത്തിന്റെ ജോലി', p2b: 'കുടുംബത്തിന്റെ ക്ഷേമം', p2c: 'സ്വന്തം ശാരീരികാരോഗ്യം', p2d: 'അദ്ദേഹത്തിന്റെ സന്തോഷം',
  p2y: 'അതെ. ആദ്യം ശരീരം, പിന്നെ മനസ്സും ആത്മാവും, പിന്നെ കുടുംബം, പിന്നെ ലോകം.',
  p2na: 'സ്വന്തം ആരോഗ്യത്തിനും കുടുംബത്തിന്റേതിനും ശേഷമാണ് ജോലി.',
  p2nb: 'കുടുംബത്തിന്റെ ക്ഷേമം അഞ്ചാമതാണ്; സ്വന്തം ആരോഗ്യത്തിനും കുടുംബത്തിന്റെ ആരോഗ്യത്തിനും ശേഷം.',
  p2nd: 'സന്തോഷത്തിനും മുകളിലാണ് അദ്ദേഹം സ്വന്തം ആരോഗ്യം വയ്ക്കുന്നത്.',
  p3p: 'കൊച്ചിയിലെ റഫീഖിന് ക്ഷീണമുണ്ട്; ഊർജത്തിന് മൂന്ന് സപ്ലിമെന്റുകൾ വാങ്ങാൻ പ്ലാൻ ചെയ്യുന്നു. “കൂട്ടുംമുമ്പ് കുറയ്ക്കൂ” എന്നതിന്റെ നിർദേശം എന്ത്?',
  p3a: 'ഗുളികകൾ കൂട്ടുംമുമ്പ്, രാത്രിയിലെ മധുരവും സോഫ്റ്റ് ഡ്രിങ്കും പോലെ എന്തെങ്കിലും ഒഴിവാക്കുക.',
  p3b: 'എന്ത് കഴിച്ചാലും ഓരോ ഊണും പകുതിയാക്കുക.',
  p3c: 'സപ്ലിമെന്റുകൾക്ക് ഇടം കിട്ടാൻ ബിപിയുടെ ഗുളിക നിർത്തുക.',
  p3y: 'അതെ. ദോഷമുള്ളത് ആദ്യം ഒഴിവാക്കൂ; മരുന്ന് കഴിക്കുന്നുണ്ടെങ്കിൽ പുതിയ സപ്ലിമെന്റുകൾ ഡോക്ടറോട് ചോദിച്ച് മാത്രം.',
  p3na: 'എത്ര കഴിക്കുന്നു എന്നതിനു മുമ്പ് എന്ത് കഴിക്കുന്നു എന്നതാണ് നവലിന്. ജങ്ക് പകുതിയാക്കിയാലും ജങ്ക് തന്നെ.',
  p3nc: 'ഡോക്ടർ തന്ന മരുന്ന് ഒരിക്കലും സ്വയം നിർത്തരുത്. ഡോക്ടറോട് സംസാരിക്കൂ.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'നെതർലൻഡ്സിലെ പരീക്ഷണത്തിൽ, കുളിയുടെ അവസാനം തണുത്ത വെള്ളം രോഗാവധി കുറച്ചു; പക്ഷേ അസുഖമുള്ള ദിവസങ്ങൾ കുറച്ചില്ല.',
  p4r2: 'ഇഷ്ടംപോലെ കഴിക്കാമായിരുന്നപ്പോൾ, കീറ്റോയിൽ ആളുകൾ കൊഴുപ്പ് കുറഞ്ഞ സസ്യാഹാരത്തെക്കാൾ കുറച്ച് കലോറി കഴിച്ചു.',
  p4r3: 'ഒരു വർഷത്തെ പരീക്ഷണത്തിൽ, ഭാരം കുറയ്ക്കാൻ ഒന്നിടവിട്ട ദിവസങ്ങളിലെ ഉപവാസം ദിവസേനയുള്ള കലോറി കുറയ്ക്കലിനെ തോൽപ്പിച്ചു.',
  p4r4: 'ആഴ്ചയിൽ ഒന്നോ രണ്ടോ തവണ വ്യായാമം ചെയ്ത വീക്കെൻഡ് വാരിയേഴ്സിന്, അലസരെക്കാൾ മരണനിരക്ക് കുറവായിരുന്നു.',
  p4w1: 'ശരി. രോഗാവധി 29% കുറഞ്ഞു; അസുഖ ദിവസങ്ങൾ മാറിയില്ല.',
  p4w2: 'തെറ്റ്. കീറ്റോയിൽ ദിവസം 700 കലോറിയോളം കൂടുതലാണ് അവർ കഴിച്ചത്.',
  p4w3: 'തെറ്റ്. ഭാരക്കുറവ് ഏതാണ്ട് ഒരുപോലെ; ഉപവാസം പാതിവഴിയിൽ നിർത്തിയവർ കൂടുതലും.',
  p4w4: 'ശരി. ഏകദേശം 30% കുറവ്; പതിവായി ചെയ്യുന്നവരോട് ഏറെ അടുത്ത്.',
});
const PRACTICE = [
  { id: 'p-copy', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-first', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')], [L('p2d')]], 2, L('p2y'), [L('p2na'), L('p2nb'), null, L('p2nd')]) },
  { id: 'p-subtract', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 0, L('p3y'), [null, L('p3na'), L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['t'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
