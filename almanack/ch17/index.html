  q1y: 'Right. The tiptoeing is where most of the suffering lives. The call will be hard, but brief.',

  q1nc: 'Dodging the feeling is still avoidance. Step in, feel it, and it passes.',
  q2p: 'On his walk at Al Mamzar, Faisal sees a man taking twenty selfies and thinks, “What a show-off.” What does choiceless awareness ask of him?',
  q2a: 'Notice the judgment, look for the fear under it, and let it pass, without judging himself either.',

  q2nb: 'Scolding is just another judgment. The practice is to notice and accept, not to fight.',
  q2nc: 'Hiding doesn’t train the mind. The practice happens out in the world, among people.',

  q3b: 'Get angry at herself for being so distracted.',

  q3y: 'Right. Catch it, ask, come back. She can give the landlord her full focus tomorrow.',
  q3na: 'That is the monkey running the show. It doesn’t need solving now; she can focus on it when the time comes.',
  q3nb: 'Anger at herself is the monkey again. Just notice, ask, and come back.',
  p1p: 'Naval compares meditation to intermittent fasting. What is the mind fasting from?',
  p1a: 'Food', p1b: 'Distractions: pings, feeds and other voices', p1c: 'Sleep',
  p1y: 'Right. Time alone, undistracted, lets a heavy mind get light.',
  p1na: 'The fast is for the mind, not the stomach: it skips distractions.',
  p1nc: 'Sleep isn’t the problem. The mind fasts from pings, feeds and voices.',
  p2p: 'What does “choiceless awareness” mean?',
  p2a: 'Noticing each moment without judging, deciding or fixing', p2b: 'Choosing to think only pleasant thoughts', p2c: 'Forcing the mind to go completely blank',
  p2y: 'Right. You notice and accept, and judgments, with the fears under them, fade on their own.',
  p2nb: 'Picking pleasant thoughts is still choosing. This practice drops the choosing.',

  p3nc: 'Busyness keeps the inbox full. Stillness lets things surface.',

Object.assign(TXT.ml, {
  q1p: 'അച്ഛൻ കോഴിക്കോട്ട് ശരിയാക്കിയ ഒരു ജോലി വേണ്ടെന്ന് നിഷ തീരുമാനിച്ചു. അത് അച്ഛനോട് പറയണം; ഒരാഴ്ചയായി ആ ഫോൺ കോൾ അവൾ മാറ്റിവയ്ക്കുന്നു, ദിവസവും പേടിച്ച്. തണുത്ത കുളിയുടെ പാഠം എന്ത് പറയും?',
  q1a: 'എത്ര നാൾ എടുത്താലും, പൂർണമായി തയ്യാറാണെന്ന് തോന്നുംവരെ കാത്തിരിക്കുക.',
  q1b: 'നേരെ കയറുക: ഇന്നുതന്നെ വിളിക്കുക. വേദനയുടെ ഏറിയ പങ്കും പേടിയിലാണ്, കോളിലല്ല.',
  q1c: 'ഒന്നും അനുഭവിക്കേണ്ടിവരാതിരിക്കാൻ, പകരം ഒരു നീണ്ട മെസേജ് അയയ്ക്കുക.',
  q1y: 'ശരി. ദുരിതത്തിന്റെ ഏറിയ പങ്കും ആ മടിച്ചുനിൽപ്പിലാണ്. കോൾ കഠിനമായിരിക്കും, പക്ഷേ ചുരുങ്ങിയ നേരം മാത്രം.',
  q1na: 'കാത്തിരിപ്പാണ് ആ മടിച്ചുനിൽപ്പ്: ഇതിനകം ഒരാഴ്ചത്തെ പേടി, അത് വളരുകയും ചെയ്യും. നേരെ കയറുക എന്നതാണ് പാഠം.',
  q1nc: 'വികാരത്തിൽ നിന്ന് ഒഴിഞ്ഞുമാറലും ഒഴിവാക്കൽ തന്നെ. നേരെ കയറൂ, അനുഭവിക്കൂ; അത് കടന്നുപോകും.',
  q2p: 'അൽ മംസറിലെ നടത്തത്തിനിടെ ഒരാൾ ഇരുപത് സെൽഫി എടുക്കുന്നത് ഫൈസൽ കാണുന്നു; “എന്തൊരു ഷോ” എന്ന് ചിന്തിക്കുന്നു. തിരഞ്ഞെടുപ്പില്ലാത്ത ശ്രദ്ധ അവനോട് എന്ത് ആവശ്യപ്പെടുന്നു?',
  q2a: 'ആ വിധി ശ്രദ്ധിക്കുക, അതിനടിയിലെ ഭയം നോക്കുക, അത് കടന്നുപോകട്ടെ; സ്വയം വിധിക്കാതെയും.',
  q2b: 'ചിന്ത പോകുംവരെ, വിധിച്ചതിന് സ്വയം ശകാരിക്കുക.',
  q2c: 'ആരെയും വിധിക്കാതിരിക്കാൻ, ആളുള്ള സ്ഥലങ്ങളിൽ നടക്കുന്നത് നിർത്തുക.',
  q2y: 'ശരി. ശ്രദ്ധിക്കൂ, പൊരുതരുത്. വ്യക്തമായി കണ്ടാൽ ആ വിധിയും അതിനടിയിലെ ഭയവും മങ്ങും.',
  q2nb: 'ശകാരവും മറ്റൊരു വിധി തന്നെ. ശ്രദ്ധിച്ച് സ്വീകരിക്കലാണ് പരിശീലനം, പൊരുതലല്ല.',
  q2nc: 'ഒളിച്ചിരുന്നാൽ മനസ്സ് പരിശീലിക്കില്ല. ഈ പരിശീലനം നടക്കുന്നത് ആളുകൾക്കിടയിൽ, ലോകത്തിലാണ്.',
  q3p: 'ദോഹയിൽ പല്ല് തേക്കുന്നതിനിടെ, നാളെ വീട്ടുടമയുമായുള്ള തർക്കം വരിവരിയായി താൻ റിഹേഴ്സ് ചെയ്യുകയാണെന്ന് ഹിബ ശ്രദ്ധിക്കുന്നു. നവലിന്റെ ഡീബഗ് മോഡ് എന്ത് നിർദേശിക്കും?',
  q3a: 'റിഹേഴ്സൽ തുടരുക: അയാൾ പറഞ്ഞേക്കാവുന്ന എല്ലാറ്റിനും ഉത്തരം ഒരുക്കുക.',
  q3b: 'ഇത്ര ശ്രദ്ധ ചിതറിയതിന് സ്വയം ദേഷ്യപ്പെടുക.',
  q3c: 'ഭാവിയിലേക്ക് ഓടുകയാണെന്ന് ശ്രദ്ധിക്കുക, “ഇത് ഇപ്പോൾ പരിഹരിക്കണോ?” എന്ന് ചോദിക്കുക, പല്ല് തേക്കലിലേക്ക് തിരിച്ചുവരിക.',
  q3y: 'ശരി. പിടികൂടൂ, ചോദിക്കൂ, തിരിച്ചുവരൂ. നാളെ വീട്ടുടമയ്ക്ക് അവൾക്ക് മുഴുവൻ ശ്രദ്ധയും കൊടുക്കാം.',
  q3na: 'അത് കുരങ്ങൻ ഭരിക്കുന്നതാണ്. ഇപ്പോൾ പരിഹരിക്കേണ്ടതില്ല; സമയം വരുമ്പോൾ അതിൽ ശ്രദ്ധിക്കാം.',
  q3nb: 'സ്വയം ദേഷ്യപ്പെടുന്നതും കുരങ്ങൻ തന്നെ. വെറുതെ ശ്രദ്ധിക്കൂ, ചോദിക്കൂ, തിരിച്ചുവരൂ.',
  p1p: 'നവൽ ധ്യാനത്തെ ഇടവിട്ട ഉപവാസത്തോട് ഉപമിക്കുന്നു. മനസ്സ് എന്തിൽ നിന്നാണ് ഉപവസിക്കുന്നത്?',
  p1a: 'ഭക്ഷണം', p1b: 'ശ്രദ്ധ ചിതറിക്കുന്നവ: നോട്ടിഫിക്കേഷൻ, ഫീഡ്, മറ്റുള്ളവരുടെ ബഹളം', p1c: 'ഉറക്കം',
  p1y: 'ശരി. ശ്രദ്ധ ചിതറാതെ ഒറ്റയ്ക്കുള്ള സമയം ഭാരമുള്ള മനസ്സിനെ ലഘുവാക്കും.',
  p1na: 'ഈ ഉപവാസം വയറിനല്ല, മനസ്സിനാണ്: ശ്രദ്ധ ചിതറിക്കുന്നവ ഒഴിവാക്കൽ.',
  p1nc: 'ഉറക്കമല്ല പ്രശ്നം. നോട്ടിഫിക്കേഷനും ഫീഡും ബഹളവുമാണ് മനസ്സ് ഒഴിവാക്കുന്നത്.',
  p2p: '“തിരഞ്ഞെടുപ്പില്ലാത്ത ശ്രദ്ധ” എന്നതിന്റെ അർഥം എന്ത്?',
  p2a: 'ഓരോ നിമിഷവും വിധിക്കാതെ, തീരുമാനിക്കാതെ, ശരിയാക്കാതെ ശ്രദ്ധിക്കൽ', p2b: 'നല്ല ചിന്തകൾ മാത്രം ചിന്തിക്കാൻ തിരഞ്ഞെടുക്കൽ', p2c: 'മനസ്സിനെ നിർബന്ധിച്ച് പൂർണമായി ശൂന്യമാക്കൽ',
  p2y: 'ശരി. ശ്രദ്ധിച്ച് സ്വീകരിക്കുമ്പോൾ, വിധികളും അവയ്ക്കടിയിലെ ഭയങ്ങളും തനിയെ മങ്ങും.',
  p2nb: 'നല്ല ചിന്തകൾ തിരഞ്ഞെടുക്കലും ഒരു തിരഞ്ഞെടുപ്പാണ്. ഈ പരിശീലനം തിരഞ്ഞെടുപ്പ് തന്നെ ഉപേക്ഷിക്കുന്നു.',
  p2nc: 'നിർബന്ധിക്കൽ ഒരു പൊരുതലാണ്. ഈ ശ്രദ്ധ വെറുതെ നോക്കുന്നു.',
  p3p: 'നവലിന്റെ “ഇൻബോക്സ്” ചിത്രത്തിൽ, പഴയ തീരാത്ത കാര്യങ്ങൾ എങ്ങനെയാണ് ഒഴിയുന്നത്?',
  p3a: 'ഓരോന്നിലും ദിവസവും ശക്തിയായി കുഴിച്ചുനോക്കി',
  p3b: 'അനങ്ങാതെ ഇരുന്ന്, എതിർക്കാതെ, ഒരു മുതിർന്നയാളുടെ അകലത്തോടെ അവ പൊങ്ങിവരുന്നത് നോക്കി',
  p3c: 'അവ ഒരിക്കലും പൊങ്ങിവരാതിരിക്കാൻ തിരക്കിലായി',
  p3y: 'ശരി. നോക്കൽ, ശരിയാക്കലല്ല. വേദനിപ്പിക്കുന്നത് എന്തെങ്കിലും വന്ന് മാറാതെ നിന്നാൽ, ഡോക്ടർക്കോ കൗൺസലർക്കോ സഹായിക്കാനാകും.',
  p3na: 'നവലിന്റെ രീതിക്ക് ഒരു ശ്രമവും വേണ്ട: അവ പൊങ്ങിവന്ന് അടങ്ങുന്നത് നോക്കിയാൽ മതി.',
  p3nc: 'തിരക്ക് ഇൻബോക്സ് നിറച്ചുതന്നെ വയ്ക്കും. നിശ്ചലതയിലാണ് അവ പൊങ്ങിവരുന്നത്.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'ഒരു പരീക്ഷണത്തിൽ, ദിവസവും 13 മിനിറ്റ് ധ്യാനിച്ച തുടക്കക്കാർക്ക് 8 ആഴ്ച കഴിഞ്ഞപ്പോൾ മൂഡും ശ്രദ്ധയും മെച്ചപ്പെട്ടു.',
  p4r2: 'വിം ഹോഫ് രീതിയിലുള്ള വേഗത്തിലുള്ള ശ്വസനം രക്തത്തിൽ കൂടുതൽ ഓക്സിജൻ നിറയ്ക്കും.',
  p4r3: 'ധ്യാനത്തിന് ഒരിക്കലും അസുഖകരമായ പാർശ്വഫലങ്ങൾ ഉണ്ടാകില്ല.',
  p4r4: 'ഒരു ഡച്ച് പരീക്ഷണത്തിൽ, കുളി തണുത്ത വെള്ളത്തിൽ അവസാനിപ്പിച്ചവർ അസുഖ അവധി കുറച്ചേ എടുത്തുള്ളൂ; പക്ഷേ അസുഖം വന്നത് ഒരുപോലെ.',
  p4w1: 'ശരി. നാല് ആഴ്ചയിൽ മാറ്റം കണ്ടില്ല; എട്ട് ആഴ്ച കഴിഞ്ഞപ്പോൾ മൂഡും ശ്രദ്ധയും മെച്ചപ്പെട്ടു, ഉത്കണ്ഠ കുറഞ്ഞു.',
  p4w2: 'തെറ്റ്. അത് കാർബൺ ഡൈ ഓക്സൈഡിനെ പുറന്തള്ളുന്നു; ശ്വാസം പിടിച്ചുനിർത്തുമ്പോൾ ഓക്സിജൻ കുറയുന്നു. ഒരിക്കലും വെള്ളത്തിൽ ചെയ്യരുത്.',
  p4w3: 'തെറ്റ്. 83 പഠനങ്ങളിൽ, ധ്യാനിക്കുന്നവരിൽ നൂറിൽ ഏകദേശം 8 പേർക്ക് വേണ്ടാത്ത ഒരു ഫലമുണ്ടായി; മിക്കപ്പോഴും ഉത്കണ്ഠയോ മനസ്സിടിവോ.',
  p4w4: 'ശരി. ഏകദേശം 3,000 ജോലിക്കാർ: അസുഖ അവധി കുറവ്, അസുഖങ്ങളുടെ എണ്ണം ഒരുപോലെ.',
});
const PRACTICE = [
  { id: 'p-fast', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-choiceless', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 0, L('p2y'), [null, L('p2nb'), L('p2nc')]) },
  { id: 'p-inbox', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['t'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('almanack:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
