// Rising particles of a colour from a point, for a duration.
function heat(p, x, y, color, t0, dur, n = 14, spread = 70, h = 220) {
  const ds = Array.from({ length: n }, () => evDot(p, x, y, 5, color, 0));
  prog(q => {
    const t = q * dur;
    ds.forEach((d, i) => {
      const u = ((t * .45 + i / n) % 1), sx = Math.sin(i * 12.9898) * spread;
      put(d, { x: x + sx + Math.sin((t + i) * 2) * 8, y: y - u * h, o: Math.min(1, t * 1.5) * Math.sin(u * Math.PI) * .9 });
    });
  }, t0, dur, lin);
}
function headAt(p, e, color, t) {

  put(h, { o: 0 }); show(h, t, .25);
  return h;
}

// Walk in place (or across): legs swing, trunk sways, the body bobs. x0..x1 between t0 and t0 + dur.
function c2Walk(E, x0, x1, t0, dur, rate = 3, y0) {
  const base = y0 ?? st(E).y;
  prog(q => {
    const t = q * dur, ph = t * rate;
    put(E, { x: x0 + (x1 - x0) * q, y: base - Math.abs(Math.sin(ph)) * 3 });
    E._legs.forEach((L_, i) => put(L_, { r: Math.sin(ph + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI / 2 : 0)) * 9 }));
    put(E._trunk, { r: Math.sin(ph * .5) * 9 });
    put(E._tail, { r: Math.sin(ph * .8) * 12 });
    put(E._head, { r: Math.sin(ph) * 1.5 });
  }, t0, dur, lin);
}

// The shape of pulse(e, t0, k) as a pure function of time since the beat (v): out to k in .22 s, back to 1 in .4 s.
const c2Pulse = (v, k, from = 1) => v < .22 ? from + (k - from) * out(v / .22) : v < .62 ? k + (1 - k) * io((v - .22) / .4) : 1;
// Heartbeats driven from the beat clock (one whole-beat prog, so replays are exact): pulses at the given times,
// the first one starting from scale s0 (as the earlier pulse() chains did).
function c2Beats(e, times, k, D, s0 = 1) {
  prog(q => {
    const t = q * D;
    let j = -1; for (let i = 0; i < times.length; i++) if (times[i] <= t) j = i;
    put(e, { s: j < 0 ? s0 : c2Pulse(t - times[j], k, j ? 1 : s0) });
  }, 0, D, lin);
}
// evFire repeated every `every` s from t0: edges draw once, nodes flash once and then pulse on the beat clock.
function c2FireLoop(B, t0, every, D, d = 1.4, color = EV.calm) {
  B._edges.forEach((e, i) => { e.setAttribute('stroke', color); draw(e, t0 + (i % 7) * d / 9, d * .5); });
  B._nodes.forEach((n, i) => tw(n, { o: 1 }, t0 + (i % 5) * d / 7, .25));
  prog(q => {
    const t = q * D;
    B._nodes.forEach((n, i) => { const u = t - t0 - (i % 5) * d / 7; put(n, { s: u < 0 || t0 + Math.floor(u / every) * every >= D ? 1 : c2Pulse(u % every, 1.8) }); });
  }, 0, D, lin);
}

  p2a: 'ഒന്നും സംഭവിച്ചില്ല: അവൾക്ക് വെറുതെ തോന്നിയതാണ്.', p2b: 'അവളുടെ പ്രതീക്ഷ കാരണം തലച്ചോർ സ്വന്തം വേദനസംഹാരികൾ പുറത്തുവിട്ടു.', p2c: 'പഞ്ചസാര തന്നെ ഒരു വേദനസംഹാരിയാണ്.',
  p2y: 'ശരി. ആശ്വാസം പ്രതീക്ഷിച്ചപ്പോൾ എൻഡോർഫിനുകൾ പുറത്തുവന്നു: വിശ്വാസം ശരീരത്തിലെ രസതന്ത്രം തന്നെ മാറ്റി.',
  p2na: 'ആശ്വാസം യഥാർത്ഥമായിരുന്നു. എൻഡോർഫിനുകളെ തടഞ്ഞാൽ അതിന്റെ വലിയൊരു ഭാഗം പോകും; അതായത് ഇത് ജീവശാസ്ത്രമാണ്.', p2nc: 'പഞ്ചസാരയ്ക്ക് വേദന കുറയ്ക്കാനുള്ള കഴിവില്ല. അവളുടെ പ്രതീക്ഷയാണ് അത് ചെയ്തത്.',
  p3p: 'തന്റെ പ്രധാന പ്രസന്റേഷൻ ആളുകളുടെ മുന്നിൽ പരിശീലിക്കാൻ രവിക്ക് ആഴ്ചയിൽ ഒരിക്കലേ കഴിയൂ. ഈ അധ്യായം എന്ത് നിർദ്ദേശിക്കുന്നു?',
  p3a: 'പ്രസന്റേഷൻ ദിവസം രാവിലെ പോസിറ്റീവായി ചിന്തിക്കുക.', p3b: 'ഒന്നുമില്ല: മുതിർന്നവരുടെ തലച്ചോർ മാറില്ല.',
  p3c: 'ശരിക്കുള്ള പരിശീലനത്തിന് പുറമെ, എല്ലാ ദിവസവും മനസ്സിൽ വ്യക്തമായി പ്രസന്റേഷൻ പരിശീലിക്കുക.',
  p3y: 'മനസ്സിലെ പരിശീലനം ചെയ്യുന്നതിന്റെ അതേ സർക്യൂട്ടുകളെ ഉണർത്തുന്നു; ദിവസവും ചെയ്യുന്നത് ശരിക്കുള്ള സെഷനുകളെ ശക്തമാക്കും.',
  p3na: 'അവസാന നിമിഷത്തെ മൂഡ് പരിശീലനമല്ല. ആവർത്തനമാണ് സർക്യൂട്ടുകൾ ഉണ്ടാക്കുന്നത്.', p3nb: 'മുതിർന്നവരുടെ തലച്ചോറും മാറും; അതാണ് പ്ലാസ്റ്റിസിറ്റി.',
  p4p: 'പുസ്തകം അനുസരിച്ച്: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'നമ്മുടെ നിർദ്ദേശമില്ലാതെ ഉള്ളിലെ ഒരു ബുദ്ധി ശരീരത്തെ നടത്തുന്നു.',
  p4r2: 'ചിന്തകൾ ശരീരത്തെ മാറ്റുന്നു എന്നത് പൊതുവായ നാല് വിശ്വാസങ്ങളിൽ ഒന്നാണ്.',
  p4r3: 'മുതിർന്നവരുടെ തലച്ചോർ മാറാത്തതാണെന്ന് ഗ്രന്ഥകാരൻ കാണുന്നു.',
  p4r4: 'ഈ പുസ്തകത്തിൽ, മനസ്സ് തലച്ചോറിൽ ഒതുങ്ങുന്നു, അതിനപ്പുറം ഒന്നിലേക്കും എത്തുന്നില്ല.',
  p4w1: 'ശരി. ഇതിനെയാണ് ഗ്രന്ഥകാരൻ ഭീമന്റെ പുറത്തുള്ള യാത്ര എന്ന് വിളിക്കുന്നത്.',
  p4w2: 'ശരി. നാല് വിശ്വാസങ്ങളിൽ രണ്ടാമത്തേതാണ് ഇത്.',
  p4w3: 'തെറ്റ്. ഏത് പ്രായത്തിലും പരിശീലനത്തിലൂടെ തലച്ചോർ മാറുന്നതാണ് പുസ്തകം കാണിക്കുന്നത്.',
  p4w4: 'തെറ്റ്. ഗ്രന്ഥകാരൻ മനസ്സിനെ ഒരു ക്വാണ്ടം ഫീൽഡുമായും പ്രപഞ്ചബുദ്ധിയുമായും ബന്ധിപ്പിക്കുന്നു.',
});
const PRACTICE = [
  { id: 'p-story', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 0, L('p1y'), [null, L('p1nb'), L('p1nc')]) },
  { id: 'p-placebo', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 1, L('p2y'), [L('p2na'), null, L('p2nc')]) },
  { id: 'p-rehearse', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 2, L('p3y'), [L('p3na'), L('p3nb'), null]) },
  { id: 'p-ideas', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['t'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['f'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('evolve:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
