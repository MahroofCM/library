  q3a: 'ബ്രെയിൻസ്റ്റെം', q3b: 'ഫ്രോണ്ടൽ ലോബ്', q3c: 'ഓക്സിപിറ്റൽ ലോബ്',
  q3y: 'ലക്ഷ്യം മനസ്സിൽ പിടിച്ചുനിർത്തുക, തോന്നൽ ശ്രദ്ധിക്കുക, അതിനെ നിർത്തുക: ഇവ ഫ്രോണ്ടൽ ലോബിന്റെ ജോലികളാണ്.',
  q3na: 'ബ്രെയിൻസ്റ്റെം അവനെ ശ്വസിപ്പിച്ചും ഉണർത്തിയും നിർത്തി. പക്ഷേ തീരുമാനങ്ങൾ എടുക്കുന്നത് അതല്ല.', q3nc: 'ഓക്സിപിറ്റൽ ലോബ് സ്ക്രീൻ കാണാൻ സഹായിച്ചു. തിരഞ്ഞെടുക്കുന്നത് കുറച്ചുകൂടി മുന്നിലുള്ള ഭാഗമാണ്.',
  p1p: 'ഒരു കുടുംബ ചടങ്ങിൽ സംസാരിക്കാൻ ആവശ്യപ്പെട്ടപ്പോൾ, പ്രസംഗം അറിയാമായിരുന്നിട്ടും ലീനയുടെ മനസ്സ് ശൂന്യമാകുന്നു, ഹൃദയം ഇടിക്കുന്നു. ഏറ്റവും നല്ല വിശദീകരണം ഏത്?',
  p1a: 'ചിന്തിക്കുന്ന കോർട്ടെക്സ് നിയന്ത്രണം ഏറ്റെടുക്കുന്നതിന് മുൻപേ അവളുടെ അലാറം (അമിഗ്ഡലയും ശരീര രസതന്ത്രവും) മുഴങ്ങി.',
  p1b: 'ഒരു നിമിഷത്തേക്ക് അവളുടെ ബ്രെയിൻസ്റ്റെം പ്രവർത്തനം നിർത്തി.', p1c: 'അവൾക്ക് ഓർമ്മശക്തി കുറവാണ്.',
  p1y: 'വേഗതയേറിയ അലാറം ആൾക്കൂട്ടത്തെ ഒരു അപകടമായി കാണുന്നു. ഹൃദയം കുതിക്കുന്നു, പ്ലാൻ ചെയ്യുന്ന കോർട്ടെക്സ് ഒരു നിമിഷം പിന്നിലാകുന്നു.',
  p1nb: 'ബ്രെയിൻസ്റ്റെം നിന്നാൽ ശ്വാസം നിൽക്കും. അത് കഠിനമായി പ്രവർത്തിക്കുകയായിരുന്നു: ആ ഇടിക്കുന്ന ഹൃദയം അതിന്റെ ജോലിയാണ്.',
  p1nc: 'അവൾക്ക് പ്രസംഗം അറിയാം. ഭയം ഒരു നിമിഷം അതിലേക്കുള്ള വഴി അടച്ചു; ഓർമ്മയ്ക്ക് കുഴപ്പമില്ല.',
  p2p: 'തലച്ചോറിലെ ശരീര മാപ്പിൽ ചുണ്ടുകൾക്കും വിരൽത്തുമ്പുകൾക്കും ഇത്ര സ്ഥലം കിട്ടുന്നത് എന്തുകൊണ്ട്?',
  p2a: 'അവയാണ് ശരീരത്തിലെ ഏറ്റവും വലിയ ഭാഗങ്ങൾ.', p2b: 'അവയിൽ സ്പർശം അറിയുന്ന റിസപ്റ്ററുകൾ നിറഞ്ഞിരിക്കുന്നു, അതുകൊണ്ട് അവ കൂടുതൽ അനുഭവിക്കുന്നു.', p2c: 'അവ സംസാരിക്കാനും എഴുതാനും മാത്രം ഉപയോഗിക്കുന്നു.',
  p2y: 'മാപ്പിലെ സ്ഥലം വലിപ്പമല്ല, സംവേദനക്ഷമതയാണ് തീരുമാനിക്കുന്നത്. കൂടുതൽ റിസപ്റ്ററുകൾ, കൂടുതൽ മാപ്പ്.',
  p2na: 'മുതുക് വളരെ വലുതാണ്, എന്നിട്ടും മാപ്പിൽ ഒരു ചെറിയ കഷണം മാത്രം.', p2nc: 'മാപ്പ് അനുഭവത്തെ കുറിച്ചാണ്. കൂടുതൽ റിസപ്റ്ററുകൾ, കൂടുതൽ ന്യൂറോണുകൾ.',
  p3p: 'ഒരു ക്ലയന്റ് പറയുന്നു, “ഇത് എന്റെ ഉരഗ തലച്ചോറാണ്. എനിക്ക് പ്രതികരിക്കാതിരിക്കാൻ പറ്റില്ല.” ഏറ്റവും സഹായകരമായ മറുപടി ഏത്?',
  p3a: 'സമ്മതിക്കുക: പഴയ തലച്ചോറാണ് നിയന്ത്രിക്കുന്നത്, ഒന്നും ചെയ്യാനില്ല.', p3b: 'ആ പ്രതികരണം യഥാർത്ഥമല്ല, അത് അവഗണിച്ചാൽ മതി എന്ന് പറയുക.',
  p3c: 'അലാറം വേഗത്തിൽ പ്രതികരിക്കും, പക്ഷേ ആ തോന്നൽ ശ്രദ്ധിച്ച് നിർത്താൻ ഫ്രോണ്ടൽ ലോബിന് പഠിക്കാം. പരിശീലിക്കാവുന്ന ഒരു കഴിവാണത്.',
  p3y: 'വേഗതയേറിയ പ്രതികരണങ്ങൾ യഥാർത്ഥമാണ്; നിർത്തി തിരഞ്ഞെടുക്കാനുള്ള കഴിവും. പരിശീലനം അതിനെ ശക്തമാക്കുന്നു.',
  p3na: 'ഭാഗങ്ങൾ ഒരുമിച്ചാണ് പ്രവർത്തിക്കുന്നത്. നാം എങ്ങനെ പ്രതികരിക്കുന്നു എന്നതിനെ ഫ്രോണ്ടൽ ലോബിന് മാറ്റാം, പ്രത്യേകിച്ച് പരിശീലനത്തോടെ.',
  p3nb: 'പ്രതികരണം യഥാർത്ഥമാണ്, ശ്രദ്ധിക്കേണ്ടതുമാണ്. പ്രധാനം, അതിനുശേഷം അവർ എന്ത് ചെയ്യുന്നു എന്നതാണ്.',
  p4p: 'പുസ്തകം അനുസരിച്ച്: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'ശ്വാസവും ഹൃദയമിടിപ്പും നിയന്ത്രിക്കാൻ ബ്രെയിൻസ്റ്റെം സഹായിക്കുന്നു.',
  p4r2: 'പുസ്തകത്തിൽ, മൂന്ന് തലച്ചോറുകളും ഒറ്റയ്ക്കൊറ്റയ്ക്ക് പ്രവർത്തിക്കുന്നു, പരസ്പരം ഒട്ടും ബാധിക്കുന്നില്ല.',
  p4r3: 'പുസ്തകം പറയുന്നത്: ശരീരഭാരത്തിന്റെ ഏകദേശം 2% മാത്രമുള്ള തലച്ചോർ, വിശ്രമത്തിൽ ശരീര ഊർജ്ജത്തിന്റെ ഏകദേശം 20% ഉപയോഗിക്കുന്നു.',
  p4r4: 'പുസ്തകത്തിൽ, തലച്ചോറിലെ ന്യൂറോണുകളുടെ ചെറിയൊരു പങ്ക് മാത്രമേ സെറിബെല്ലത്തിലുള്ളൂ.',
  p4w1: 'ശരി. ശ്വാസത്തിന്റെയും ഹൃദയമിടിപ്പിന്റെയും കേന്ദ്രങ്ങൾ ബ്രെയിൻസ്റ്റെമിലാണ്.',
  p4w2: 'തെറ്റ്. ബന്ധിപ്പിച്ച മൂന്ന് കമ്പ്യൂട്ടറുകളായാണ് പുസ്തകം അവയെ കാണുന്നത്; നമ്മളിൽ തലച്ചോർ മുഴുവനും ഒരുമിച്ച് പ്രവർത്തിക്കുന്നു.',
  p4w3: 'ശരി. തലച്ചോർ എത്ര ചെലവേറിയതും എത്ര പ്രധാനപ്പെട്ടതുമാണെന്ന് കാണിക്കാൻ പുസ്തകം ഇത് ഉപയോഗിക്കുന്നു.',
  p4w4: 'തെറ്റ്. തലച്ചോറിലെ ന്യൂറോണുകളിൽ പകുതിയിലേറെയും സെറിബെല്ലത്തിലാണെന്ന് പുസ്തകം പറയുന്നു.',
});
const PRACTICE = [
  { id: 'p-freeze', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 0, L('p1y'), [null, L('p1nb'), L('p1nc')]) },
  { id: 'p-map', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 1, L('p2y'), [L('p2na'), null, L('p2nc')]) },
  { id: 'p-lizard', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 2, L('p3y'), [L('p3na'), L('p3nb'), null]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('evolve:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
