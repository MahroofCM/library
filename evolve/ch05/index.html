      pth(g, 'M0 -22V-50', { stroke: c, 'stroke-width': 3 }); evDot(g, 0, 0, 10, c);

      tw(g, { o: 1 }, Math.max(t, m('cortex') + .3), .4);
    });
    // selection and instruction
    const q = c5Later(m('select'));
    const card = (x, kt, kd, col, t) => {
      const g = G(q, { x, y: 0, o: 0 });
      mk('rect', { x: -330, y: 120, width: 660, height: 680, rx: 24, fill: '#10171b', stroke: col, 'stroke-width': 2 }, g);

    };
    const A = card(430, 'selection', 'selectionD', NAT, m('select') + .2);
    // a menu of switches; two come on
    for (let i = 0; i < 6; i++) {
      const s = G(A, { x: -200 + (i % 3) * 200, y: 330 + Math.floor(i / 3) * 90 });

  p2c: 'മുതിർന്നവർക്ക് ഭാഷയുടെ ഭാഗങ്ങൾ ഇല്ല.',
  p2y: 'അതെ. കുഞ്ഞിന്റെ തലച്ചോർ കേൾക്കുന്നത് നിലനിർത്തുന്നു, ബാക്കി മായുന്നു. ശ്രദ്ധയോടെ പരിശീലിച്ചാൽ മുതിർന്നവർക്കും പഠിക്കാം.',
  p2na: 'ബുദ്ധിയല്ല പ്രശ്നം. അവന്റെ കേൾവി ചെറുപ്പത്തിലേ വീട്ടിലെ ശബ്ദങ്ങളിലേക്ക് ഒരുങ്ങി.', p2nc: 'മുതിർന്നവർക്കും ഭാഷയുടെ ഭാഗങ്ങളുണ്ട്; പരിശീലനത്തിലൂടെ പുതിയ ശബ്ദങ്ങൾ പഠിക്കാം.',
  p3p: 'വർഷങ്ങളോളം ദിവസം മുഴുവൻ കൈകൾ ഉപയോഗിച്ചവരുടെ (ടൈപ്പിസ്റ്റുകൾ, റിപ്പയർ ജോലിക്കാർ) തലച്ചോറിൽ കൈയുടെ ഭാഗങ്ങൾ കൂടുതൽ സമ്പന്നമായിരുന്നു. ഈ അധ്യായം അനുസരിച്ച് ഏത് വിശദീകരണമാണ് ശരി?',
  p3a: 'അവരുടെ കൈയുടെ ഭാഗങ്ങൾ ജനനത്തിലേ ഉറച്ചതാണ്, മാറില്ല.', p3b: 'വർഷങ്ങളുടെ കൈപ്പണി അവരുടെ ഡി എൻ എയെ മാറ്റി.',
  p3c: 'വർഷങ്ങളുടെ പരിശീലനം ആ സർക്യൂട്ടുകളെ പഠിപ്പിച്ചു, അതുകൊണ്ട് കൈയുടെ മാപ്പ് സമ്പന്നമായി.',
  p3y: 'ശരി. പഠിപ്പിക്കൽ: ആവർത്തിച്ചുള്ള ഉപയോഗം സർക്യൂട്ടുകളെ ഇടതൂർന്നതും മാപ്പിനെ വലുതുമാക്കുന്നു.',
  p3na: 'ഉപയോഗത്തിനനുസരിച്ച് മാപ്പുകൾ മാറുമെന്ന് ബ്രെയിൽ, ഒട്ടിയ വിരൽ പഠനങ്ങൾ കാണിക്കുന്നു.', p3nb: 'പരിശീലനം മാറ്റുന്നത് വയറിങ്ങിനെയാണ്, ജീനുകളെയല്ല.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'ശബ്ദത്തിനും മുഖങ്ങൾക്കും തയ്യാറായ സർക്യൂട്ടുകളുമായാണ് നവജാത തലച്ചോർ എത്തുന്നത്.',
  p4r2: 'മാതാപിതാക്കൾ പരിശീലിച്ച ശീലങ്ങൾ ജീനുകളിലൂടെ കുഞ്ഞിലേക്ക് കൈമാറുന്നു.',
  p4r3: 'കുട്ടിക്കാലം മുതൽ കാഴ്ചയില്ലാത്തവരിൽ, കാഴ്ചയുടെ ഭാഗത്തിന് സ്പർശവും ശബ്ദവും ഏറ്റെടുക്കാൻ കഴിയും.',
  p4r4: 'ഓരോരുത്തരുടെയും വ്യക്തിത്വം അമ്പത് ശതമാനം ജീനുകളാൽ ഉറപ്പിക്കപ്പെട്ടതാണെന്ന് ഇരട്ട പഠനങ്ങൾ കാണിക്കുന്നു.',
  p4w1: 'ശരി. ആരും പഠിപ്പിക്കാതെ നവജാത ശിശു ശബ്ദത്തിലേക്ക് തിരിയുന്നു.', p4w2: 'തെറ്റ്. കുട്ടികൾ ശീലങ്ങൾ പഠിക്കുന്നത് നോക്കിക്കണ്ടാണ്; പഠിച്ച ശീലങ്ങളോ ഓർമ്മകളോ ജീനുകൾ വഹിക്കുന്നില്ല.',
  p4w3: 'ശരി. തലച്ചോറിന്റെ മാറ്റാനുള്ള കഴിവിന്റെ ഏറ്റവും നന്നായി തെളിയിക്കപ്പെട്ട ഉദാഹരണങ്ങളിൽ ഒന്നാണിത്.', p4w4: 'തെറ്റ്. ഈ കണക്ക് ഒരു ജനസംഖ്യയിലെ വ്യത്യാസങ്ങളെക്കുറിച്ചാണ്, ഒരാളുടെ ഉറച്ച പങ്കിനെക്കുറിച്ചല്ല.',
});
const PRACTICE = [
  { id: 'p-anxious', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 0, L('p1y'), [null, L('p1nb'), L('p1nc')]) },
  { id: 'p-sounds', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 1, L('p2y'), [L('p2na'), null, L('p2nc')]) },
  { id: 'p-hands', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 2, L('p3y'), [L('p3na'), L('p3nb'), null]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('evolve:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '500 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '500 30px "Noto Serif Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"', '600 30px "Noto Sans Malayalam"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
