const lab = (p, key, x, y, t, o = {}) => { const e = evText(p, L(key), { x, y, o: 0, ...o }); show(e, t, o.dur || .5); return e; };
// Wrapped label (for lines that run long in Malayalam), fading in at t.
const labP = (p, key, x, y, t, o = {}) => { const e = evPara(p, L(key), { x, y, o: 0, ...o }); show(e, t, .5); return e; };
// A second picture inside the same beat, faded in at t (its contents stay hidden until then).
function n6Later(t) { const q = panel(t); put(q, { o: 0 }); tw(q, { o: 1 }, t, .4); return q; }
// Small deterministic random numbers, so replays draw the same picture.
function n6Rand(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
// Text with a dark halo so it reads over drawings and water.
const n6Halo = e => { e.setAttribute('paint-order', 'stroke'); e.setAttribute('stroke', EV.bg); e.setAttribute('stroke-width', 9); e.setAttribute('stroke-linejoin', 'round'); return e; };

// A neuron lying on its side (from ch03): dendrites left of the cell body at (0,0), the axon running right to x = len.
function n6Neuron(p, { x = 0, y = 0, s = 1, o = 1, len = 600, color = EV.gold, seed = 3, hide = false, reach = 1 } = {}) {
  const g = G(p, { x, y, s, o });
  const rnd = n6Rand(seed), hid = hide ? { d: 0 } : {};
  g._dend = G(g); g._spines = G(g, { o: hide ? 0 : 1 });
  g._leaves = []; g._dpaths = [];
  const grow = (pts, ang, L_, w, depth) => {
    const [x0, y0] = pts[pts.length - 1];
    const a = (ang + (rnd() - .5) * 14) * Math.PI / 180;
    const x1 = x0 + Math.cos(a) * L_, y1 = y0 + Math.sin(a) * L_;
    const mx = (x0 + x1) / 2 + (rnd() - .5) * L_ * .25, my = (y0 + y1) / 2 + (rnd() - .5) * L_ * .25;
    g._dpaths.push(path(g._dend, `M${x0.toFixed(1)} ${y0.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`, { stroke: color, 'stroke-width': w }, hid));
    const np = pts.concat([[mx, my], [x1, y1]]);
    if (depth <= 1) for (let k = 1; k <= 3; k++) {
      const u = k / 4, sx = (1 - u) ** 2 * x0 + 2 * (1 - u) * u * mx + u * u * x1, sy = (1 - u) ** 2 * y0 + 2 * (1 - u) * u * my + u * u * y1;
      const side = k % 2 ? 1 : -1;
      evDot(g._spines, sx - Math.sin(a) * 6 * side, sy + Math.cos(a) * 6 * side, 3.4, EV.goldHi);
    }
    if (depth > 0) { grow(np, ang - 24, L_ * .68, w * .62, depth - 1); grow(np, ang + 24, L_ * .68, w * .62, depth - 1); }
    else g._leaves.push(np);
  };
  [150, 178, 206, 124, 232].forEach(a => grow([[Math.cos(a * Math.PI / 180) * 40, Math.sin(a * Math.PI / 180) * 40]], a, 118 * reach, 7, 2));
  g._axon = path(g, `M44 0C${len * .3} -26 ${len * .62} 26 ${len} 0`, { stroke: color, 'stroke-width': 6 }, hid);
  g._glow = evGlow(g, 0, 0, 120, 'Gold', 0);
  g._body = G(g, { o: hide ? 0 : 1 });
  path(g._body, 'M-44 -6C-46 -34 -18 -50 8 -46C32 -42 54 -22 50 0C54 22 32 42 8 46C-18 50 -46 34 -44 6Z', { fill: '#141c20', stroke: color, 'stroke-width': 3.5 });
  mk('circle', { cx: 2, cy: 0, r: 17, fill: '#2b2a36', stroke: EV.shame, 'stroke-width': 2 }, g._body);
  g._termG = G(g, { o: hide ? 0 : 1 });
  g._bout = [-40, -14, 14, 40].map(a => {
    const r_ = a * Math.PI / 180, bx = len + Math.cos(r_) * 84, by = Math.sin(r_) * 84;
    path(g._termG, `M${len} 0Q${len + 40} ${by * .3} ${bx.toFixed(1)} ${by.toFixed(1)}`, { stroke: color, 'stroke-width': 4 });
    mk('circle', { cx: bx, cy: by, r: 10, fill: '#141c20', stroke: color, 'stroke-width': 3 }, g._termG);
    return [bx, by];
  });
  return g;
}
// One glowing pulse down a neuron's axon, from t0, taking `travel` seconds.
function n6Spark(N, t0, travel = .8, r = 10) {
  const ax = N._axon, L_ = ax.getTotalLength();
  const sp = G(N, { o: 0 }); evGlow(sp, 0, 0, r * 3.4, 'Gold', 1); evDot(sp, 0, 0, r, EV.goldHi);
  prog(q => { const pt = ax.getPointAtLength(q * L_); put(sp, { x: pt.x, y: pt.y, o: Math.min(1, q * 10, (1 - q) * 10) }); }, t0, travel, lin);
  return sp;
}
// A dot that runs once along any path (in that path's parent).
function n6Run(pathEl, t0, dur, color = EV.goldHi, r = 8) {
  const L_ = pathEl.getTotalLength(), d = evDot(pathEl.parentNode, 0, 0, r, color, 0);
  prog(q => { const pt = pathEl.getPointAtLength(q * L_); put(d, { x: pt.x, y: pt.y, o: Math.min(1, q * 10, (1 - q) * 10) }); }, t0, dur, lin);
  return d;
}
// A small network of nodes and edges; edges: [i, j]. Returns {g, nodes, edges}.
function n6Net(p, pts, edges, { color = EV.gold, r = 9, w = 3, o = 1, hide = true } = {}) {
  const g = G(p, { o });
  const E = edges.map(([i, j]) => path(g, `M${pts[i][0]} ${pts[i][1]}L${pts[j][0]} ${pts[j][1]}`, { stroke: color, 'stroke-width': w }, hide ? { d: 0 } : {}));
  const N = pts.map(([x, y]) => { const n = G(g, { x, y, o: hide ? 0 : 1 }); mk('circle', { cx: 0, cy: 0, r, fill: EV.bg, stroke: color, 'stroke-width': 3 }, n); n._c = mk('circle', { cx: 0, cy: 0, r: r * .55, fill: color }, n); return n; });
  return { g, nodes: N, edges: E };
}
function n6NetShow(net, t0, d = 1) {
  net.nodes.forEach((n, i) => tw(n, { o: 1 }, t0 + i * d / net.nodes.length * .6, .3));
  net.edges.forEach((e, i) => draw(e, t0 + .2 + i * d / net.edges.length * .6, .4));
}
function n6NetFire(net, t0, color = EV.goldHi) {
  net.nodes.forEach((n, i) => pulse(n, t0 + (i % 4) * .12, 1.45));
  net.edges.forEach((e, i) => { tw(e, { c_stroke: color, 'a_stroke-width': 5 }, t0 + (i % 3) * .1, .25); });
}

/* Repeated motion driven from the beat clock: one whole-beat prog() each, so replays are exact and loops stay in step. */
// pulse()'s shape as a pure function of the time since it started.
const n6P = (v, k) => v < 0 ? 1 : v < .22 ? 1 + (k - 1) * out(v / .22) : v < .62 ? k + (1 - k) * io((v - .22) / .4) : 1;
// Index of the latest start time at or before t (-1 if none yet).
const n6Last = (times, t) => { let j = -1; for (let i = 0; i < times.length; i++) if (times[i] <= t) j = i; return j; };
// Start times from t0, every `every` s, while before t1.
const n6Times = (t0, every, t1) => { const a = []; for (let t = t0; t < t1; t += every) a.push(+t.toFixed(3)); return a; };
// Sparks down a neuron's axon at the given times; an entry may be [t, radius].
function n6Sparks(N, list, travel, D, r = 10) {
  const ax = N._axon, L_ = ax.getTotalLength(), T = list.map(e => Array.isArray(e) ? e : [e, r]), ts = T.map(e => e[0]);
  const sp = G(N, { o: 0 }); evGlow(sp, 0, 0, r * 3.4, 'Gold', 1); evDot(sp, 0, 0, r, EV.goldHi);
  prog(q => {
    const t = q * D, j = n6Last(ts, t), u = j < 0 ? 1 : (t - ts[j]) / travel;
    if (u >= 1) return put(sp, { x: 0, y: 0, s: 1, o: 0 });
    const pt = ax.getPointAtLength(u * L_); put(sp, { x: pt.x, y: pt.y, s: T[j][1] / r, o: Math.min(1, u * 10, (1 - u) * 10) });
  }, 0, D, lin);
}
// Dots running along paths at the given times; entries are [t, pathEl] or [t, pathEl, radius]. The paths share a parent.
function n6Runs(list, dur, D, color = EV.goldHi, r = 8) {
  const ts = list.map(e => e[0]), d = evDot(list[0][1].parentNode, 0, 0, r, color, 0);
  prog(q => {
    const t = q * D, j = n6Last(ts, t), u = j < 0 ? 1 : (t - ts[j]) / dur;
    if (u >= 1) return put(d, { x: 0, y: 0, s: 1, o: 0 });
    const pe = list[j][1], pt = pe.getPointAtLength(u * pe.getTotalLength());
    put(d, { x: pt.x, y: pt.y, s: (list[j][2] || r) / r, o: Math.min(1, u * 10, (1 - u) * 10) });
  }, 0, D, lin);
}
// n6NetFire at each of the given times: edges light once, nodes pulse every time.
function n6NetFires(net, times, D, color = EV.goldHi) {
  net.edges.forEach((e, i) => tw(e, { c_stroke: color, 'a_stroke-width': 5 }, times[0] + (i % 3) * .1, .25));
  prog(q => { const t = q * D; net.nodes.forEach((n, i) => { const j = n6Last(times, t - (i % 4) * .12); put(n, { s: j < 0 ? 1 : n6P(t - (i % 4) * .12 - times[j], 1.45) }); }); }, 0, D, lin);
}
// evFire at each of the given times: edges draw from t0 (once), nodes appear once and then flash on every time.
function n6FireLoop(B, t0, times, D, d = 1) {
  B._edges.forEach((e, i) => draw(e, t0 + (i % 7) * d / 9, d * .5));
  B._nodes.forEach((n, i) => tw(n, { o: 1 }, t0 + (i % 5) * d / 7, .25));
  prog(q => { const t = q * D; B._nodes.forEach((n, i) => { const off = (i % 5) * d / 7, j = n6Last(times, t - off); put(n, { s: j < 0 ? 1 : n6P(t - off - times[j], 1.8) }); }); }, 0, D, lin);
}
// pulse() at each of the given times.
function n6Beats(e, times, k, D) {
  prog(q => { const t = q * D, j = n6Last(times, t); put(e, { s: j < 0 ? 1 : n6P(t - times[j], k) }); }, 0, D, lin);
}

// The pool: deck on the left, water to the right. Call .front() after drawing swimmers to put water over them.
function n6Pool(p, D, { edgeX = 520, deckY = 600, surf = 640, x0 = -600, x1 = 2400, y1 = 1400, sky = true } = {}) {
  const P = { surf, edgeX };
  if (sky) {
    mk('rect', { x: x0, y: -400, width: x1 - x0, height: deckY + 400, fill: 'url(#evSky)' }, p);
    evGlow(p, 1300, 560, 420, 'Warm', .35);
    const sk = G(p);
    [[180, 120], [260, 200], [380, 150], [470, 240], [760, 170], [860, 260], [980, 190], [1440, 230], [1530, 160], [1650, 210], [1760, 140]].forEach(([x, h], i) => {
      mk('rect', { x, y: 560 - h, width: 70, height: h, fill: '#0e161b' }, sk);
      for (let k = 0; k < 3; k++) if ((i + k) % 2) mk('rect', { x: x + 14 + (k % 2) * 28, y: 560 - h + 22 + k * 46, width: 12, height: 16, fill: '#e8b765', opacity: .5 }, sk);
    });
    path(sk, 'M1270 560V250L1286 120L1298 30L1310 120L1326 250V560Z', { fill: '#101a20', stroke: EV.gold, 'stroke-width': 1.2, 'stroke-opacity': .35 });
    mk('rect', { x: x0, y: 560, width: x1 - x0, height: deckY - 560, fill: '#121a1e' }, p);
  }
  mk('rect', { x: edgeX, y: surf, width: x1 - edgeX, height: y1 - surf, fill: '#0a2129' }, p);
  mk('rect', { x: x0, y: deckY, width: edgeX - x0, height: y1 - deckY, fill: '#1a2226' }, p);
  path(p, `M${x0} ${deckY}H${edgeX}V${y1}`, { stroke: EV.gold, 'stroke-width': 2, 'stroke-opacity': .45 });
  P.front = () => {
    const f = G(p);
    mk('rect', { x: edgeX + 2, y: surf + 6, width: x1 - edgeX - 2, height: y1 - surf - 6, fill: '#0f3a46', opacity: .62 }, f);
    const wv = [0, 1, 2].map(k => {
      let d = ''; for (let x = edgeX + 20; x < x1 - 140; x += 120) d += `M${x} ${surf + 4 + k * 46}q30 -7 60 0t60 0`;
      return path(f, d, { stroke: '#7fc4d1', 'stroke-width': 2, 'stroke-opacity': .35 - k * .08 });
    });
    prog(q => { const t = q * D; wv.forEach((w, k) => put(w, { x: (t * (22 + k * 8)) % 120 })); }, 0, D, lin);
    return f;
  };
  return P;
}
// Front crawl: arms windmill, legs flutter, from t0 for dur.
function n6Swim(P, t0, dur, rate = .7) {
  prog(q => {
    const t = q * dur, a = t * 360 * rate;
    put(P.armL, { r: a }); put(P.armR, { r: a + 180 });
    put(P.armL._lo, { r: 0 }); put(P.armR._lo, { r: 0 });
    put(P.legL, { r: Math.sin(t * 9) * 12 }); put(P.legR, { r: -Math.sin(t * 9) * 12 });
  }, t0, dur, lin);
}
// Tall grass: tufts sorted by depth; blades near routeY form the route that can be trampled.
function n6Field(p, { x0 = 40, x1 = 1560, y0 = 470, y1 = 830, n = 150, seed = 6, routeY = 650, band = 34, s = 1 } = {}) {
  const R = n6Rand(seed), bl = [];
  for (let i = 0; i < n; i++) bl.push({ x: x0 + R() * (x1 - x0), y: y0 + R() * (y1 - y0), h: (46 + R() * 40) * s, lean: (R() - .5) * 14, c: R() < .5 ? '#4b6a43' : '#6d7f4c' });
  for (let x = x0 + 10; x < x1; x += 34 * s) bl.push({ x, y: routeY + (R() - .5) * band * 1.4, h: (50 + R() * 30) * s, lean: (R() - .5) * 14, c: R() < .5 ? '#4b6a43' : '#6d7f4c' });
  bl.sort((a, b) => a.y - b.y);
  const F = { blades: bl, back: G(p) };
  F.path = path(F.back, `M${x0} ${routeY}H${x1}`, { stroke: '#6b5a3a', 'stroke-width': 40 * s }, { o: 0 });
  F.mid = G(p); F.front = G(p);
  bl.forEach(b => {
    b.g = G(b.y < routeY ? F.back : F.front, { x: b.x, y: b.y, r: b.lean });
    const h = b.h;
    path(b.g, `M0 0Q-4 ${-h * .5} -7 ${-h}M0 0Q2 ${-h * .6} 4 ${-h * .92}M0 0Q6 ${-h * .4} 13 ${-h * .72}`, { stroke: b.c, 'stroke-width': 4 * Math.max(.7, s) });
    b.route = Math.abs(b.y - routeY) < band;
  });
  return F;
}
// Blades on the route lie down while a walker passes and as the path wears in. walks: [{t0, t1, xa, xb, tau}].
function n6Trample(F, walks, wear, D) {
  prog(q => {
    const t = q * D, w = wear(t);
    put(F.path, { o: w * .8 });
    F.blades.forEach(b => {
      if (!b.route) return;
      let press = 0;
      walks.forEach(k => {
        const f = (b.x - k.xa) / (k.xb - k.xa); if (f < 0 || f > 1) return;
        const u = t - (k.t0 + f * (k.t1 - k.t0));
        press = Math.max(press, u < -.15 ? 0 : u < 0 ? (u + .15) / .15 : Math.exp(-u / k.tau));
      });
      const lie = Math.max(press, w);
      put(b.g, { r: b.lean + (b.lean >= 0 ? 1 : -1) * 72 * lie, s: 1 - .5 * w });
    });
  }, 0, D, lin);
}
// A rat facing right (dir 1) or left (dir -1).
function n6RatShape(p, dir, color = '#8f8676') {
  const g = G(p), k = dir;
  path(g, `M${-30 * k} 4Q${-58 * k} 14 ${-80 * k} -2`, { stroke: color, 'stroke-width': 3 });
  mk('ellipse', { cx: 0, cy: 0, rx: 34, ry: 17, fill: color }, g);
  mk('ellipse', { cx: 30 * k, cy: -4, rx: 17, ry: 11, fill: color }, g);
  mk('circle', { cx: 24 * k, cy: -15, r: 6, fill: '#b49a8a' }, g);
  mk('circle', { cx: 40 * k, cy: -7, r: 2.6, fill: '#111' }, g);
  return g;
}
// A rat moving on a closed loop: pos(t) => [x, y].
function n6Rat(p, pos, D, s = 1) {
  const g = G(p, { s }); const R_ = n6RatShape(g, 1), L_ = n6RatShape(g, -1);
  prog(q => {
    const t = q * D, [x, y] = pos(t), [x2] = pos(t + .05), right = x2 >= x;
    put(g, { x, y }); put(R_, { o: right ? 1 : 0 }); put(L_, { o: right ? 0 : 1 });
  }, 0, D, lin);
  return g;
}
const n6Cup = (p, x, y, s = 1) => {
  const g = G(p, { x, y, s });
  path(g, 'M-26 -20H26V0Q26 22 0 22Q-26 22 -26 0Z', { fill: '#2a2320', stroke: EV.goldHi, 'stroke-width': 3 });
  path(g, 'M26 -12Q42 -12 42 0Q42 10 26 8', { stroke: EV.goldHi, 'stroke-width': 3 });
  g._steam = [-10, 4].map(x => path(g, `M${x} -30q-8 -12 0 -24q8 -12 0 -24`, { stroke: EV.dim, 'stroke-width': 3 }));
  return g;
};
const n6Bike = (p, x, y, s = 1) => {
  const g = G(p, { x, y, s });
  g._w = [-36, 36].map(cx => { const w = G(g, { x: cx, y: 0 }); mk('circle', { cx: 0, cy: 0, r: 22, fill: 'none', stroke: EV.goldHi, 'stroke-width': 3 }, w); path(w, 'M-22 0H22M0 -22V22', { stroke: EV.goldHi, 'stroke-width': 1.5, 'stroke-opacity': .6 }); return w; });
  path(g, 'M-36 0L-8 -30H24L36 0M-8 -30L4 0L24 -30M4 0H-36M-12 -38H0M24 -30L20 -42H30', { stroke: EV.goldHi, 'stroke-width': 3 });
  return g;
};

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'b_intro', (m, D) => {
    evDefs();
    const g = G(scene, { o: 0 });
    evGlow(g, 800, 490, 360, 'Gold', .3);
    // a network; one chain fires again and again and thickens as it does
    const pts = [[220, 500], [380, 450], [540, 520], [700, 460], [860, 515], [1020, 455], [1180, 520], [1340, 465], [300, 590], [470, 400], [640, 585], [800, 405], [960, 590], [1120, 400], [1270, 590], [1420, 560]];
    const edges = [[0, 8], [8, 2], [1, 9], [9, 3], [2, 10], [10, 4], [3, 11], [11, 5], [4, 12], [12, 6], [5, 13], [13, 7], [6, 14], [14, 15], [7, 15], [0, 9], [11, 13]];
    const net = n6Net(g, pts, edges, { color: EV.gold, r: 7, w: 2 });
    net.edges.forEach(e => e.setAttribute('stroke-opacity', .45));
    n6NetShow(net, .3, 1.6);
    const chain = path(g, 'M220 500C300 470 320 450 380 450S480 520 540 520S640 460 700 460S800 515 860 515S960 455 1020 455S1120 520 1180 520S1280 465 1340 465', { stroke: EV.goldHi, 'stroke-width': 1.5 }, { d: 0 });
    draw(chain, .8, 1.4);

    const passes = n6Times(1.6, 1.7, D - 1);
    n6Runs(passes.map(t => [t, chain]), 1.3, D, EV.goldHi, 7);
    prog(q => { const t = q * D; let w = 1.5;
      passes.forEach((p, i) => { const u = (t - p - 1.1) / .4; if (u > 0) w += (Math.min(9, 2 + i * 1.6) - w) * io(Math.min(1, u)); });
      chain.setAttribute('stroke-width', w.toFixed(2)); }, 0, D, lin);
    evText(g, L('kicker'), { x: 800, y: 190, size: 26, fill: EV.gold, weight: 500, ls: '6' });
    evText(g, L('title'), { x: 800, y: 320, size: 96, font: SERIF, weight: 600, maxW: 1360 });
    tw(g, { o: 1 }, .15, 1.1, out);

    put(sub, { y: 740 }); tw(sub, { y: 720, o: 1 }, m('sub'), .8, out);

  ['fixed', 'b_fixed', (m, D) => {
    const p = panel(0);
    const old = G(p);
    // the old picture: a chip with fixed traces
    const chip = G(old, { x: 440, y: 470, o: 0 });
    for (let k = -2; k <= 2; k++) {
      const v = k * 56;
      path(chip, `M${v} -170V-205M${v} 170V205M-170 ${v}H-205M170 ${v}H205`, { stroke: EV.gold, 'stroke-width': 6, 'stroke-opacity': .7 });
    }
    mk('rect', { x: -170, y: -170, width: 340, height: 340, rx: 18, fill: '#11181c', stroke: EV.gold, 'stroke-width': 3 }, chip);
    mk('rect', { x: -52, y: -52, width: 104, height: 104, rx: 8, fill: '#1a2226', stroke: EV.gold, 'stroke-width': 2.5 }, chip);
    const traces = ['M-140 -120H-80V-60H-52', 'M-140 -20H-100V20H-52', 'M-140 120H-60V52', 'M140 -120H60V-52', 'M52 0H100V-60H140', 'M52 30H90V120H140', 'M-20 52V140', 'M20 -52V-140']
      .map(d => path(chip, d, { stroke: EV.goldHi, 'stroke-width': 3.5 }, { d: 0 }));
    tw(chip, { o: 1 }, .2, .6);
    traces.forEach((e, i) => draw(e, .5 + i * .12, .5));
    lab(old, 'asPC', 440, 200, .7, { size: 32, fill: EV.dim, italic: true, font: SERIF, maxW: 560 });
    const ls = [['factory', 360, m('chip')], ['by30', 440, m('by30')], ['wear', 520, m('wear')]].map(([k, y, t]) =>
