// path() with an 'opacity' attribute: put() would overwrite it, so it goes into the state instead.

function c8Heat(p, x, y, color, t0, dur, n = 12, spread = 60, h = 200) {

// Piecewise-linear map from beat time to a value, through [t, v] knots (kept in time order).
function c8Knots(ks) {

// A time graph: baseline at y0, values 0..1 up to `top`. line(f) returns a path that can be drawn up to u (0..1).
function c8Graph(p, { x0 = 220, x1 = 1400, y0 = 600, top = 220, o = 1 } = {}) {

  p4r1: 'ഫൈറ്റ് ഓർ ഫ്ലൈറ്റ് ഹൃദയമിടിപ്പ് കൂട്ടുകയും ദഹനം നിർത്തിവെക്കുകയും ചെയ്യുന്നു.',
  p4r2: 'ഡോക്ടറെ കാണുന്നവരിൽ 90% പേരും സ്ട്രെസ് കാരണമാണെന്ന് തെളിയിക്കപ്പെട്ടിട്ടുണ്ട്.',
  p4r3: 'ദീർഘകാലം ഉയർന്ന കോർട്ടിസോൾ പ്രതിരോധശേഷിയെ ദുർബലമാക്കാം.',
  p4r4: 'ഉപയോഗിക്കാത്ത അഡ്രിനാലിൻ പേശികളിൽ സംഭരിക്കപ്പെട്ട് വേദന ഉണ്ടാക്കുന്നു.',
  p4w1: 'ശരി. ഇവ സിംപതറ്റിക് പ്രതികരണത്തിന്റെ പ്രധാന ഭാഗങ്ങളാണ്.', p4w2: 'തെറ്റ്. ഈ കണക്ക് പലരും ആവർത്തിക്കുന്നു, പക്ഷേ ഉറച്ച പഠനം പിന്തുണയ്ക്കുന്നില്ല.',

const PRACTICE = [
  { id: 'p-sameer', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 0, L('p1y'), [null, L('p1nb'), L('p1nc')]) },
  { id: 'p-express', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 1, L('p2y'), [L('p2na'), null, L('p2nc')]) },
  { id: 'p-client', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 2, L('p3y'), [L('p3na'), L('p3nb'), null]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('evolve:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '500 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '500 30px "Noto Serif Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
