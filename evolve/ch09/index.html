// Label that fades in at t (beat clock).
const lab = (p, key, x, y, t, o = {}) => { const e = evText(p, L(key), { x, y, o: 0, ...o }); show(e, t, o.dur || .5); return e; };
// Rising particles of a colour from a point, for a duration (emotional heat).
function heat(p, x, y, color, t0, dur, n = 14, spread = 70, h = 220) {
  const ds = Array.from({ length: n }, () => evDot(p, x, y, 5, color, 0));
  prog(q => {
    const t = q * dur;
    ds.forEach((d, i) => {
      const u = ((t * .45 + i / n) % 1), sx = Math.sin(i * 12.9898) * spread;
      put(d, { x: x + sx + Math.sin((t + i) * 2) * 8, y: y - u * h, o: Math.min(1, t * 1.5) * Math.sin(u * Math.PI) * .9 });
    });
  }, t0, dur, lin);
}
function headAt(p, e, color, t) {
  const n = e.getTotalLength(), a = e.getPointAtLength(n), b = e.getPointAtLength(n - 6);
  const h = evHead(p, a.x, a.y, Math.atan2(a.y - b.y, a.x - b.x) * 180 / Math.PI, color);
  put(h, { o: 0 }); show(h, t, .25);
  return h;
}

  q3nc: 'മാറ്റത്തിനിടയിൽ അസ്വസ്ഥത പ്രതീക്ഷിക്കേണ്ടതാണ്. പഴയ ചക്രം മുറിയുന്നു എന്നതിന്റെ സൂചനയാണ് അത്.',
  p1p: 'ഒരു ക്ലയന്റ് നിയന്ത്രിക്കുന്ന ഒരു പങ്കാളിയെ വിട്ട്, അതേപോലെയുള്ള മറ്റൊരാളെ വീണ്ടും കണ്ടെത്തുന്നു. ഈ അധ്യായം അനുസരിച്ച് എന്താണ് സംഭവിക്കുന്നത്?',
  p1a: 'പരിചിതമായ വികാരങ്ങൾ വീട് പോലെ തോന്നുന്നു: അവൾക്ക് ശീലമായ രസതന്ത്രം വീണ്ടും ഉണ്ടാക്കുന്ന ഒരാളിലേക്ക് അവൾ ആകർഷിക്കപ്പെടുന്നു.',
  p1b: 'ആരെ കണ്ടുമുട്ടുന്നു എന്നതിലെ വെറും നിർഭാഗ്യം.', p1c: 'വേദനിക്കുന്നത് അവൾ ബോധപൂർവ്വം ആസ്വദിക്കുന്നു.',
  p1y: 'ശരീരം അതിന്റെ പരിചിത അവസ്ഥ തേടുന്നു; അതുകൊണ്ട് വേദനിപ്പിക്കുമ്പോഴും പരിചിതനായ പങ്കാളി “ശരി” എന്ന് തോന്നുന്നു.',
  p1nb: 'ഒരേ മാതൃക ആവർത്തിക്കുന്നതാണ് സൂചന. അവളിലെ എന്തോ ഒരേ വികാരം തിരഞ്ഞെടുക്കുന്നു.',
  p1nc: 'ഇത് ബോധപൂർവ്വമായ ആസ്വാദനം അപൂർവ്വമാണ്. പരിചിതമായതിനെ സുരക്ഷിതമായി ശരീരം തെറ്റിദ്ധരിക്കുന്നു.',
  p2p: 'ഉത്കണ്ഠയുടെ ചക്രത്തിൽ, “ശരീരത്തിന് അസ്വസ്ഥത” കഴിഞ്ഞ് ഉടനെ എന്ത് വരുന്നു?',
  p2a: 'എന്തോ കുഴപ്പമുണ്ട് എന്നതിന്റെ തെളിവായി തലച്ചോർ അസ്വസ്ഥതയെ വായിക്കുന്നു, കൂടുതൽ ആശങ്കയുള്ള ചിന്തകൾ ഉണ്ടാക്കുന്നു.',
  p2b: 'ഒരു യഥാർത്ഥ അപകടം പ്രത്യക്ഷപ്പെടുന്നു.', p2c: 'ഹൈപ്പോതലാമസ് രാസവസ്തുക്കൾ ഉണ്ടാക്കുന്നത് നിർത്തുന്നു.',
  p2y: 'ചക്രം കൂടുതൽ വേഗത്തിൽ കറങ്ങുന്നത് ഇവിടെയാണ്: വികാരം കൂടുതൽ ചിന്തയ്ക്കുള്ള തെളിവാകുന്നു.',
  p2nb: 'അപകടം ആവശ്യമില്ല. ചക്രം സ്വന്തം രസതന്ത്രത്തിൽ ഓടുന്നു.', p2nc: 'അത് നിർത്തുന്നില്ല; ഓരോ പുതിയ ചിന്തയും പുതിയ ഓർഡർ നൽകുന്നു.',
  p3p: 'ഒരു ക്ലയന്റ് ഒരാഴ്ച പരാതി പറയുന്നത് നിർത്തി, എന്നിട്ട് പറയുന്നു, “എനിക്ക് കൂടുതൽ മോശം തോന്നുന്നു. ഇത് ഫലിക്കുന്നില്ല.” ഏറ്റവും സഹായകരമായ മറുപടി ഏത്?',
  p3a: 'ഇത് സാധാരണമാണെന്ന് പറയുക: തുടക്കത്തിൽ മോശം തോന്നുന്നത് പഴയ ചക്രത്തിൽ നിന്നുള്ള വിത്ഡ്രോവൽ ആണ്. പുതിയ വികാരം ദിവസവും പരിശീലിക്കുക.',
  p3b: 'ശരിയായി തോന്നാത്തതുകൊണ്ട് നിർത്താൻ പറയുക.', p3c: 'ആ വികാരം സാങ്കൽപ്പികമാണെന്ന് പറയുക.',
  p3y: 'അസ്വസ്ഥത തുറമുഖം വിടുന്നതിന്റെ അടയാളമാണ്, തെറ്റായ വഴിയുടേതല്ല. സ്ഥിരത പുതിയ ചക്രം പണിയുന്നു.',
  p3nb: '“ശരിയാണെന്ന തോന്നൽ” തന്നെയാണ് പഴയ രസതന്ത്രം ഉണ്ടാക്കുന്നത്. അതിനെ വഴികാട്ടിയാക്കിയാൽ നേരെ തിരിച്ചുപോകും.',
  p3nc: 'ആ വികാരം യഥാർത്ഥ രസതന്ത്രമാണ്. അതിനെ നിഷേധിക്കുന്നതിനേക്കാൾ വിത്ഡ്രോവൽ എന്ന് പേരിടുന്നതാണ് സഹായകരം.',
  p4p: 'പുസ്തകം അനുസരിച്ച്: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'പുസ്തകം അനുസരിച്ച്, ദിവസവും ആവർത്തിക്കുന്ന ഒരേ വികാരം ഒരേ ജീനുകളെ തിരക്കിലാക്കുന്നു, ബാക്കിയുള്ളവ ഉറങ്ങുന്നു.',
  p4r2: 'പുസ്തകം അനുസരിച്ച്, ദിവസവും ആവർത്തിക്കുന്ന ഒരു വികാരം കോശങ്ങളെ ഒട്ടും മാറ്റുന്നില്ല.',
  p4r3: 'പുസ്തകം അനുസരിച്ച്, പെപ്റ്റൈഡുകൾ രക്തത്തിലൂടെ സഞ്ചരിച്ച് കോശങ്ങളിലെ റിസപ്റ്ററുകളിൽ ചേരുന്നു.',
  p4w1: 'ശരി. ദിവസവും വരുന്ന ഒരേ സന്ദേശം ഒരേ ജീനുകളെ പണിയെടുപ്പിക്കുന്നു എന്ന് പുസ്തകം വിവരിക്കുന്നു.', p4w2: 'തെറ്റ്. ഡിസ്പെൻസയുടെ കാഴ്ചപ്പാടിൽ, ആവർത്തിക്കുന്ന വികാരങ്ങൾക്കനുസരിച്ച് കോശങ്ങൾ റിസപ്റ്ററുകൾ മാറ്റുന്നു. അപ്പോൾ ശരീരം ആ വികാരം ചോദിച്ചുതുടങ്ങുന്നു.',
  p4w3: 'ശരി. പുസ്തകത്തിൽ, താക്കോൽ പൂട്ടിൽ ചേരുന്നതുപോലെ പെപ്റ്റൈഡ് റിസപ്റ്ററിൽ ചേർന്ന് കോശത്തെ അകത്തുനിന്ന് മാറ്റുന്നു.',
});
const PRACTICE = [
  { id: 'p-partner', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 0, L('p1y'), [null, L('p1nb'), L('p1nc')]) },
  { id: 'p-anxiety', prompt: [L('p2p')], build: choice([[L('p2b')], [L('p2a')], [L('p2c')]], 1, L('p2y'), [L('p2nb'), null, L('p2nc')]) },
  { id: 'p-coach', prompt: [L('p3p')], build: choice([[L('p3b')], [L('p3c')], [L('p3a')]], 2, L('p3y'), [L('p3nb'), L('p3nc'), null]) },
  { id: 'p-ideas', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('evolve:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
