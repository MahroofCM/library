// path() with an opacity that survives put().
function pth(parent, d, attrs = {}, o = {}) {
  if (attrs.opacity !== undefined) { const { opacity, ...rest } = attrs; return path(parent, d, rest, { o: opacity, ...o }); }
  return path(parent, d, attrs, o);
}
// A second picture later in the beat, hidden until its time.
function c10Later(t) { const q = panel(t); put(q, { o: 0 }); tw(q, { o: 1 }, t + .4, .4); return q; }
// Rising particles of a colour from a point, for a duration (emotional heat).
function heat(p, x, y, color, t0, dur, n = 14, spread = 70, h = 220) {
  const ds = Array.from({ length: n }, () => evDot(p, x, y, 5, color, 0));
  prog(q => {
    const t = q * dur;
    ds.forEach((d, i) => {
      const u = ((t * .45 + i / n) % 1), sx = Math.sin(i * 12.9898) * spread;
      put(d, { x: x + sx + Math.sin((t + i) * 2) * 8, y: y - u * h, o: Math.min(1, t * 1.5, (dur - t) * 1.5) * Math.sin(u * Math.PI) * .9 });
    });
  }, t0, dur, lin);
}

// Wall clock: hands set by a function of beat time.
function c10Clock(p, x, y, r = 58) {
  const g = G(p, { x, y });
  mk('circle', { cx: 0, cy: 0, r, fill: '#10171b', stroke: EV.gold, 'stroke-width': 3 }, g);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; path(g, `M${Math.sin(a) * (r - 6)} ${-Math.cos(a) * (r - 6)}L${Math.sin(a) * (r - 14)} ${-Math.cos(a) * (r - 14)}`, { stroke: EV.dim, 'stroke-width': 2 }); }
  g._h = G(g); path(g._h, `M0 0V${-r * .5}`, { stroke: EV.ink, 'stroke-width': 5 });
  g._m = G(g); path(g._m, `M0 0V${-r * .78}`, { stroke: EV.ink, 'stroke-width': 3.5 });
  evDot(g, 0, 0, 5, EV.gold);
  g.set = minutes => { put(g._m, { r: minutes * 6 }); put(g._h, { r: minutes * .5 }); };

  p1nc: '“ഞാൻ മടിയനാണ്” ഒരു ശീലത്തെ വ്യക്തിത്വമാക്കുന്നു. ശീലങ്ങൾ മാറ്റിയെടുക്കാം; ലേബലുകൾ അവയെ ആവർത്തിക്കുന്നു.',
  p2p: 'ഏത് സാഹചര്യമാണ് ഫ്രോണ്ടൽ ലോബിൽ നിന്ന് ഏറ്റവും കൂടുതൽ ആവശ്യപ്പെടുന്നത്?',
  p2a: 'പതിവ് വഴിയിലൂടെ വീട്ടിലേക്ക് ഡ്രൈവ് ചെയ്യൽ.', p2b: 'മാപ്പ് ആപ്പില്ലാതെ അപരിചിതമായ ഒരു നഗരത്തിൽ വഴി കണ്ടെത്തൽ.', p2c: 'പല്ല് തേക്കൽ.',
  p2y: 'പുതിയതും ഉറപ്പില്ലാത്തതും: ഓരോ തിരിവിലും ലക്ഷ്യം പിടിക്കണം, പ്ലാൻ ചെയ്യണം, മാറ്റണം.',
  p2na: 'പരിചിതമായ വഴി ഓട്ടോപൈലറ്റിൽ ഓടും; ഫ്രോണ്ടൽ ലോബിന് മറ്റെവിടെയെങ്കിലും പോകാം.', p2nc: 'ആഴത്തിൽ വയർ ചെയ്ത ദിനചര്യക്ക് ഫ്രോണ്ടൽ ലോബ് മിക്കവാറും വേണ്ട.',
  p3p: 'ഒരു ക്ലയന്റ് പറയുന്നു: “ബോസ് എന്നെ വിമർശിക്കുമ്പോൾ, അറിയും മുമ്പേ ഞാൻ ദേഷ്യത്തിലാകും.” അടുത്ത തവണയ്ക്കായി എന്ത് പരിശീലിക്കാം?',
  p3a: 'കഴിയുന്നത്ര ബോസിനെ ഒഴിവാക്കുക.', p3b: 'ചിരിച്ചുകൊണ്ട് എല്ലാ വികാരവും അമർത്തുക.',
  p3c: 'ചൂട് ശ്രദ്ധിക്കുക, പേരിടുക (“പഴയ വികാരം”), ഒരു ശ്വാസം എടുക്കുക, അടുത്ത ചിന്ത തിരഞ്ഞെടുക്കുക.',
  p3y: 'ശ്രദ്ധിക്കുക, പേരിടുക, നിർത്തുക, തിരഞ്ഞെടുക്കുക: ശ്രദ്ധ ചക്രം മുറിക്കുന്ന വിടവ്.',
  p3na: 'ട്രിഗർ ഒഴിവാക്കിയാൽ പഴയ ചക്രം അടുത്ത തവണയ്ക്കായി അതേപടി ഇരിക്കും.', p3nb: 'അമർത്തൽ വികാരത്തെ ഒളിപ്പിക്കുന്നു, തിരഞ്ഞെടുക്കാനുള്ള വിടവ് തുറക്കുന്നില്ല.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'പ്രീഫ്രോണ്ടൽ കോർട്ടെക്സ് ഇരുപതുകളുടെ മധ്യം വരെ പക്വത നേടിക്കൊണ്ടിരിക്കുന്നു.',
  p4r2: 'തലച്ചോർ സെക്കൻഡിൽ 400 ബില്യൺ ബിറ്റ് കൈകാര്യം ചെയ്യുന്നുവെന്നും നാം 2,000 ശ്രദ്ധിക്കുന്നുവെന്നും ശാസ്ത്രം അളന്നിട്ടുണ്ട്.',
  p4r3: 'നന്നായി പരിശീലിച്ച ജോലികളേക്കാൾ പുതിയ ജോലികൾക്ക് ഫ്രോണ്ടൽ ലോബ് കൂടുതൽ പ്രവർത്തിക്കുന്നു.',
  p4r4: 'സുഖപ്പെടുമെന്ന് ഉറച്ച് തീരുമാനിച്ചാൽ ഗുരുതര രോഗം മാറുമെന്ന് തെളിയിക്കപ്പെട്ടിട്ടുണ്ട്.',
  p4w1: 'ശരി. കുട്ടിക്കാലം മുതൽ കൗമാരം വരെയുള്ള ബ്രെയിൻ ഇമേജിംഗ് ഇത് കാണിക്കുന്നു.', p4w2: 'തെറ്റ്. പ്രചാരത്തിലുള്ള ഈ കണക്കുകൾക്ക് ഉറച്ച പഠനത്തിന്റെ പിൻബലമില്ല.',
  p4w3: 'ശരി. ഒരു ജോലി ദിനചര്യയാകുമ്പോൾ പ്രവർത്തനം കുറയുന്നതായി സ്കാൻ പഠനങ്ങൾ കാണിക്കുന്നു.', p4w4: 'തെറ്റ്. കഥകളുണ്ട്, പക്ഷേ അനുഭവകഥകൾ തെളിവല്ല. ഉദ്ദേശ്യം പെരുമാറ്റത്തെ സഹായിക്കും; അത് ചികിത്സയല്ല.',
});
const PRACTICE = [
  { id: 'p-diet', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 0, L('p1y'), [null, L('p1nb'), L('p1nc')]) },
  { id: 'p-novel', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 1, L('p2y'), [L('p2na'), null, L('p2nc')]) },
  { id: 'p-boss', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 2, L('p3y'), [L('p3na'), L('p3nb'), null]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['t'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['f'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'ev-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('evolve:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'ev-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (LANG === 'ml' ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

evDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '500 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '500 30px "Noto Serif Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
