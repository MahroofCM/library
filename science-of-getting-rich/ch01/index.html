if (document.documentElement.lang === 'ml') window.SG_TR = {"\"Thinking the form of a slow-growing oak tree, it moves accordingly, and produces the tree.\"":"\"സാവധാനം വളരുന്ന ഒരു ഓക്ക് മരത്തിന്റെ രൂപം ചിന്തിച്ചുകൊണ്ട്, അത് അതിനനുസരിച്ച് ചലിക്കുകയും ആ മരം ഉണ്ടാക്കുകയും ചെയ്യുന്നു.\"","The Young Maker Universe · Interactive classics":"The Young Maker Universe · ഇന്ററാക്ടീവ് ക്ലാസിക്കുകൾ","The Science of":"സമ്പന്നനാകാനുള്ള","Getting Rich":"ശാസ്ത്രം","WALLACE D. WATTLES · 1910 · 17 CHAPTERS":"വാലസ് ഡി. വാട്ടിൽസ് · 1910 · 17 അദ്ധ്യായങ്ങൾ","A thought held clearly becomes a thing. Wattles' short manual, rebuilt as seventeen narrated lessons you can watch, hear and test yourself on.":"വ്യക്തമായി മനസ്സിൽ പിടിക്കുന്ന ഒരു ചിന്ത ഒരു വസ്തുവായി മാറുന്നു. വാട്ടിൽസിന്റെ ചെറിയ കൈപ്പുസ്തകം, കാണാനും കേൾക്കാനും സ്വയം പരീക്ഷിക്കാനും കഴിയുന്ന 17 ശബ്ദവിവരണ പാഠങ്ങളായി പുതുക്കിയെടുത്തിരിക്കുന്നു.","Open the book":"പുസ്തകം തുറക്കുക","Continue: chapter 17":"തുടരാം: അദ്ധ്യായം 17","There is a thinking stuff from which all things are made. A thought, in this substance, produces the thing that is imaged by the thought.":"എല്ലാ വസ്തുക്കളും ഉണ്ടായിരിക്കുന്നത് ഒരു ചിന്തിക്കുന്ന സത്തയിൽ നിന്നാണ്. ഈ സത്തയിലെ ഒരു ചിന്ത, ആ ചിന്ത സങ്കൽപ്പിക്കുന്ന വസ്തുവിനെ ഉണ്ടാക്കുന്നു.","The creed · Chapter 4":"വിശ്വാസപ്രമാണം · അദ്ധ്യായം 4","An oak tree drawn in gold lines":"സ്വർണ്ണവരകളിൽ വരച്ച ഒരു ഓക്ക് മരം","← Cover":"← പുറംചട്ട","Contents":"ഉള്ളടക്കം","Seventeen short chapters in five parts, each an animated, narrated lesson with quick checks. Open any chapter for its core idea and one line in Wattles' own words.":"അഞ്ച് ഭാഗങ്ങളിലായി പതിനേഴ് ചെറിയ അദ്ധ്യായങ്ങൾ. ഓരോന്നും പെട്ടെന്നുള്ള പരിശോധനകളുള്ള, ശബ്ദവിവരണത്തോടെയുള്ള ഒരു ആനിമേറ്റഡ് പാഠം. ഏത് അദ്ധ്യായം തുറന്നാലും അതിന്റെ കാതലായ ആശയവും വാട്ടിൽസിന്റെ സ്വന്തം വാക്കുകളിൽ ഒരു വരിയും കാണാം.","CONTINUE READING · PART 5 · CHAPTER 17":"വായന തുടരാം · PART 5 · CHAPTER 17","Summary of the science":"ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","The whole method on one page: thinking substance, a clear picture, faith, gratitude, and efficient action that gives more than it takes.":"മുഴുവൻ രീതിയും ഒറ്റ പേജിൽ: ചിന്തിക്കുന്ന സത്ത, വ്യക്തമായ ചിത്രം, വിശ്വാസം, നന്ദി, പിന്നെ എടുക്കുന്നതിലും കൂടുതൽ കൊടുക്കുന്ന കാര്യക്ഷമമായ പ്രവൃത്തി.","Completed. Replay any time.":"പൂർത്തിയാക്കി. എപ്പോൾ വേണമെങ്കിലും വീണ്ടും കാണാം.","Play lesson":"പാഠം കാണുക","Part 1":"ഭാഗം 1","The right and the science":"അവകാശവും ശാസ്ത്രവും","The right to be rich":"സമ്പന്നനാകാനുള്ള അവകാശം","Completed":"പൂർത്തിയായി","Wattles opens with permission. Body, mind and soul all grow by using things, and things cost money, so wanting more is simply life wanting to develop. Poverty is not holier.":"വാട്ടിൽസ് തുടങ്ങുന്നത് ഒരു അനുവാദത്തോടെയാണ്. ശരീരവും മനസ്സും ആത്മാവും വളരുന്നത് വസ്തുക്കൾ ഉപയോഗിച്ചാണ്, വസ്തുക്കൾക്ക് പണം വേണം. അതുകൊണ്ട് കൂടുതൽ ആഗ്രഹിക്കുന്നത് ജീവൻ വികസിക്കാൻ ആഗ്രഹിക്കുന്നതു മാത്രമാണ്. ദാരിദ്ര്യം കൂടുതൽ വിശുദ്ധമല്ല.","The object of all life is development.":"എല്ലാ ജീവന്റെയും ലക്ഷ്യം വികാസമാണ്.","Replay lesson":"പാഠം വീണ്ടും കാണുക","There is a science of getting rich":"സമ്പന്നനാകാൻ കൃത്യമായൊരു ശാസ്ത്രമുണ്ട്","Two people work the same trade on the same street and one prospers. Talent, thrift and location do not explain it. A Certain Way of doing things does, and anyone who can read can learn it.":"ഒരേ തെരുവിൽ ഒരേ ജോലി ചെയ്യുന്ന രണ്ടുപേർ. ഒരാൾ മാത്രം രക്ഷപ്പെടുന്നു. കഴിവോ മിതവ്യയമോ സ്ഥലമോ അതിന് കാരണമല്ല. കാര്യങ്ങൾ ചെയ്യുന്ന ഒരു നിശ്ചിത മാർഗമാണ് കാരണം. വായിക്കാൻ അറിയുന്ന ആർക്കും അത് പഠിക്കാം.","Like causes always produce like effects.":"ഒരേ കാരണങ്ങൾ എപ്പോഴും ഒരേ ഫലങ്ങൾ തന്നെ ഉണ്ടാക്കുന്നു.","Is opportunity monopolized?":"അവസരങ്ങൾ ആരുടെയെങ്കിലും കുത്തകയാണോ?","Nobody is kept poor because someone fenced off the supply. Opportunity moves like a tide toward new fields. The supply of raw material, and of ideas, has no ceiling.":"ആരോ ലഭ്യത വേലികെട്ടി അടച്ചതുകൊണ്ടല്ല ആരും ദരിദ്രരായി തുടരുന്നത്. അവസരം ഒരു വേലിയേറ്റം പോലെ പുതിയ മേഖലകളിലേക്ക് നീങ്ങുന്നു. അസംസ്കൃത വസ്തുക്കളുടെയും ആശയങ്ങളുടെയും ലഭ്യതയ്ക്ക് ഒരു പരിധിയുമില്ല.","There is abundance of opportunity for the man who will go with the tide.":"ഒഴുക്കിനൊപ്പം നീങ്ങാൻ തയ്യാറുള്ളവർക്ക് അവസരങ്ങൾ അനന്തമാണ്.","Part 2":"ഭാഗം 2","Thinking substance":"ചിന്തിക്കുന്ന പ്രപഞ്ചസത്ത","The first principle":"ഒന്നാമത്തെ അടിസ്ഥാനതത്വം","The creed: one thinking substance fills the universe, a thought held in it produces the form, and a person can impress a thought upon it. Wattles asks you to accept this and test it by acting on it.":"വിശ്വാസപ്രമാണം: ഒരു ചിന്തിക്കുന്ന സത്ത പ്രപഞ്ചം മുഴുവൻ നിറഞ്ഞിരിക്കുന്നു, അതിൽ പിടിക്കുന്ന ഒരു ചിന്ത രൂപം ഉണ്ടാക്കുന്നു, ഒരു മനുഷ്യന് അതിൽ ഒരു ചിന്ത പതിപ്പിക്കാൻ കഴിയും. ഇത് അംഗീകരിക്കാനും, അതനുസരിച്ച് പ്രവർത്തിച്ച് പരീക്ഷിക്കാനും വാട്ടിൽസ് ആവശ്യപ്പെടുന്നു.","Thought is the only power which can produce tangible riches from the Formless Substance.":"രൂപരഹിതമായ സത്തയിൽ നിന്ന് സമ്പത്ത് സൃഷ്ടിക്കാൻ കഴിയുന്ന ഒരേയൊരു ശക്തി ചിന്തയാണ്.","Increasing life":"ജീവിതത്തിന്റെ വികാസം","Life always seeks to become more, and the source of all things wants more life for everyone. So you never need to take from someone else. Rise out of competition into creation.":"ജീവൻ എപ്പോഴും കൂടുതൽ ആകാൻ ശ്രമിക്കുന്നു, എല്ലാറ്റിന്റെയും ഉറവിടം എല്ലാവർക്കും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. അതുകൊണ്ട് മറ്റൊരാളിൽ നിന്ന് ഒന്നും എടുക്കേണ്ടതില്ല. മത്സരത്തിൽ നിന്ന് സൃഷ്ടിയിലേക്ക് ഉയരുക.","You are to become a creator, not a competitor.":"നിങ്ങൾ ഒരു സ്രഷ്ടാവാകണം, വെറുമൊരു മത്സരാർത്ഥിയാകരുത്.","How riches come to you":"സമ്പത്ത് നിങ്ങളിലേക്ക് എത്തുന്ന വഴി","Give every person more in use value than you take in cash value. What you want arrives through people and trade, in deals that serve them too. And ask largely.":"ഓരോരുത്തരിൽ നിന്നും പണമൂല്യമായി എടുക്കുന്നതിനെക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം അവർക്ക് കൊടുക്കുക. നിങ്ങൾ ആഗ്രഹിക്കുന്നത് ആളുകളിലൂടെയും കച്ചവടത്തിലൂടെയും, അവർക്കും ഗുണമുള്ള ഇടപാടുകളിലൂടെ വന്നുചേരുന്നു. വലുതായി ചോദിക്കുക.","Give every man more in use value than you take from him in cash value.":"വാങ്ങുന്ന പണത്തേക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം ആളുകൾക്ക് തിരിച്ചുനൽകുക.","Gratitude":"കൃതജ്ഞത","Gratitude keeps your mind close to the source of supply and out of complaint and competition. It is also where faith comes from: a grateful mind expects good things.":"നന്ദി നിങ്ങളുടെ മനസ്സിനെ എല്ലാറ്റിന്റെയും ഉറവിടത്തോട് ചേർത്തുനിർത്തുന്നു, പരാതിയിൽ നിന്നും മത്സരത്തിൽ നിന്നും അകറ്റിനിർത്തുന്നു. വിശ്വാസം വരുന്നതും അവിടെ നിന്നാണ്: നന്ദിയുള്ള മനസ്സ് നല്ലത് പ്രതീക്ഷിക്കുന്നു.","Faith is born of gratitude.":"വിശ്വാസം ജനിക്കുന്നത് ആത്മാർത്ഥമായ കൃതജ്ഞതയിൽ നിന്നാണ്.","Part 3":"ഭാഗം 3","Thinking in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള ചിന്ത","A vague wish transmits nothing. Form a clear, detailed picture of what you want, hold it like a helmsman holds a heading, and live as if you already own it.":"അവ്യക്തമായ ഒരു ആഗ്രഹം ഒന്നും എത്തിക്കുന്നില്ല. നിങ്ങൾക്ക് വേണ്ടതിന്റെ വ്യക്തവും വിശദവുമായ ഒരു ചിത്രം ഉണ്ടാക്കുക. കപ്പിത്താൻ ദിശ വിടാതെ പിടിക്കുന്നതുപോലെ അത് മുറുകെ പിടിക്കുക. അത് ഇപ്പോഴേ സ്വന്തമായി എന്ന മട്ടിൽ ജീവിക്കുക.","You must know what you want, and be definite.":"നിങ്ങൾക്ക് എന്താണ് വേണ്ടതെന്ന് വ്യക്തമായി അറിയണം; അതിൽ പൂർണ്ണമായ വ്യക്തത വേണം.","How to use the will":"ഇച്ഛാശക്തി എങ്ങനെ ഉപയോഗിക്കാം","Never aim your will at other people or at the universe. Aim it at yourself, to keep your attention on the picture and off pictures of lack.":"നിങ്ങളുടെ ഇച്ഛ ഒരിക്കലും മറ്റുള്ളവരുടെ നേരെയോ പ്രപഞ്ചത്തിന്റെ നേരെയോ തിരിക്കരുത്. നിങ്ങളിലേക്കു തന്നെ തിരിക്കുക. ശ്രദ്ധ ആ ചിത്രത്തിൽ നിർത്താനും ഇല്ലായ്മയുടെ ചിത്രങ്ങളിൽ നിന്ന് മാറ്റാനും.","To get rich, you need only to use your will power upon yourself.":"സമ്പന്നനാകാൻ നിങ്ങളുടെ ഇച്ഛാശക്തി സ്വന്തം മനസ്സിൽ പ്രയോഗിച്ചാൽ മാത്രം മതി.","Further use of the will":"ഇച്ഛാശക്തിയുടെ കൂടുതൽ പ്രയോഗങ്ങൾ","Stop retelling past money troubles. Pick one system and stay with it. The best help you can give anyone is a working example.":"പഴയ പണപ്രശ്നങ്ങൾ വീണ്ടും വീണ്ടും പറയുന്നത് നിർത്തുക. ഒരു രീതി തിരഞ്ഞെടുത്ത് അതിൽ ഉറച്ചുനിൽക്കുക. ആർക്കും നിങ്ങൾ കൊടുക്കാവുന്ന ഏറ്റവും നല്ല സഹായം, ഫലം കണ്ട ഒരു മാതൃകയാകുക എന്നതാണ്.","An ounce of doing things is worth a pound of theorizing.":"ഒരു റാത്തൽ സിദ്ധാന്തത്തേക്കാൾ വിലയുണ്ട് ഒരു ഔൺസ് പ്രവൃത്തിക്ക്.","Part 4":"ഭാഗം 4","Acting in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള പ്രവൃത്തി","Thought sets things moving toward you; action is how you receive them. Act now, in your present work and place, not in some imagined future one.":"ചിന്ത കാര്യങ്ങളെ നിങ്ങളുടെ നേർക്ക് ചലിപ്പിക്കുന്നു; പ്രവൃത്തിയിലൂടെയാണ് നിങ്ങൾ അവയെ സ്വീകരിക്കുന്നത്. ഇപ്പോൾ പ്രവർത്തിക്കുക, ഇപ്പോഴത്തെ ജോലിയിലും സ്ഥലത്തും. സങ്കൽപ്പത്തിലെ ഏതോ ഭാവിജോലിയിലല്ല.","By thought, the thing you want is brought to you; by action you receive it.":"ചിന്തയിലൂടെ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് നിങ്ങളിലേക്ക് വരുന്നു; പ്രവൃത്തിയിലൂടെ നിങ്ങൾ അത് സ്വീകരിക്കുന്നു.","Efficient action":"കാര്യക്ഷമമായ പ്രവർത്തനം","Do every day all that can be done that day, and do each act well. Volume is not the measure. A day of inefficient acts is a failed day.":"ഓരോ ദിവസവും അന്ന് ചെയ്യാവുന്നതെല്ലാം ചെയ്യുക, ഓരോ കാര്യവും നന്നായി ചെയ്യുക. എത്ര ചെയ്തു എന്നതല്ല അളവ്. കാര്യക്ഷമമല്ലാത്ത പ്രവൃത്തികൾ നിറഞ്ഞ ദിവസം ഒരു പരാജയപ്പെട്ട ദിവസമാണ്.","Every act is, in itself, either a success or a failure.":"ഓരോ പ്രവൃത്തിയും അതിൽത്തന്നെ ഒന്നുകിൽ ഒരു വിജയമാണ്, അല്ലെങ്കിൽ ഒരു പരാജയമാണ്.","Getting into the right business":"ശരിയായ മേഖല തിരഞ്ഞെടുക്കൽ","Use your strongest faculties, or follow the work you most want to do. Change by growth, not by panic. When in doubt, wait and give thanks.":"നിങ്ങളുടെ ഏറ്റവും ശക്തമായ കഴിവുകൾ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ഏറ്റവും ചെയ്യാൻ ഇഷ്ടമുള്ള ജോലി തിരഞ്ഞെടുക്കുക. മാറ്റം വളർച്ചയിലൂടെയാകട്ടെ, പേടിച്ചോടിയല്ല. സംശയമുള്ളപ്പോൾ കാത്തിരിക്കുക, നന്ദി പറയുക.","Go as fast as you can, but never hurry.":"സാധ്യമായത്ര വേഗത്തിൽ മുന്നേറുക, എന്നാൽ ഒരിക്കലും അനാവശ്യമായി ധൃതികൂട്ടരുത്.","The impression of increase":"പുരോഗതിയുടെ അനുഭവം പകരുക","Everyone you deal with wants more life. Leave each of them with the sense that dealing with you advances them. Never seek power over others.":"നിങ്ങൾ ഇടപെടുന്ന എല്ലാവരും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. നിങ്ങളുമായുള്ള ഇടപാട് തങ്ങളെ മുന്നോട്ട് കൊണ്ടുപോകുന്നു എന്ന തോന്നൽ ഓരോരുത്തർക്കും നൽകുക. മറ്റുള്ളവരുടെ മേൽ ഒരിക്കലും അധികാരം തേടരുത്.","What I want for myself, I want for everybody.":"എനിക്കായി ഞാൻ ആഗ്രഹിക്കുന്നത് എന്തോ, അത് മറ്റെല്ലാവർക്കുമായി ഞാൻ ആഗ്രഹിക്കുന്നു.","The advancing man":"മുന്നേറുന്ന വ്യക്തി","Doctor, teacher, preacher or wage earner, the law is the same. Be too big for your present place and carry a clear picture of the person you are becoming.":"ഡോക്ടറോ അധ്യാപകനോ പ്രസംഗകനോ ശമ്പളക്കാരനോ ആകട്ടെ, നിയമം ഒന്നുതന്നെ. ഇപ്പോഴത്തെ സ്ഥാനത്തെക്കാൾ വലുതാകുക, നിങ്ങൾ ആയിത്തീരുന്ന വ്യക്തിയുടെ വ്യക്തമായ ചിത്രം കൂടെ കൊണ്ടുനടക്കുക.","There is a Power which never fails to present opportunity to the Advancing Man.":"മുന്നേറാൻ ദൃഢനിശ്ചയമുള്ള വ്യക്തിക്ക് അവസരങ്ങൾ ഒരുക്കുന്നതിൽ പ്രപഞ്ചം ഒരിക്കലും പരാജയപ്പെടാറില്ല.","Part 5":"ഭാഗം 5","Cautions and summary":"മുന്നറിയിപ്പുകളും സംഗ്രഹവും","Some cautions":"പ്രധാനപ്പെട്ട ചില മുന്നറിയിപ്പുകൾ","Guard your speech. Do not plan around imagined disasters. A seeming failure usually clears the way for something larger than you asked for.":"നിങ്ങളുടെ സംസാരം ശ്രദ്ധിക്കുക. സങ്കൽപ്പത്തിലെ ദുരന്തങ്ങളെ മുന്നിൽ കണ്ട് പദ്ധതിയിടരുത്. പരാജയം എന്ന് തോന്നുന്നത് പലപ്പോഴും നിങ്ങൾ ചോദിച്ചതിനെക്കാൾ വലിയ ഒന്നിന് വഴിയൊരുക്കുകയാണ്.","Never allow yourself to feel disappointed.":"നിരാശയ്ക്ക് ഒരിക്കലും നിങ്ങളുടെ മനസ്സിൽ ഇടം നൽകരുത്.","The riches they receive will be in exact proportion to the definiteness of their vision.":"മനുഷ്യർക്ക് ലഭിക്കുന്ന സമ്പത്ത് അവരുടെ സങ്കൽപ്പത്തിന്റെ വ്യക്തതയ്ക്കും, ലക്ഷ്യത്തിന്റെ ദൃഢതയ്ക്കും, വിശ്വാസത്തിന്റെ ആഴത്തിനും തുല്യമായിരിക്കും.","Text: Wallace D. Wattles, 1910, public domain. Lessons and drawings: The Young Maker Universe.":"മൂലകൃതി: വാലസ് ഡി. വാട്ടിൽസ്, 1910, പകർപ്പവകാശമുക്തം. പാഠങ്ങളും ചിത്രങ്ങളും: The Young Maker Universe.","Read the method, test it in your own life, keep what works.":"രീതി വായിക്കുക, സ്വന്തം ജീവിതത്തിൽ പരീക്ഷിക്കുക, ഫലിക്കുന്നത് നിലനിർത്തുക.","Play chapter 17, Summary of the science":"അദ്ധ്യായം 17 കാണുക, ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Part 5 · Chapter 17":"ഭാഗം 5 · അദ്ധ്യായം 17","Finished":"പൂർത്തിയായി","About 7 minutes · narrated · 3 question sets":"ഏകദേശം 7 മിനിറ്റ് · ശബ്ദവിവരണം · 3 ചോദ്യഭാഗങ്ങൾ","Play without voice":"ശബ്ദമില്ലാതെ കാണുക","Chapter 17 · results":"അദ്ധ്യായം 17 · ഫലം","1 of 5":"5-ൽ 1","First-try answers. Replay any step to review it.":"ആദ്യ ശ്രമത്തിലെ ഉത്തരങ്ങൾ. ഏത് ഘട്ടവും വീണ്ടും കണ്ട് ഓർമ്മ പുതുക്കാം.","Wattles: “The riches they receive will be in exact proportion to the definiteness of their vision.”":"വാട്ടിൽസ്: “അവർക്ക് കിട്ടുന്ന സമ്പത്ത് അവരുടെ വിഷൻ എത്ര കൃത്യമാണോ, കൃത്യമായി അതിന്റെ അനുപാതത്തിലായിരിക്കും.”","Back to contents":"ഉള്ളടക്കത്തിലേക്ക് മടങ്ങുക","Replay chapter":"അദ്ധ്യായം വീണ്ടും കാണുക","CC":"CC","Voice":"ശബ്ദം","Narrator voice":"വിവരണ ശബ്ദം","Narration off":"വിവരണം ഓഫ്","Space play or pause · ← → steps · C captions · M narration. Voices come from your device. Indian English voices are listed first; Edge on Windows has the most natural one (Prabhat).":"സ്പേസ്: പ്ലേ അല്ലെങ്കിൽ പോസ് · ← → ഘട്ടങ്ങൾ · C ക്യാപ്ഷൻ · M ശബ്ദവിവരണം. ശബ്ദങ്ങൾ നിങ്ങളുടെ ഉപകരണത്തിൽ നിന്നാണ്. മലയാളം ശബ്ദങ്ങൾ ആദ്യം കാണിക്കും. വിൻഡോസിലെ Edge-ലാണ് ഏറ്റവും സ്വാഭാവികമായ ശബ്ദം (Midhun).","Lesson animation":"പാഠത്തിന്റെ ആനിമേഷൻ","Play with narration":"ശബ്ദവിവരണത്തോടെ കാണുക","Previous step":"മുമ്പത്തെ ഘട്ടം","Play":"പ്ലേ","Next step":"അടുത്ത ഘട്ടം","Lesson steps":"പാഠത്തിലെ ഘട്ടങ്ങൾ","Step 1: Summary of the science":"ഘട്ടം 1: ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Step 2: A thought in the substance":"ഘട്ടം 2: സത്തയിലെ ഒരു ചിന്ത","A thought in the substance":"സത്തയിലെ ഒരു ചിന്ത","Step 3: Creative and grateful":"ഘട്ടം 3: സൃഷ്ടിയും നന്ദിയും","Creative and grateful":"സൃഷ്ടിയും നന്ദിയും","Step 4: The clear picture":"ഘട്ടം 4: വ്യക്തമായ ചിത്രം","The clear picture":"വ്യക്തമായ ചിത്രം","Step 5: Quick check":"ഘട്ടം 5: Quick check","Quick check":"Quick check","Step 6: Act in your present place":"ഘട്ടം 6: ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Act in your present place":"ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Step 7: More life l":"അനിൽ","body":"ശരീരം","mind":"മനസ്സ്","soul":"ആത്മാവ്","Fathima":"ഫാത്തിമ","Joseph":"ജോസഫ്","Which life would Wattles call real life?":"വാട്ടിൽസ് യഥാർത്ഥ ജീവിതം എന്ന് വിളിക്കുന്നത് ഏതിനെ?","Tap a person in the picture, or use the buttons.":"ചിത്രത്തിലെ ഒരാളെ തൊടുക, അല്ലെങ്കിൽ ബട്ടണുകൾ ഉപയോഗിക്കുക.","Anil lives only for the soul. Wattles says it is not right or noble to live for the soul and deny mind or body.":"അല്ല. അനിൽ ആത്മാവിനു വേണ്ടി മാത്രം ജീവിക്കുന്നു. മനസ്സിനെയോ ശരീരത്തെയോ നിഷേധിച്ച് ആത്മാവിനു വേണ്ടി മാത്രം ജീവിക്കുന്നത് ശരിയോ മഹത്തരമോ അല്ലെന്ന് വാട്ടിൽസ് പറയുന്നു.","Fathima lives for the intellect alone. Wattles calls it wrong to live for the mind and deny body or soul.":"അല്ല. ഫാത്തിമ ബുദ്ധിക്കു വേണ്ടി മാത്രം ജീവിക്കുന്നു. ശരീരത്തെയോ ആത്മാവിനെയോ നിഷേധിച്ച് മനസ്സിനു വേണ്ടി മാത്രം ജീവിക്കുന്നത് തെറ്റാണെന്ന് വാട്ടിൽസ് പറയുന്നു.","Right. Real life, says Wattles, is the full expression of body, mind and soul together.":"ശരിയുത്തരം! ശരീരവും മനസ്സും ആത്മാവും തുല്യമായി പരിഗണിക്കപ്പെടുകയും പൂർണ്ണമായി വികസിക്കുകയും ചെയ്യുന്നതാണ് യഥാർത്ഥ ജീവിതം എന്ന് വാട്ടിൽസ് വ്യക്തമാക്കുന്നു.","Continue":"തുടരുക","a nurse in Dubai":"ദുബായിലെ ഒരു നഴ്സ്","her family":"അവളുടെ കുടുംബം","in Kottayam":"കോട്ടയത്ത്","“love is denied expression by poverty”":"“ദാരിദ്ര്യം സ്നേഹത്തിന്റെ പ്രകടനം തടയുന്നു”","every month":"എല്ലാ മാസവും","college fees":"കോളേജ് ഫീസ്","a new roof":"പുതിയ മേൽക്കൂര","possibility":"സാധ്യത","not yet expressed":"ഇനിയും പ്രകടമാകാത്തത്","the desire for a richer,":"കൂടുതൽ സമൃദ്ധവും നിറവുമുള്ള","fuller, more abundant life":"ഒരു ജീവിതത്തിനുള്ള ആഗ്രഹം","Desire is possibility":"ആഗ്രഹം, പ്രകടമാകാൻ","seeking expression.":"ശ്രമിക്കുന്ന സാധ്യതയാണ്.","Success is becoming":"നിങ്ങൾ ആകാൻ ആഗ്രഹിക്കുന്നത്","what you want to be.":"ആയിത്തീരലാണ് വിജയം.","a duty to yourself, to God and to humanity":"നിങ്ങളോടും ദൈവത്തോടും മനുഷ്യരാശിയോടുമുള്ള കടമ","family":"കുടുംബം","community":"സമൂഹം","the world":"ലോകം","In Wattles' view, the wish to be rich is really…":"വാട്ടിൽസിന്റെ കാഴ്ചപ്പാടിൽ, സമ്പന്നനാകാനുള്ള ആഗ്രഹം യഥാർത്ഥത്തിൽ…","greed that a good person should control":"അടക്കിനിർത്തേണ്ട അത്യാഗ്രഹം","the desire for a richer, fuller life":"കൂടുതൽ സമൃദ്ധവും സംതൃപ്തവുമായ ജീവിതത്തിനായുള്ള ആഗ്രഹം","a sign that the soul is weak":"ആത്മീയ ബലഹീനതയുടെ അടയാളം","Wattles says the opposite. There is nothing wrong in wanting to get rich.":"അല്ല. വാട്ടിൽസ് പറയുന്നത് നേരെ തിരിച്ചാണ്. സമ്പന്നനാകാൻ ആഗ്രഹിക്കുന്നതിൽ ഒരു തെറ്റുമില്ല.","Right. Desire is possibility seeking expression, and that desire is praiseworthy.":"ശരിയുത്തരം! ആഗ്രഹം എന്നാൽ പുറത്തേക്ക് വരാൻ ശ്രമിക്കുന്ന സാധ്യതയാണ്, ആ ആഗ്രഹം ഉദാത്തവുമാണ്.","He treats body, mind and soul as equal. Wanting the things that feed all three is natural.":"അല്ല. ശരീരവും മനസ്സും ആത്മാവും തുല്യമായാണ് അദ്ദേഹം കാണുന്നത്. മൂന്നിനെയും പോഷിപ്പിക്കുന്നവ ആഗ്രഹിക്കുന്നത് സ്വാഭാവികമാണ്.","Chapter 1 in four lines":"അദ്ധ്യായം 1, നാല് വരികളിൽ","We grow by using things, and things cost money.":"വസ്തുക്കൾ ഉപയോഗിച്ചാണ് നമ്മൾ വളരുന്നത്, വസ്തുക്കൾക്ക് പണം വേണം.","Body, mind and soul are equal. Each must live fully.":"ശരീരവും മനസ്സും ആത്മാവും തുല്യം. ഓരോന്നും പൂർണ്ണമായി ജീവിക്കണം.","Love finds its natural expression in giving.":"സ്നേഹം സ്വാഭാവികമായി പ്രകടമാകുന്നത് കൊടുക്കുന്നതിലാണ്.","Desire is possibility seeking expression.":"ആഗ്രഹം, പ്രകടമാകാൻ ശ്രമിക്കുന്ന സാധ്യതയാണ്.","Chapter practice · 1 of 3":"Chapter practice · 3-ൽ 1","Why does Wattles say a person must be rich to develop fully?":"പൂർണ്ണമായി വികസിക്കാൻ സാമ്പത്തിക ഭദ്രത വേണമെന്ന് വാട്ടിൽസ് പറയാൻ കാരണം എന്താണ്?","Because money proves a person is worthy":"പണം ഒരാളുടെ യോഗ്യത തെളിയിക്കുന്നത് കൊണ്ട്","Because we grow by using things, and things must be bought":"വളർച്ചയ്ക്ക് വസ്തുക്കൾ അനിവാര്യമാണ്, അവ സ്വന്തമാക്കാൻ പണം വേണം","Because the body matters more than the soul":"ആത്മാവിനേക്കാൾ പ്രാധാന്യം ശരീരത്തിനാണ് എന്നതുകൊണ്ട്","Worth is not his point. His point is about use: we grow by using things.":"അല്ല. യോഗ്യതയല്ല അദ്ദേഹത്തിന്റെ വിഷയം. ഉപയോഗമാണ്. വസ്തുക്കൾ ഉപയോഗിച്ചാണ് നമ്മൾ വളരുന്നത്.","Right. Development needs things, and in society things cost money.":"ജീവിത വികാസത്തിന് സൗകര്യങ്ങൾ വേണം, സമൂഹത്തിൽ അവ സ്വന്തമാക്കാൻ പണം കൂടിയേ തീരൂ.","He says none of the three is better or holier than the others.":"അല്ല. മൂന്നിൽ ഒന്നും മറ്റുള്ളവയെക്കാൾ മികച്ചതോ വിശുദ്ധമോ അല്ലെന്നാണ് അദ്ദേഹം പറയുന്നത്.","Chapter practice · 2 of 3":"Chapter practice · 3-ൽ 2","A friend in Thrissur gives every waking hour to prayer and study, and neglects sleep, food and rest. By Chapter 1, Wattles would say…":"തൃശ്ശൂരിലുള്ള ഒരാൾ ഉറക്കവും ഭക്ഷണവും വിശ്രമവും അവഗണിച്ച് പ്രാർത്ഥനയ്ക്കും വായനയ്ക്കും മാത്രമായി സമയം ചെലവഴിക്കുന്നു. വാട്ടിൽസിന്റെ വീക്ഷണത്തിൽ ഇത്:","this is the holiest kind of life":"ഏറ്റവും ഉദാത്തമായ ജീവിതം","this is fine, because the mind and soul come first":"നല്ല ശൈലി, കാരണം ആത്മാവിനാണ് പ്രധാനം","he is not living fully, because his body is cut short":"പൂർണ്ണമായ ജീവിതമല്ല, കാരണം ഇവിടെ ശരീരം അവഗണിക്കപ്പെടുന്നു","This is the usual misreading. Wattles says it is not right or noble to live for the soul and deny the body.":"അല്ല. ഇതാണ് സാധാരണ പറ്റുന്ന തെറ്റിദ്ധാരണ. ശരീരത്തെ നിഷേധിച്ച് ആത്മാവിനു വേണ്ടി മാത്രം ജീവിക്കുന്നത് ശരിയോ മഹത്തരമോ അല്ലെന്ന് വാട്ടിൽസ് പറയുന്നു.","In his view no one of the three comes first. All are alike desirable.":"അല്ല. അദ്ദേഹത്തിന്റെ കാഴ്ചപ്പാടിൽ മൂന്നിൽ ഒന്നും ആദ്യം വരുന്നില്ല. മൂന്നും ഒരുപോലെ വേണ്ടതാണ്.","Right. If one of the three is cut short, none of them can live fully.":"മൂന്നിൽ ഒന്ന് അവഗണിച്ചാലും സമഗ്രമായ വളർച്ച അസാധ്യമാണ്.","Chapter practice · 3 of 3":"Chapter practice · 3-ൽ 3","Shabna is an accountant in Sharjah. She feels guilty for wanting a much higher salary. What would Wattles tell her?":"ഷാർജയിൽ അക്കൗണ്ടന്റായ ഷബ്നയ്ക്ക് ഉയർന്ന ശമ്പളം ആഗ്രഹിക്കുന്നതിൽ കുറ്റബോധം തോന്നുന്നു. വാട്ടിൽസ് അവളോട് എന്ത് പറയും?","The wish is praiseworthy. It is life seeking fuller expression, and it lets her give more.":"ആ ആഗ്രഹം സ്വാഭാവികമാണ്; അത് കൂടുതൽ സംതൃപ്തമായ ജീവിതം നേടാനും മറ്റുള്ളവരെ സഹായിക്കാനും വഴിയൊരുക്കും","Be content with what she has. Contentment with little is noble.":"ഉള്ളതുകൊണ്ട് തൃപ്തിപ്പെടുക; അതാണ് മഹത്തരം","Want it only for her family, never for herself":"കുടുംബത്തിന് വേണ്ടി മാത്രം ആഗ്രഹിക്കുക, സ്വന്തമായി ഒന്നും ആഗ്രഹിക്കരുത്","Right. He says the desire for riches is the desire for a richer, fuller life.":"സമൃദ്ധിക്കായുള്ള ആഗ്രഹം ജീവിതം കൂടുതൽ അർത്ഥവത്താക്കാനുള്ള പ്രേരണയാണ്.","Wattles rejects this. No one ought to be satisfied with a little if capable of using and enjoying more.":"അല്ല. വാട്ടിൽസ് ഇത് തള്ളിക്കളയുന്നു. കൂടുതൽ ഉപയോഗിക്കാനും ആസ്വദിക്കാനും കഴിവുള്ള ആരും കുറച്ചുകൊണ്ട് തൃപ്തിപ്പെടേണ്ടതില്ല.","He says making the most of yourself is the greatest service you can give. Wanting for yourself is not wrong.":"അല്ല. നിങ്ങളെത്തന്നെ പരമാവധി വളർത്തുന്നതാണ് ചെയ്യാവുന്ന ഏറ്റവും വലിയ സേവനം എന്ന് അദ്ദേഹം പറയുന്നു. തനിക്കു വേണ്ടി ആഗ്രഹിക്കുന്നത് തെറ്റല്ല.","Chapter 1 complete":"അദ്ധ്യായം 1 പൂർത്തിയായി","There is nothing wrong in wanting to get rich.":"സമ്പന്നനാകാൻ ആഗ്രഹിക്കുന്നതിൽ ഒരു തെറ്റുമില്ല.","it is not possible to live a really complete or successful life unless one is rich.":"സമ്പന്നനല്ലാതെ ശരിക്കും പൂർണ്ണമോ വിജയകരമോ ആയ ഒരു ജീവിതം ജീവിക്കാൻ സാധ്യമല്ല.","love finds its most natural and spontaneous expression in giving.":"സ്നേഹം ഏറ്റവും സ്വാഭാവികമായും സ്വയമേവയും പ്രകടമാകുന്നത് കൊടുക്കുന്നതിലാണ്.","no greater service than to make the most of yourself.":"നിങ്ങളെത്തന്നെ പരമാവധി വളർത്തുന്നതിനെക്കാൾ വലിയ സേവനമില്ല."};
