if (document.documentElement.lang === 'ml') window.SG_TR = {"\"Thinking the form of a slow-growing oak tree, it moves accordingly, and produces the tree.\"":"\"സാവധാനം വളരുന്ന ഒരു ഓക്ക് മരത്തിന്റെ രൂപം ചിന്തിച്ചുകൊണ്ട്, അത് അതിനനുസരിച്ച് ചലിക്കുകയും ആ മരം ഉണ്ടാക്കുകയും ചെയ്യുന്നു.\"","The Young Maker Universe · Interactive classics":"The Young Maker Universe · ഇന്ററാക്ടീവ് ക്ലാസിക്കുകൾ","The Science of":"സമ്പന്നനാകാനുള്ള","Getting Rich":"ശാസ്ത്രം","WALLACE D. WATTLES · 1910 · 17 CHAPTERS":"വാലസ് ഡി. വാട്ടിൽസ് · 1910 · 17 അദ്ധ്യായങ്ങൾ","A thought held clearly becomes a thing. Wattles' short manual, rebuilt as seventeen narrated lessons you can watch, hear and test yourself on.":"വ്യക്തമായി മനസ്സിൽ പിടിക്കുന്ന ഒരു ചിന്ത ഒരു വസ്തുവായി മാറുന്നു. വാട്ടിൽസിന്റെ ചെറിയ കൈപ്പുസ്തകം, കാണാനും കേൾക്കാനും സ്വയം പരീക്ഷിക്കാനും കഴിയുന്ന 17 ശബ്ദവിവരണ പാഠങ്ങളായി പുതുക്കിയെടുത്തിരിക്കുന്നു.","Open the book":"പുസ്തകം തുറക്കുക","Continue: chapter 17":"തുടരാം: അദ്ധ്യായം 17","There is a thinking stuff from which all things are made. A thought, in this substance, produces the thing that is imaged by the thought.":"എല്ലാ വസ്തുക്കളും ഉണ്ടായിരിക്കുന്നത് ഒരു ചിന്തിക്കുന്ന സത്തയിൽ നിന്നാണ്. ഈ സത്തയിലെ ഒരു ചിന്ത, ആ ചിന്ത സങ്കൽപ്പിക്കുന്ന വസ്തുവിനെ ഉണ്ടാക്കുന്നു.","The creed · Chapter 4":"വിശ്വാസപ്രമാണം · അദ്ധ്യായം 4","An oak tree drawn in gold lines":"സ്വർണ്ണവരകളിൽ വരച്ച ഒരു ഓക്ക് മരം","← Cover":"← പുറംചട്ട","Contents":"ഉള്ളടക്കം","Seventeen short chapters in five parts, each an animated, narrated lesson with quick checks. Open any chapter for its core idea and one line in Wattles' own words.":"അഞ്ച് ഭാഗങ്ങളിലായി പതിനേഴ് ചെറിയ അദ്ധ്യായങ്ങൾ. ഓരോന്നും പെട്ടെന്നുള്ള പരിശോധനകളുള്ള, ശബ്ദവിവരണത്തോടെയുള്ള ഒരു ആനിമേറ്റഡ് പാഠം. ഏത് അദ്ധ്യായം തുറന്നാലും അതിന്റെ കാതലായ ആശയവും വാട്ടിൽസിന്റെ സ്വന്തം വാക്കുകളിൽ ഒരു വരിയും കാണാം.","CONTINUE READING · PART 5 · CHAPTER 17":"വായന തുടരാം · PART 5 · CHAPTER 17","Summary of the science":"ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","The whole method on one page: thinking substance, a clear picture, faith, gratitude, and efficient action that gives more than it takes.":"മുഴുവൻ രീതിയും ഒറ്റ പേജിൽ: ചിന്തിക്കുന്ന സത്ത, വ്യക്തമായ ചിത്രം, വിശ്വാസം, നന്ദി, പിന്നെ എടുക്കുന്നതിലും കൂടുതൽ കൊടുക്കുന്ന കാര്യക്ഷമമായ പ്രവൃത്തി.","Completed. Replay any time.":"പൂർത്തിയാക്കി. എപ്പോൾ വേണമെങ്കിലും വീണ്ടും കാണാം.","Play lesson":"പാഠം കാണുക","Part 1":"ഭാഗം 1","The right and the science":"അവകാശവും ശാസ്ത്രവും","The right to be rich":"സമ്പന്നനാകാനുള്ള അവകാശം","Completed":"പൂർത്തിയായി","Wattles opens with permission. Body, mind and soul all grow by using things, and things cost money, so wanting more is simply life wanting to develop. Poverty is not holier.":"വാട്ടിൽസ് തുടങ്ങുന്നത് ഒരു അനുവാദത്തോടെയാണ്. ശരീരവും മനസ്സും ആത്മാവും വളരുന്നത് വസ്തുക്കൾ ഉപയോഗിച്ചാണ്, വസ്തുക്കൾക്ക് പണം വേണം. അതുകൊണ്ട് കൂടുതൽ ആഗ്രഹിക്കുന്നത് ജീവൻ വികസിക്കാൻ ആഗ്രഹിക്കുന്നതു മാത്രമാണ്. ദാരിദ്ര്യം കൂടുതൽ വിശുദ്ധമല്ല.","The object of all life is development.":"എല്ലാ ജീവന്റെയും ആത്യന്തിക ലക്ഷ്യം വികാസമാണ്.","Replay lesson":"പാഠം വീണ്ടും കാണുക","There is a science of getting rich":"സമ്പന്നനാകാൻ കൃത്യമായൊരു ശാസ്ത്രമുണ്ട്","Two people work the same trade on the same street and one prospers. Talent, thrift and location do not explain it. A Certain Way of doing things does, and anyone who can read can learn it.":"ഒരേ തെരുവിൽ ഒരേ ജോലി ചെയ്യുന്ന രണ്ടുപേർ. ഒരാൾ മാത്രം രക്ഷപ്പെടുന്നു. കഴിവോ മിതവ്യയമോ സ്ഥലമോ അതിന് കാരണമല്ല. കാര്യങ്ങൾ ചെയ്യുന്ന ഒരു നിശ്ചിത മാർഗമാണ് കാരണം. വായിക്കാൻ അറിയുന്ന ആർക്കും അത് പഠിക്കാം.","Like causes always produce like effects.":"ഒരേ കാരണങ്ങൾ എപ്പോഴും ഒരേ ഫലങ്ങൾ തന്നെ ഉണ്ടാക്കുന്നു.","Is opportunity monopolized?":"അവസരങ്ങൾ ആരുടെയെങ്കിലും കുത്തകയാണോ?","Nobody is kept poor because someone fenced off the supply. Opportunity moves like a tide toward new fields. The supply of raw material, and of ideas, has no ceiling.":"ആരോ ലഭ്യത വേലികെട്ടി അടച്ചതുകൊണ്ടല്ല ആരും ദരിദ്രരായി തുടരുന്നത്. അവസരം ഒരു വേലിയേറ്റം പോലെ പുതിയ മേഖലകളിലേക്ക് നീങ്ങുന്നു. അസംസ്കൃത വസ്തുക്കളുടെയും ആശയങ്ങളുടെയും ലഭ്യതയ്ക്ക് ഒരു പരിധിയുമില്ല.","There is abundance of opportunity for the man who will go with the tide.":"ഒഴുക്കിനൊപ്പം നീങ്ങാൻ തയ്യാറുള്ളവർക്ക് അവസരങ്ങൾ അനന്തമാണ്.","Part 2":"ഭാഗം 2","Thinking substance":"ചിന്തിക്കുന്ന പ്രപഞ്ചസത്ത","The first principle":"ഒന്നാമത്തെ തത്വം","The creed: one thinking substance fills the universe, a thought held in it produces the form, and a person can impress a thought upon it. Wattles asks you to accept this and test it by acting on it.":"വിശ്വാസപ്രമാണം: ഒരു ചിന്തിക്കുന്ന സത്ത പ്രപഞ്ചം മുഴുവൻ നിറഞ്ഞിരിക്കുന്നു, അതിൽ പിടിക്കുന്ന ഒരു ചിന്ത രൂപം ഉണ്ടാക്കുന്നു, ഒരു മനുഷ്യന് അതിൽ ഒരു ചിന്ത പതിപ്പിക്കാൻ കഴിയും. ഇത് അംഗീകരിക്കാനും, അതനുസരിച്ച് പ്രവർത്തിച്ച് പരീക്ഷിക്കാനും വാട്ടിൽസ് ആവശ്യപ്പെടുന്നു.","Thought is the only power which can produce tangible riches from the Formless Substance.":"രൂപരഹിത സത്തയിൽ നിന്ന് കൈയിൽ തൊടാവുന്ന സമ്പത്ത് ഉണ്ടാക്കാൻ കഴിയുന്ന ഒരേയൊരു ശക്തി ചിന്തയാണ്.","Increasing life":"ജീവിതത്തിന്റെ വികാസം","Life always seeks to become more, and the source of all things wants more life for everyone. So you never need to take from someone else. Rise out of competition into creation.":"ജീവൻ എപ്പോഴും കൂടുതൽ ആകാൻ ശ്രമിക്കുന്നു, എല്ലാറ്റിന്റെയും ഉറവിടം എല്ലാവർക്കും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. അതുകൊണ്ട് മറ്റൊരാളിൽ നിന്ന് ഒന്നും എടുക്കേണ്ടതില്ല. മത്സരത്തിൽ നിന്ന് സൃഷ്ടിയിലേക്ക് ഉയരുക.","You are to become a creator, not a competitor.":"നിങ്ങൾ ഒരു സ്രഷ്ടാവാകണം, വെറുമൊരു മത്സരാർത്ഥിയാകരുത്.","How riches come to you":"സമ്പത്ത് നിങ്ങളിലേക്ക് എത്തുന്ന വഴി","Give every person more in use value than you take in cash value. What you want arrives through people and trade, in deals that serve them too. And ask largely.":"ഓരോരുത്തരിൽ നിന്നും പണമൂല്യമായി എടുക്കുന്നതിനെക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം അവർക്ക് കൊടുക്കുക. നിങ്ങൾ ആഗ്രഹിക്കുന്നത് ആളുകളിലൂടെയും കച്ചവടത്തിലൂടെയും, അവർക്കും ഗുണമുള്ള ഇടപാടുകളിലൂടെ വന്നുചേരുന്നു. വലുതായി ചോദിക്കുക.","Give every man more in use value than you take from him in cash value.":"വാങ്ങുന്ന പണത്തേക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം ആളുകൾക്ക് തിരിച്ചുനൽകുക.","Gratitude":"കൃതജ്ഞത","Gratitude keeps your mind close to the source of supply and out of complaint and competition. It is also where faith comes from: a grateful mind expects good things.":"നന്ദി നിങ്ങളുടെ മനസ്സിനെ എല്ലാറ്റിന്റെയും ഉറവിടത്തോട് ചേർത്തുനിർത്തുന്നു, പരാതിയിൽ നിന്നും മത്സരത്തിൽ നിന്നും അകറ്റിനിർത്തുന്നു. വിശ്വാസം വരുന്നതും അവിടെ നിന്നാണ്: നന്ദിയുള്ള മനസ്സ് നല്ലത് പ്രതീക്ഷിക്കുന്നു.","Faith is born of gratitude.":"വിശ്വാസം ജനിക്കുന്നത് ആത്മാർത്ഥമായ കൃതജ്ഞതയിൽ നിന്നാണ്.","Part 3":"ഭാഗം 3","Thinking in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള ചിന്ത","A vague wish transmits nothing. Form a clear, detailed picture of what you want, hold it like a helmsman holds a heading, and live as if you already own it.":"അവ്യക്തമായ ഒരു ആഗ്രഹം ഒന്നും എത്തിക്കുന്നില്ല. നിങ്ങൾക്ക് വേണ്ടതിന്റെ വ്യക്തവും വിശദവുമായ ഒരു ചിത്രം ഉണ്ടാക്കുക. കപ്പിത്താൻ ദിശ വിടാതെ പിടിക്കുന്നതുപോലെ അത് മുറുകെ പിടിക്കുക. അത് ഇപ്പോഴേ സ്വന്തമായി എന്ന മട്ടിൽ ജീവിക്കുക.","You must know what you want, and be definite.":"നിങ്ങൾക്ക് എന്താണ് വേണ്ടതെന്ന് വ്യക്തമായി അറിയണം; അതിൽ പൂർണ്ണമായ വ്യക്തത വേണം.","How to use the will":"ഇച്ഛാശക്തി എങ്ങനെ ഉപയോഗിക്കാം","Never aim your will at other people or at the universe. Aim it at yourself, to keep your attention on the picture and off pictures of lack.":"നിങ്ങളുടെ ഇച്ഛ ഒരിക്കലും മറ്റുള്ളവരുടെ നേരെയോ പ്രപഞ്ചത്തിന്റെ നേരെയോ തിരിക്കരുത്. നിങ്ങളിലേക്കു തന്നെ തിരിക്കുക. ശ്രദ്ധ ആ ചിത്രത്തിൽ നിർത്താനും ഇല്ലായ്മയുടെ ചിത്രങ്ങളിൽ നിന്ന് മാറ്റാനും.","To get rich, you need only to use your will power upon yourself.":"സമ്പന്നനാകാൻ നിങ്ങളുടെ ഇച്ഛാശക്തി സ്വന്തം മനസ്സിൽ പ്രയോഗിച്ചാൽ മാത്രം മതി.","Further use of the will":"ഇച്ഛാശക്തിയുടെ കൂടുതൽ പ്രയോഗങ്ങൾ","Stop retelling past money troubles. Pick one system and stay with it. The best help you can give anyone is a working example.":"പഴയ പണപ്രശ്നങ്ങൾ വീണ്ടും വീണ്ടും പറയുന്നത് നിർത്തുക. ഒരു രീതി തിരഞ്ഞെടുത്ത് അതിൽ ഉറച്ചുനിൽക്കുക. ആർക്കും നിങ്ങൾ കൊടുക്കാവുന്ന ഏറ്റവും നല്ല സഹായം, ഫലം കണ്ട ഒരു മാതൃകയാകുക എന്നതാണ്.","An ounce of doing things is worth a pound of theorizing.":"ഒരു റാത്തൽ സിദ്ധാന്തത്തേക്കാൾ വിലയുണ്ട് ഒരു ഔൺസ് പ്രവൃത്തിക്ക്.","Part 4":"ഭാഗം 4","Acting in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള പ്രവൃത്തി","Thought sets things moving toward you; action is how you receive them. Act now, in your present work and place, not in some imagined future one.":"ചിന്ത കാര്യങ്ങളെ നിങ്ങളുടെ നേർക്ക് ചലിപ്പിക്കുന്നു; പ്രവൃത്തിയിലൂടെയാണ് നിങ്ങൾ അവയെ സ്വീകരിക്കുന്നത്. ഇപ്പോൾ പ്രവർത്തിക്കുക, ഇപ്പോഴത്തെ ജോലിയിലും സ്ഥലത്തും. സങ്കൽപ്പത്തിലെ ഏതോ ഭാവിജോലിയിലല്ല.","By thought, the thing you want is brought to you; by action you receive it.":"ചിന്തയിലൂടെ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് നിങ്ങളിലേക്ക് വരുന്നു; പ്രവൃത്തിയിലൂടെ നിങ്ങൾ അത് സ്വീകരിക്കുന്നു.","Efficient action":"കാര്യക്ഷമമായ പ്രവർത്തനം","Do every day all that can be done that day, and do each act well. Volume is not the measure. A day of inefficient acts is a failed day.":"ഓരോ ദിവസവും അന്ന് ചെയ്യാവുന്നതെല്ലാം ചെയ്യുക, ഓരോ കാര്യവും നന്നായി ചെയ്യുക. എത്ര ചെയ്തു എന്നതല്ല അളവ്. കാര്യക്ഷമമല്ലാത്ത പ്രവൃത്തികൾ നിറഞ്ഞ ദിവസം ഒരു പരാജയപ്പെട്ട ദിവസമാണ്.","Every act is, in itself, either a success or a failure.":"ഓരോ പ്രവൃത്തിയും അതിൽത്തന്നെ ഒന്നുകിൽ ഒരു വിജയമാണ്, അല്ലെങ്കിൽ ഒരു പരാജയമാണ്.","Getting into the right business":"ശരിയായ മേഖല തിരഞ്ഞെടുക്കൽ","Use your strongest faculties, or follow the work you most want to do. Change by growth, not by panic. When in doubt, wait and give thanks.":"നിങ്ങളുടെ ഏറ്റവും ശക്തമായ കഴിവുകൾ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ഏറ്റവും ചെയ്യാൻ ഇഷ്ടമുള്ള ജോലി തിരഞ്ഞെടുക്കുക. മാറ്റം വളർച്ചയിലൂടെയാകട്ടെ, പേടിച്ചോടിയല്ല. സംശയമുള്ളപ്പോൾ കാത്തിരിക്കുക, നന്ദി പറയുക.","Go as fast as you can, but never hurry.":"സാധ്യമായത്ര വേഗത്തിൽ മുന്നേറുക, എന്നാൽ ഒരിക്കലും അനാവശ്യമായി ധൃതികൂട്ടരുത്.","The impression of increase":"പുരോഗതിയുടെ അനുഭവം പകരുക","Everyone you deal with wants more life. Leave each of them with the sense that dealing with you advances them. Never seek power over others.":"നിങ്ങൾ ഇടപെടുന്ന എല്ലാവരും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. നിങ്ങളുമായുള്ള ഇടപാട് തങ്ങളെ മുന്നോട്ട് കൊണ്ടുപോകുന്നു എന്ന തോന്നൽ ഓരോരുത്തർക്കും നൽകുക. മറ്റുള്ളവരുടെ മേൽ ഒരിക്കലും അധികാരം തേടരുത്.","What I want for myself, I want for everybody.":"എനിക്കായി ഞാൻ ആഗ്രഹിക്കുന്നത് എന്തോ, അത് മറ്റെല്ലാവർക്കുമായി ഞാൻ ആഗ്രഹിക്കുന്നു.","The advancing man":"മുന്നേറുന്ന വ്യക്തി","Doctor, teacher, preacher or wage earner, the law is the same. Be too big for your present place and carry a clear picture of the person you are becoming.":"ഡോക്ടറോ അധ്യാപകനോ പ്രസംഗകനോ ശമ്പളക്കാരനോ ആകട്ടെ, നിയമം ഒന്നുതന്നെ. ഇപ്പോഴത്തെ സ്ഥാനത്തെക്കാൾ വലുതാകുക, നിങ്ങൾ ആയിത്തീരുന്ന വ്യക്തിയുടെ വ്യക്തമായ ചിത്രം കൂടെ കൊണ്ടുനടക്കുക.","There is a Power which never fails to present opportunity to the Advancing Man.":"മുന്നേറാൻ ദൃഢനിശ്ചയമുള്ള വ്യക്തിക്ക് അവസരങ്ങൾ ഒരുക്കുന്നതിൽ പ്രപഞ്ചം ഒരിക്കലും പരാജയപ്പെടാറില്ല.","Part 5":"ഭാഗം 5","Cautions and summary":"മുന്നറിയിപ്പുകളും സംഗ്രഹവും","Some cautions":"പ്രധാനപ്പെട്ട ചില മുന്നറിയിപ്പുകൾ","Guard your speech. Do not plan around imagined disasters. A seeming failure usually clears the way for something larger than you asked for.":"നിങ്ങളുടെ സംസാരം ശ്രദ്ധിക്കുക. സങ്കൽപ്പത്തിലെ ദുരന്തങ്ങളെ മുന്നിൽ കണ്ട് പദ്ധതിയിടരുത്. പരാജയം എന്ന് തോന്നുന്നത് പലപ്പോഴും നിങ്ങൾ ചോദിച്ചതിനെക്കാൾ വലിയ ഒന്നിന് വഴിയൊരുക്കുകയാണ്.","Never allow yourself to feel disappointed.":"നിരാശയ്ക്ക് ഒരിക്കലും നിങ്ങളുടെ മനസ്സിൽ ഇടം നൽകരുത്.","The riches they receive will be in exact proportion to the definiteness of their vision.":"മനുഷ്യർക്ക് ലഭിക്കുന്ന സമ്പത്ത് അവരുടെ സങ്കൽപ്പത്തിന്റെ വ്യക്തതയ്ക്കും, ലക്ഷ്യത്തിന്റെ ദൃഢതയ്ക്കും, വിശ്വാസത്തിന്റെ ആഴത്തിനും തുല്യമായിരിക്കും.","Text: Wallace D. Wattles, 1910, public domain. Lessons and drawings: The Young Maker Universe.":"മൂലകൃതി: വാലസ് ഡി. വാട്ടിൽസ്, 1910, പകർപ്പവകാശമുക്തം. പാഠങ്ങളും ചിത്രങ്ങളും: The Young Maker Universe.","Read the method, test it in your own life, keep what works.":"രീതി വായിക്കുക, സ്വന്തം ജീവിതത്തിൽ പരീക്ഷിക്കുക, ഫലിക്കുന്നത് നിലനിർത്തുക.","Play chapter 17, Summary of the science":"അദ്ധ്യായം 17 കാണുക, ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Part 5 · Chapter 17":"ഭാഗം 5 · അദ്ധ്യായം 17","Finished":"പൂർത്തിയായി","About 7 minutes · narrated · 3 question sets":"ഏകദേശം 7 മിനിറ്റ് · ശബ്ദവിവരണം · 3 ചോദ്യഭാഗങ്ങൾ","Play without voice":"ശബ്ദമില്ലാതെ കാണുക","Chapter 17 · results":"അദ്ധ്യായം 17 · ഫലം","1 of 5":"5-ൽ 1","First-try answers. Replay any step to review it.":"ആദ്യ ശ്രമത്തിലെ ഉത്തരങ്ങൾ. ഏത് ഘട്ടവും വീണ്ടും കണ്ട് ഓർമ്മ പുതുക്കാം.","Wattles: “The riches they receive will be in exact proportion to the definiteness of their vision.”":"വാട്ടിൽസ്: “അവർക്ക് കിട്ടുന്ന സമ്പത്ത് അവരുടെ വിഷൻ എത്ര കൃത്യമാണോ, കൃത്യമായി അതിന്റെ അനുപാതത്തിലായിരിക്കും.”","Back to contents":"ഉള്ളടക്കത്തിലേക്ക് മടങ്ങുക","Replay chapter":"അദ്ധ്യായം വീണ്ടും കാണുക","CC":"CC","Voice":"ശബ്ദം","Narrator voice":"വിവരണ ശബ്ദം","Narration off":"വിവരണം ഓഫ്","Space play or pause · ← → steps · C captions · M narration. Voices come from your device. Indian English voices are listed first; Edge on Windows has the most natural one (Prabhat).":"സ്പേസ്: പ്ലേ അല്ലെങ്കിൽ പോസ് · ← → ഘട്ടങ്ങൾ · C ക്യാപ്ഷൻ · M ശബ്ദവിവരണം. ശബ്ദങ്ങൾ നിങ്ങളുടെ ഉപകരണത്തിൽ നിന്നാണ്. മലയാളം ശബ്ദങ്ങൾ ആദ്യം കാണിക്കും. വിൻഡോസിലെ Edge-ലാണ് ഏറ്റവും സ്വാഭാവികമായ ശബ്ദം (Midhun).","Lesson animation":"പാഠത്തിന്റെ ആനിമേഷൻ","Play with narration":"ശബ്ദവിവരണത്തോടെ കാണുക","Previous step":"മുമ്പത്തെ ഘട്ടം","Play":"പ്ലേ","Next step":"അടുത്ത ഘട്ടം","Lesson steps":"പാഠത്തിലെ ഘട്ടങ്ങൾ","Step 1: Summary of the science":"ഘട്ടം 1: ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Step 2: A thought in the substance":"ഘട്ടം 2: സത്തയിലെ ഒരു ചിന്ത","A thought in the substance":"സത്തയിലെ ഒരു ചിന്ത","Step 3: Creative and grateful":"ഘട്ടം 3: സൃഷ്ടിയും നന്ദിയും","Creative and grateful":"സൃഷ്ടിയും നന്ദിയും","Step 4: The clear picture":"ഘട്ടം 4: വ്യക്തമായ ചിത്രം","The clear picture":"വ്യക്തമായ ചിത്രം","Step 5: Quick check":"ഘട്ടം 5: Quick check","Quick check":"Quick check","Step 6: Act in your present place":"ഘട്ടം 6: ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Act in your present place":"ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Step · മെഡിക്കൽ ഉപദേശമല്ല","a master mind":"ഒരു മാസ്റ്റർ മൈൻഡ്","steady thought against appearances":"പുറംകാഴ്ചകൾക്കെതിരെ ഉറച്ച ചിന്ത","True or false?":"ശരിയോ തെറ്റോ?","For Wattles, thinking by appearances is the easy road.":"ബാഹ്യസാഹചര്യങ്ങൾ കണ്ട് അതേപോലെ ചിന്തിക്കുകയാണ് എളുപ്പവഴി.","True":"ശരി","False":"തെറ്റ്","He says holding the truth against appearances takes little effort.":"പുറംകാഴ്ചകൾക്കെതിരെ ശരിയായ ചിന്ത മുറുകെ പിടിക്കാൻ വലിയ അധ്വാനം ആവശ്യമില്ല.","The truth he asks you to hold about poverty is that there is only abundance.":"ദാരിദ്ര്യം കാണുമ്പോഴും സമൃദ്ധിയുടെ ചിന്തയിൽ ഉറച്ചുനിൽക്കാനാണ് വാട്ടിൽസ് പറയുന്നത്.","True. He says it is easy, and that thinking truth regardless of appearances is the hard work.":"ശരി. അത് എളുപ്പമാണെന്നും, പുറംകാഴ്ച എന്തായാലും സത്യം ചിന്തിക്കുന്നതാണ് കഠിനമായ ജോലിയെന്നും അദ്ദേഹം പറയുന്നു.","Not quite. Look again at what Wattles says.":"അല്ല. വാട്ടിൽസ് പറയുന്നത് ഒന്നുകൂടി നോക്കൂ.","Not quite. He calls it the hardest work in the world.":"അല്ല. ലോകത്തിലെ ഏറ്റവും കഠിനമായ ജോലി എന്നാണ് അദ്ദേഹം അതിനെ വിളിക്കുന്നത്.","False. He calls sustained thought the hardest work in the world.":"തുടർച്ചയായ ഉറച്ച ചിന്തയാണ് ലോകത്തിലെ ഏറ്റവും കഠിനമായ അധ്വാനം.","True. Seeing poverty forms a matching picture unless you hold the thought of abundance.":"ശരി. സമൃദ്ധിയുടെ ചിന്ത മുറുകെ പിടിച്ചില്ലെങ്കിൽ, ദാരിദ്ര്യം കാണുമ്പോൾ മനസ്സിൽ അതിനൊത്ത ചിത്രം രൂപപ്പെടും.","one thinking substance":"ഒരേ ചിന്തിക്കുന്ന സത്ത","a thought produces the form":"ചിന്ത രൂപം ഉണ്ടാക്കുന്നു","you can impress your thought":"നിങ്ങളുടെ ചിന്ത പതിപ്പിക്കാം","read 1 time":"1 തവണ വായിച്ചു","cast it aside, he says":"അത് മാറ്റിവയ്ക്കൂ, അദ്ദേഹം പറയുന്നു","his claim · true until the process fails":"അദ്ദേഹത്തിന്റെ വാദം · പ്രക്രിയ പരാജയപ്പെടുംവരെ ശരി","logic + experiment":"യുക്തി + പരീക്ഷണം","read 15 times":"15 തവണ വായിച്ചു","read 30 times":"30 തവണ വായിച്ചു","Chapter 4 in four lines":"അദ്ധ്യായം 4, നാല് വരികളിൽ","Thought is the power that shapes formless substance.":"രൂപരഹിത സത്തയ്ക്ക് രൂപം നൽകുന്ന ശക്തി ചിന്തയാണ്.","Forms grow along lines of growth and trade.":"രൂപങ്ങൾ വളർച്ചയുടെയും കച്ചവടത്തിന്റെയും വഴികളിലൂടെ വളരുന്നു.","One substance. Thought makes form. You impress it.":"ഒരേ സത്ത. ചിന്ത രൂപം ഉണ്ടാക്കുന്നു. നിങ്ങൾ അത് പതിപ്പിക്കുന്നു.","Hold the truth against appearances. It is hard work.":"പുറംകാഴ്ചകൾക്കെതിരെ സത്യം മുറുകെ പിടിക്കൂ. അത് കഠിനമായ ജോലിയാണ്.","Chapter practice · 1 of 3":"Chapter practice · 3-ൽ 1","Which of these is the third statement of Wattles’ creed?":"വാട്ടിൽസിന്റെ മൂന്നാമത്തെ അടിസ്ഥാന തത്വം എന്താണ്?","There is one thinking stuff from which all things are made":"എല്ലാം ഉണ്ടായത് ഒരേ സത്തയിൽ നിന്നാണ്","A person can impress a thought on formless substance and cause the thing to be created":"മനുഷ്യന് തന്റെ ചിന്തകളെ പ്രപഞ്ചസത്തയിൽ പതിപ്പിച്ച് ആഗ്രഹിക്കുന്നവ സൃഷ്ടിക്കാൻ കഴിയും","Riches come to those who work the hardest with their hands":"കഠിനാധ്വാനം ചെയ്യുന്നവർക്ക് മാത്രമാണ് സമ്പത്ത് ലഭിക്കുന്നത്","That is the first statement, about the substance itself.":"അത് ഒന്നാമത്തെ പ്രസ്താവനയാണ്, സത്തയെക്കുറിച്ചുള്ളത്.","Right. The third statement gives the person a part to play.":"മനുഷ്യന്റെ ചിന്താശക്തിക്കാണ് ഇവിടെ മുൻഗണന നൽകുന്നത്.","Wattles says people have so far worked only with their hands. The creed points beyond that.":"ഇതുവരെ മനുഷ്യർ കൈകൊണ്ട് മാത്രമാണ് പണിയെടുത്തത് എന്ന് വാട്ടിൽസ് പറയുന്നു. വിശ്വാസപ്രമാണം അതിനപ്പുറത്തേക്കാണ് ചൂണ്ടുന്നത്.","Chapter practice · 2 of 3":"Chapter practice · 3-ൽ 2","A coconut farmer in Palakkad holds a clear picture of his own small coconut oil unit. How would Wattles expect it to come?":"പാലക്കാട്ടെ ഒരു കർഷകൻ സ്വന്തമായി ഒരു വെളിച്ചെണ്ണ മിൽ സ്വപ്നം കാണുന്നു. അത് എങ്ങനെയാണ് യാഥാർത്ഥ്യമാവുക?","It appears overnight, with no people involved":"മാന്ത്രികമായി ഒറ്റ രാത്രികൊണ്ട് പ്രത്യക്ഷപ്പെടും","Only by beating the other farmers in the village":"മറ്റുള്ളവരെ തകർത്തുകൊണ്ട് മാത്രം","Through existing channels such as a loan, a supplier and buyers, along lines of growth":"ബാങ്ക്, വിപണി, സുഹൃത്തുക്കൾ തുടങ്ങിയ നിലവിലുള്ള സ്വാഭാവിക വഴികളിലൂടെ","Wattles says forms usually come along existing lines, like the oak and the house.":"ഓക്കും വീടും പോലെ, രൂപങ്ങൾ സാധാരണ നിലവിലുള്ള വഴികളിലൂടെയാണ് വരുന്നത് എന്ന് വാട്ടിൽസ് പറയുന്നു.","That is competition. The creed does not need anyone to lose.":"അത് മത്സരമാണ്. വിശ്വാസപ്രമാണത്തിന് ആരും തോൽക്കേണ്ടതില്ല.","Right. Like the house, it comes through ordinary trade, turned toward his picture.":"സൃഷ്ടി നടക്കുന്നത് നിലവിലെ സംവിധാനങ്ങളിലൂടെയാണ്.","Chapter practice · 3 of 3":"Chapter practice · 3-ൽ 3","A shop owner in Kozhikode has a slow month, and the empty till is all she sees. What does chapter four ask of her?":"കച്ചവടം കുറഞ്ഞ് ബുദ്ധിമുട്ടുന്ന ഒരു കടയുടമയോട് നാലാം അധ്യായം നിർദ്ദേശിക്കുന്നത് എന്താണ്?","Hold the thought of abundance, regardless of the appearance":"ബാഹ്യപ്രതിസന്ധികൾക്കിടയിലും സമൃദ്ധിയുടെ ചിന്ത മുറുകെ പിടിക്കുക","Study the empty till until the picture is clear":"വരുമാനം കുറഞ്ഞതിൽ നിരാശപ്പെട്ട് കട പൂട്ടുക","Give up the creed, since the evidence is against it":"എല്ലാം വിധിക്ക് വിട്ടുകൊടുക്കുക","Right. Wattles says seeing lack forms a picture of lack unless you hold the truth of abundance.":"കുറവുകളിൽ ശ്രദ്ധ കേന്ദ്രീകരിച്ചാൽ വീണ്ടും കുറവുകൾ മാത്രമേ ഉണ്ടാവൂ.","That is thinking by appearances, the easy road Wattles warns about.":"അത് പുറംകാഴ്ച നോക്കിയുള്ള ചിന്തയാണ്, വാട്ടിൽസ് മുന്നറിയിപ്പ് നൽകുന്ന എളുപ്പവഴി.","Wattles asks for steady acceptance and says the theory holds until the process fails.":"ഉറച്ച അംഗീകാരമാണ് വാട്ടിൽസ് ആവശ്യപ്പെടുന്നത്. പ്രക്രിയ പരാജയപ്പെടുംവരെ സിദ്ധാന്തം ശരിയാണ് എന്ന് അദ്ദേഹം പറയുന്നു.","Chapter 4 complete":"അദ്ധ്യായം 4 പൂർത്തിയായി","The science of getting rich begins with the absolute acceptance of this faith.":"ഈ വിശ്വാസം പൂർണമായി അംഗീകരിക്കുന്നതിലൂടെയാണ് സമ്പന്നനാകാനുള്ള ശാസ്ത്രം ആരംഭിക്കുന്നത്."};

<script src="../lib/sogr.js"></script>
<script>
'use strict';
/* Chapter 4: The first principle */
(() => {
const { mk, C, FD, FT, FM, E, REDUCED, track, G, T, Pth, valAt, lastEl, tw, show, hide, draw, rise, pop, prog, clockRun, render, figure, painting, furs, gun, fish, ring, sewing, stamp, label, heading, quoteBlock, chip, arrow, strike, S, QZ, wrapEl, quiz, choice, truth, pickQ, finishCard, askFrame, titleCard, takeawaysBeat, practiceBeat, finishBeat, checkBeat, truthBeat, META, chapter, beats, tr, norm, LANG, NS } = SG;
/* ---------- chapter helpers ---------- */
const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
const ln = (g, d, col = C.ink, w = 3, extra = {}) => mk('path', Object.assign({ d, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, extra), g);
// formless substance: gold dots scattered in an ellipse around (cx, cy)
function dotsField(p, cx, cy, rx, ry, n, seed, { col = C.gold, r = 2.2, op = .55 } = {}) {
  const R = rng(seed), g = G(p), pts = [];
  for (let i = 0; i < n; i++) {
    let x, y; do { x = R() * 2 - 1; y = R() * 2 - 1; } while (x * x + y * y > 1);
    const X = cx + x * rx, Y = cy + y * ry, o = op * (.45 + R() * .55);
    const c = mk('circle', { cx: X.toFixed(1), cy: Y.toFixed(1), r: (r * (.6 + R() * .8)).toFixed(2), fill: col, opacity: o.toFixed(2) }, g);
    pts.push({ c, x: X, y: Y, o, ph: R() * 6.28 });
  }
  g.pts = pts; return g;
}
// dots gather onto a path: a thought taking form in the substance
function formFrom(field, d, idx, t0, dur = 1.1, bright = true) {
  const tmp = mk('path', { d, fill: 'none', stroke: 'none' }, field); const L = tmp.getTotalLength();
  const sel = idx.map((k, j) => { const pt = tmp.getPointAtLength(L * j / idx.length); return [field.pts[k], pt.x, pt.y]; });
  prog(q => { for (const [p0, x, y] of sel) { p0.c.setAttribute('cx', (p0.x + (x - p0.x) * q).toFixed(1)); p0.c.setAttribute('cy', (p0.y + (y - p0.y) * q).toFixed(1)); if (bright) p0.c.setAttribute('opacity', (p0.o + (1 - p0.o) * q).toFixed(2)); } }, t0, dur, E.io);
}
const range = (a, n) => Array.from({ length: n }, (_, k) => a + k);
// a head in profile, facing left, drawn around the neck base (0,0)
function head(p, x, y, s = 1, col = C.ink) {
  const g = G(p, { x, y, s });
  ln(g, 'M40 0 Q42 -50 62 -76 Q92 -118 78 -176 Q62 -246 -6 -252 Q-74 -252 -90 -190 Q-96 -166 -106 -150 Q-114 -136 -96 -130 Q-96 -110 -92 -96 Q-90 -72 -66 -68 Q-46 -66 -44 0', col, 3 / s, { fill: C.board });
  return g;
}
const HOUSE = 'M-50 50 V-10 L0 -55 L50 -10 V50 Z';

/* ---------- THE CREED EMBLEM ----------
   Three gold medallions, the book's recurring picture of Wattles' creed:
   I   one thinking substance (a field of dots)
   II  a thought in it produces the form (a dashed outline, then dots gather into it)
   III you can impress your thought on it (a head sends a thought, dots take its shape)
   creedEmblem(p, { x, y, s, gap, t: [t1, t2, t3], labels }) -> { g, med: [m1, m2, m3] }  (each med has .box for pickQ) */
function creedEmblem(p, { x = 800, y = 430, s = 1, gap = 480, t = [0, 0, 0], labels = true } = {}) {
  const g = G(p, { x, y, s }); const med = [];
  const texts = [['One thinking substance'], ['A thought in it', 'produces the form'], ['You can impress', 'your thought on it']];
  ['I', 'II', 'III'].forEach((num, i) => {
    const M = G(g, { x: (i - 1) * gap, y: 0, o: 0 }); M.box = [-180, -222, 360, labels ? 500 : 400];
    mk('circle', { r: 150, fill: C.board, stroke: C.gold, 'stroke-width': 3 }, M);
    mk('circle', { r: 138, fill: 'none', stroke: C.gold, 'stroke-width': 1, opacity: .5 }, M);
    T(M, num, { x: 0, y: -170, size: 34, font: FD, weight: 600, fill: C.gold, anchor: 'middle' });
    if (labels) texts[i].forEach((s2, k) => T(M, s2, { x: 0, y: 202 + k * 34, size: 28, fill: C.ink, anchor: 'middle' }));
    const t0 = t[i];
    tw(M, { o: 1 }, t0, .6); M._b.s = .9; tw(M, { s: 1 }, t0, .7, E.back);
    if (i === 0) {
      const f = dotsField(M, 0, 0, 118, 118, 150, 17, { op: .7 });
      const tA = t0 + .8;
      clockRun(tt => { const k = tt < tA ? 0 : Math.min(1, (tt - tA) / 1); for (const d of f.pts) d.c.setAttribute('opacity', (d.o * (1 + k * .8 * (.5 + .5 * Math.sin(tt * 2.2 + d.ph)))).toFixed(2)); }, 200);
    } else if (i === 1) {
      const f = dotsField(M, 0, 0, 118, 118, 130, 23, { op: .6 });
      const th = Pth(M, HOUSE, { stroke: C.goldHi, 'stroke-width': 2, 'stroke-dasharray': '6 7' }, { o: 0 }); tw(th, { o: 1 }, t0 + .3, .5);
      formFrom(f, HOUSE, range(0, 70), t0 + .9, 1.2);
      const solid = Pth(M, HOUSE, { stroke: C.goldHi, 'stroke-width': 3.5 }, { dw: 0 }); draw(solid, t0 + 1.8, .7);
    } else {
      const f = dotsField(M, 40, 0, 80, 110, 90, 41, { op: .6 });
      const hd = head(M, -64, 70, .42, C.ink);
      const ray = Pth(M, 'M-96 -30 Q-40 -60 4 -26', { stroke: C.goldHi, 'stroke-width': 2.5, 'stroke-dasharray': '5 6' }, { o: 0 }); tw(ray, { o: 1 }, t0 + .4, .4);
      const C2 = 'M46 -30 A30 30 0 1 1 45.9 -30';
      formFrom(f, C2, range(0, 46), t0 + .9, 1.1);
      const coin = Pth(M, C2, { stroke: C.goldHi, 'stroke-width': 3.5 }, { dw: 0 }); draw(coin, t0 + 1.8, .6);
    }
    med.push(M);
  });
  return { g, med };
}

/* ---------- scenes reused by checks ---------- */
function appearScene(p, m) {
  // the appearance: an empty, open purse
  const ap = G(p, { x: 330, y: 470, o: 0 }); show(ap, .2);
  ln(ap, 'M-110 -40 H110 L96 80 H-96 Z', C.cash, 3, { fill: C.board });
  ln(ap, 'M-110 -40 Q0 -110 110 -40', C.cash, 2.5);
  ln(ap, 'M-30 20 H30', C.dim, 2);
  T(p, 'what you see', { x: 330, y: 610, size: 26, fill: C.dim, anchor: 'middle' });
  const hd = head(p, 1080, 700, 1.7); hd._b.o = 0; show(hd, .3);
  // the matching picture forming in the mind
  const ray = Pth(p, 'M460 470 Q700 420 900 410', { stroke: C.cash, 'stroke-width': 2.5, 'stroke-dasharray': '1 1' }, { dw: 0 }); draw(ray, m('poverty', .2), .9);
  const copy = G(p, { x: 1090, y: 420, s: .45, o: 0 }); tw(copy, { o: 1 }, m('poverty', 1), .5);
  ln(copy, 'M-110 -40 H110 L96 80 H-96 Z', C.loss, 5, { fill: C.board }); ln(copy, 'M-110 -40 Q0 -110 110 -40', C.loss, 4);
  const lack = T(p, 'a matching picture forms', { x: 1090, y: 210, size: 28, fill: C.loss, font: FD, italic: true, weight: 600, anchor: 'middle', o: 0 }); show(lack, m('poverty', 1.2)); hide(lack, m('abundance'), .3);
  // the truth held: a gold ring guards the mind and abundance replaces lack
  const ring = Pth(p, 'M1090 230 A230 230 0 1 1 1089.9 230', { stroke: C.gold, 'stroke-width': 4 }, { dw: 0 }); draw(ring, m('abundance'), 1);
  tw(ray, { o: .25 }, m('abundance', .4), .5); hide(copy, m('abundance', .5), .4);
  const ab = dotsField(p, 1090, 430, 120, 110, 120, 5, { op: .8 }); ab._b.o = 0; tw(ab, { o: 1 }, m('abundance', .7), .8);
  const abl = T(p, 'only abundance', { x: 1090, y: 210, size: 32, fill: C.goldHi, font: FD, italic: true, weight: 600, anchor: 'middle', o: 0 }); show(abl, m('abundance', .8));
  return { ring };
}

const NARR = {
