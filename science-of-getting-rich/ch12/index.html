if (document.documentElement.lang === 'ml') window.SG_TR = {"\"Thinking the form of a slow-growing oak tree, it moves accordingly, and produces the tree.\"":"\"സാവധാനം വളരുന്ന ഒരു ഓക്ക് മരത്തിന്റെ രൂപം ചിന്തിച്ചുകൊണ്ട്, അത് അതിനനുസരിച്ച് ചലിക്കുകയും ആ മരം ഉണ്ടാക്കുകയും ചെയ്യുന്നു.\"","The Young Maker Universe · Interactive classics":"The Young Maker Universe · ഇന്ററാക്ടീവ് ക്ലാസിക്കുകൾ","The Science of":"സമ്പന്നനാകാനുള്ള","Getting Rich":"ശാസ്ത്രം","WALLACE D. WATTLES · 1910 · 17 CHAPTERS":"വാലസ് ഡി. വാട്ടിൽസ് · 1910 · 17 അദ്ധ്യായങ്ങൾ","A thought held clearly becomes a thing. Wattles' short manual, rebuilt as seventeen narrated lessons you can watch, hear and test yourself on.":"വ്യക്തമായി മനസ്സിൽ പിടിക്കുന്ന ഒരു ചിന്ത ഒരു വസ്തുവായി മാറുന്നു. വാട്ടിൽസിന്റെ ചെറിയ കൈപ്പുസ്തകം, കാണാനും കേൾക്കാനും സ്വയം പരീക്ഷിക്കാനും കഴിയുന്ന 17 ശബ്ദവിവരണ പാഠങ്ങളായി പുതുക്കിയെടുത്തിരിക്കുന്നു.","Open the book":"പുസ്തകം തുറക്കുക","Continue: chapter 17":"തുടരാം: അദ്ധ്യായം 17","There is a thinking stuff from which all things are made. A thought, in this substance, produces the thing that is imaged by the thought.":"എല്ലാ വസ്തുക്കളും ഉണ്ടായിരിക്കുന്നത് ഒരു ചിന്തിക്കുന്ന സത്തയിൽ നിന്നാണ്. ഈ സത്തയിലെ ഒരു ചിന്ത, ആ ചിന്ത സങ്കൽപ്പിക്കുന്ന വസ്തുവിനെ ഉണ്ടാക്കുന്നു.","The creed · Chapter 4":"വിശ്വാസപ്രമാണം · അദ്ധ്യായം 4","An oak tree drawn in gold lines":"സ്വർണ്ണവരകളിൽ വരച്ച ഒരു ഓക്ക് മരം","← Cover":"← പുറംചട്ട","Contents":"ഉള്ളടക്കം","Seventeen short chapters in five parts, each an animated, narrated lesson with quick checks. Open any chapter for its core idea and one line in Wattles' own words.":"അഞ്ച് ഭാഗങ്ങളിലായി പതിനേഴ് ചെറിയ അദ്ധ്യായങ്ങൾ. ഓരോന്നും പെട്ടെന്നുള്ള പരിശോധനകളുള്ള, ശബ്ദവിവരണത്തോടെയുള്ള ഒരു ആനിമേറ്റഡ് പാഠം. ഏത് അദ്ധ്യായം തുറന്നാലും അതിന്റെ കാതലായ ആശയവും വാട്ടിൽസിന്റെ സ്വന്തം വാക്കുകളിൽ ഒരു വരിയും കാണാം.","CONTINUE READING · PART 5 · CHAPTER 17":"വായന തുടരാം · PART 5 · CHAPTER 17","Summary of the science":"ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","The whole method on one page: thinking substance, a clear picture, faith, gratitude, and efficient action that gives more than it takes.":"മുഴുവൻ രീതിയും ഒറ്റ പേജിൽ: ചിന്തിക്കുന്ന സത്ത, വ്യക്തമായ ചിത്രം, വിശ്വാസം, നന്ദി, പിന്നെ എടുക്കുന്നതിലും കൂടുതൽ കൊടുക്കുന്ന കാര്യക്ഷമമായ പ്രവൃത്തി.","Completed. Replay any time.":"പൂർത്തിയാക്കി. എപ്പോൾ വേണമെങ്കിലും വീണ്ടും കാണാം.","Play lesson":"പാഠം കാണുക","Part 1":"ഭാഗം 1","The right and the science":"അവകാശവും ശാസ്ത്രവും","The right to be rich":"സമ്പന്നനാകാനുള്ള അവകാശം","Completed":"പൂർത്തിയായി","Wattles opens with permission. Body, mind and soul all grow by using things, and things cost money, so wanting more is simply life wanting to develop. Poverty is not holier.":"വാട്ടിൽസ് തുടങ്ങുന്നത് ഒരു അനുവാദത്തോടെയാണ്. ശരീരവും മനസ്സും ആത്മാവും വളരുന്നത് വസ്തുക്കൾ ഉപയോഗിച്ചാണ്, വസ്തുക്കൾക്ക് പണം വേണം. അതുകൊണ്ട് കൂടുതൽ ആഗ്രഹിക്കുന്നത് ജീവൻ വികസിക്കാൻ ആഗ്രഹിക്കുന്നതു മാത്രമാണ്. ദാരിദ്ര്യം കൂടുതൽ വിശുദ്ധമല്ല.","The object of all life is development.":"എല്ലാ ജീവന്റെയും ആത്യന്തിക ലക്ഷ്യം വികാസമാണ്.","Replay lesson":"പാഠം വീണ്ടും കാണുക","There is a science of getting rich":"സമ്പന്നനാകാൻ കൃത്യമായൊരു ശാസ്ത്രമുണ്ട്","Two people work the same trade on the same street and one prospers. Talent, thrift and location do not explain it. A Certain Way of doing things does, and anyone who can read can learn it.":"ഒരേ തെരുവിൽ ഒരേ ജോലി ചെയ്യുന്ന രണ്ടുപേർ. ഒരാൾ മാത്രം രക്ഷപ്പെടുന്നു. കഴിവോ മിതവ്യയമോ സ്ഥലമോ അതിന് കാരണമല്ല. കാര്യങ്ങൾ ചെയ്യുന്ന ഒരു നിശ്ചിത മാർഗമാണ് കാരണം. വായിക്കാൻ അറിയുന്ന ആർക്കും അത് പഠിക്കാം.","Like causes always produce like effects.":"ഒരേ കാരണങ്ങൾ എപ്പോഴും ഒരേ ഫലങ്ങൾ തന്നെ ഉണ്ടാക്കുന്നു.","Is opportunity monopolized?":"അവസരങ്ങൾ ആരുടെയെങ്കിലും കുത്തകയാണോ?","Nobody is kept poor because someone fenced off the supply. Opportunity moves like a tide toward new fields. The supply of raw material, and of ideas, has no ceiling.":"ആരോ ലഭ്യത വേലികെട്ടി അടച്ചതുകൊണ്ടല്ല ആരും ദരിദ്രരായി തുടരുന്നത്. അവസരം ഒരു വേലിയേറ്റം പോലെ പുതിയ മേഖലകളിലേക്ക് നീങ്ങുന്നു. അസംസ്കൃത വസ്തുക്കളുടെയും ആശയങ്ങളുടെയും ലഭ്യതയ്ക്ക് ഒരു പരിധിയുമില്ല.","There is abundance of opportunity for the man who will go with the tide.":"ഒഴുക്കിനൊപ്പം നീങ്ങാൻ തയ്യാറുള്ളവർക്ക് അവസരങ്ങൾ അനന്തമാണ്.","Part 2":"ഭാഗം 2","Thinking substance":"ചിന്തിക്കുന്ന പ്രപഞ്ചസത്ത","The first principle":"ഒന്നാമത്തെ അടിസ്ഥാനതത്വം","The creed: one thinking substance fills the universe, a thought held in it produces the form, and a person can impress a thought upon it. Wattles asks you to accept this and test it by acting on it.":"വിശ്വാസപ്രമാണം: ഒരു ചിന്തിക്കുന്ന സത്ത പ്രപഞ്ചം മുഴുവൻ നിറഞ്ഞിരിക്കുന്നു, അതിൽ പിടിക്കുന്ന ഒരു ചിന്ത രൂപം ഉണ്ടാക്കുന്നു, ഒരു മനുഷ്യന് അതിൽ ഒരു ചിന്ത പതിപ്പിക്കാൻ കഴിയും. ഇത് അംഗീകരിക്കാനും, അതനുസരിച്ച് പ്രവർത്തിച്ച് പരീക്ഷിക്കാനും വാട്ടിൽസ് ആവശ്യപ്പെടുന്നു.","Thought is the only power which can produce tangible riches from the Formless Substance.":"രൂപരഹിതമായ സത്തയിൽ നിന്ന് സമ്പത്ത് സൃഷ്ടിക്കാൻ കഴിയുന്ന ഒരേയൊരു ശക്തി ചിന്തയാണ്.","Increasing life":"ജീവിതത്തിന്റെ വികാസം","Life always seeks to become more, and the source of all things wants more life for everyone. So you never need to take from someone else. Rise out of competition into creation.":"ജീവൻ എപ്പോഴും കൂടുതൽ ആകാൻ ശ്രമിക്കുന്നു, എല്ലാറ്റിന്റെയും ഉറവിടം എല്ലാവർക്കും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. അതുകൊണ്ട് മറ്റൊരാളിൽ നിന്ന് ഒന്നും എടുക്കേണ്ടതില്ല. മത്സരത്തിൽ നിന്ന് സൃഷ്ടിയിലേക്ക് ഉയരുക.","You are to become a creator, not a competitor.":"നിങ്ങൾ ഒരു സ്രഷ്ടാവാകണം, വെറുമൊരു മത്സരാർത്ഥിയാകരുത്.","How riches come to you":"സമ്പത്ത് നിങ്ങളിലേക്ക് എത്തുന്ന വഴി","Give every person more in use value than you take in cash value. What you want arrives through people and trade, in deals that serve them too. And ask largely.":"ഓരോരുത്തരിൽ നിന്നും പണമൂല്യമായി എടുക്കുന്നതിനെക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം അവർക്ക് കൊടുക്കുക. നിങ്ങൾ ആഗ്രഹിക്കുന്നത് ആളുകളിലൂടെയും കച്ചവടത്തിലൂടെയും, അവർക്കും ഗുണമുള്ള ഇടപാടുകളിലൂടെ വന്നുചേരുന്നു. വലുതായി ചോദിക്കുക.","Give every man more in use value than you take from him in cash value.":"വാങ്ങുന്ന പണത്തേക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം ആളുകൾക്ക് തിരിച്ചുനൽകുക.","Gratitude":"കൃതജ്ഞത","Gratitude keeps your mind close to the source of supply and out of complaint and competition. It is also where faith comes from: a grateful mind expects good things.":"നന്ദി നിങ്ങളുടെ മനസ്സിനെ എല്ലാറ്റിന്റെയും ഉറവിടത്തോട് ചേർത്തുനിർത്തുന്നു, പരാതിയിൽ നിന്നും മത്സരത്തിൽ നിന്നും അകറ്റിനിർത്തുന്നു. വിശ്വാസം വരുന്നതും അവിടെ നിന്നാണ്: നന്ദിയുള്ള മനസ്സ് നല്ലത് പ്രതീക്ഷിക്കുന്നു.","Faith is born of gratitude.":"വിശ്വാസം ജനിക്കുന്നത് ആത്മാർത്ഥമായ കൃതജ്ഞതയിൽ നിന്നാണ്.","Part 3":"ഭാഗം 3","Thinking in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള ചിന്ത","A vague wish transmits nothing. Form a clear, detailed picture of what you want, hold it like a helmsman holds a heading, and live as if you already own it.":"അവ്യക്തമായ ഒരു ആഗ്രഹം ഒന്നും എത്തിക്കുന്നില്ല. നിങ്ങൾക്ക് വേണ്ടതിന്റെ വ്യക്തവും വിശദവുമായ ഒരു ചിത്രം ഉണ്ടാക്കുക. കപ്പിത്താൻ ദിശ വിടാതെ പിടിക്കുന്നതുപോലെ അത് മുറുകെ പിടിക്കുക. അത് ഇപ്പോഴേ സ്വന്തമായി എന്ന മട്ടിൽ ജീവിക്കുക.","You must know what you want, and be definite.":"നിങ്ങൾക്ക് എന്താണ് വേണ്ടതെന്ന് വ്യക്തമായി അറിയണം; അതിൽ പൂർണ്ണമായ വ്യക്തത വേണം.","How to use the will":"ഇച്ഛാശക്തി എങ്ങനെ ഉപയോഗിക്കാം","Never aim your will at other people or at the universe. Aim it at yourself, to keep your attention on the picture and off pictures of lack.":"നിങ്ങളുടെ ഇച്ഛ ഒരിക്കലും മറ്റുള്ളവരുടെ നേരെയോ പ്രപഞ്ചത്തിന്റെ നേരെയോ തിരിക്കരുത്. നിങ്ങളിലേക്കു തന്നെ തിരിക്കുക. ശ്രദ്ധ ആ ചിത്രത്തിൽ നിർത്താനും ഇല്ലായ്മയുടെ ചിത്രങ്ങളിൽ നിന്ന് മാറ്റാനും.","To get rich, you need only to use your will power upon yourself.":"സമ്പന്നനാകാൻ നിങ്ങളുടെ ഇച്ഛാശക്തി സ്വന്തം മനസ്സിൽ പ്രയോഗിച്ചാൽ മാത്രം മതി.","Further use of the will":"ഇച്ഛാശക്തിയുടെ കൂടുതൽ പ്രയോഗങ്ങൾ","Stop retelling past money troubles. Pick one system and stay with it. The best help you can give anyone is a working example.":"പഴയ പണപ്രശ്നങ്ങൾ വീണ്ടും വീണ്ടും പറയുന്നത് നിർത്തുക. ഒരു രീതി തിരഞ്ഞെടുത്ത് അതിൽ ഉറച്ചുനിൽക്കുക. ആർക്കും നിങ്ങൾ കൊടുക്കാവുന്ന ഏറ്റവും നല്ല സഹായം, ഫലം കണ്ട ഒരു മാതൃകയാകുക എന്നതാണ്.","An ounce of doing things is worth a pound of theorizing.":"ഒരു റാത്തൽ സിദ്ധാന്തത്തേക്കാൾ വിലയുണ്ട് ഒരു ഔൺസ് പ്രവൃത്തിക്ക്.","Part 4":"ഭാഗം 4","Acting in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള പ്രവൃത്തി","Thought sets things moving toward you; action is how you receive them. Act now, in your present work and place, not in some imagined future one.":"ചിന്ത കാര്യങ്ങളെ നിങ്ങളുടെ നേർക്ക് ചലിപ്പിക്കുന്നു; പ്രവൃത്തിയിലൂടെയാണ് നിങ്ങൾ അവയെ സ്വീകരിക്കുന്നത്. ഇപ്പോൾ പ്രവർത്തിക്കുക, ഇപ്പോഴത്തെ ജോലിയിലും സ്ഥലത്തും. സങ്കൽപ്പത്തിലെ ഏതോ ഭാവിജോലിയിലല്ല.","By thought, the thing you want is brought to you; by action you receive it.":"ചിന്തയിലൂടെ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് നിങ്ങളിലേക്ക് വരുന്നു; പ്രവൃത്തിയിലൂടെ നിങ്ങൾ അത് സ്വീകരിക്കുന്നു.","Efficient action":"കാര്യക്ഷമമായ പ്രവൃത്തി","Do every day all that can be done that day, and do each act well. Volume is not the measure. A day of inefficient acts is a failed day.":"ഓരോ ദിവസവും അന്ന് ചെയ്യാവുന്നതെല്ലാം ചെയ്യുക, ഓരോ കാര്യവും നന്നായി ചെയ്യുക. എത്ര ചെയ്തു എന്നതല്ല അളവ്. കാര്യക്ഷമമല്ലാത്ത പ്രവൃത്തികൾ നിറഞ്ഞ ദിവസം ഒരു പരാജയപ്പെട്ട ദിവസമാണ്.","Every act is, in itself, either a success or a failure.":"ഓരോ പ്രവൃത്തിയും അതിൽത്തന്നെ ഒന്നുകിൽ ഒരു വിജയമാണ്, അല്ലെങ്കിൽ ഒരു പരാജയമാണ്.","Getting into the right business":"ശരിയായ മേഖല തിരഞ്ഞെടുക്കൽ","Use your strongest faculties, or follow the work you most want to do. Change by growth, not by panic. When in doubt, wait and give thanks.":"നിങ്ങളുടെ ഏറ്റവും ശക്തമായ കഴിവുകൾ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ഏറ്റവും ചെയ്യാൻ ഇഷ്ടമുള്ള ജോലി തിരഞ്ഞെടുക്കുക. മാറ്റം വളർച്ചയിലൂടെയാകട്ടെ, പേടിച്ചോടിയല്ല. സംശയമുള്ളപ്പോൾ കാത്തിരിക്കുക, നന്ദി പറയുക.","Go as fast as you can, but never hurry.":"സാധ്യമായത്ര വേഗത്തിൽ മുന്നേറുക, എന്നാൽ ഒരിക്കലും അനാവശ്യമായി ധൃതികൂട്ടരുത്.","The impression of increase":"പുരോഗതിയുടെ അനുഭവം പകരുക","Everyone you deal with wants more life. Leave each of them with the sense that dealing with you advances them. Never seek power over others.":"നിങ്ങൾ ഇടപെടുന്ന എല്ലാവരും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. നിങ്ങളുമായുള്ള ഇടപാട് തങ്ങളെ മുന്നോട്ട് കൊണ്ടുപോകുന്നു എന്ന തോന്നൽ ഓരോരുത്തർക്കും നൽകുക. മറ്റുള്ളവരുടെ മേൽ ഒരിക്കലും അധികാരം തേടരുത്.","What I want for myself, I want for everybody.":"എനിക്കായി ഞാൻ ആഗ്രഹിക്കുന്നത് എന്തോ, അത് മറ്റെല്ലാവർക്കുമായി ഞാൻ ആഗ്രഹിക്കുന്നു.","The advancing man":"മുന്നേറുന്ന വ്യക്തി","Doctor, teacher, preacher or wage earner, the law is the same. Be too big for your present place and carry a clear picture of the person you are becoming.":"ഡോക്ടറോ അധ്യാപകനോ പ്രസംഗകനോ ശമ്പളക്കാരനോ ആകട്ടെ, നിയമം ഒന്നുതന്നെ. ഇപ്പോഴത്തെ സ്ഥാനത്തെക്കാൾ വലുതാകുക, നിങ്ങൾ ആയിത്തീരുന്ന വ്യക്തിയുടെ വ്യക്തമായ ചിത്രം കൂടെ കൊണ്ടുനടക്കുക.","There is a Power which never fails to present opportunity to the Advancing Man.":"മുന്നേറാൻ ദൃഢനിശ്ചയമുള്ള വ്യക്തിക്ക് അവസരങ്ങൾ ഒരുക്കുന്നതിൽ പ്രപഞ്ചം ഒരിക്കലും പരാജയപ്പെടാറില്ല.","Part 5":"ഭാഗം 5","Cautions and summary":"മുന്നറിയിപ്പുകളും സംഗ്രഹവും","Some cautions":"പ്രധാനപ്പെട്ട ചില മുന്നറിയിപ്പുകൾ","Guard your speech. Do not plan around imagined disasters. A seeming failure usually clears the way for something larger than you asked for.":"നിങ്ങളുടെ സംസാരം ശ്രദ്ധിക്കുക. സങ്കൽപ്പത്തിലെ ദുരന്തങ്ങളെ മുന്നിൽ കണ്ട് പദ്ധതിയിടരുത്. പരാജയം എന്ന് തോന്നുന്നത് പലപ്പോഴും നിങ്ങൾ ചോദിച്ചതിനെക്കാൾ വലിയ ഒന്നിന് വഴിയൊരുക്കുകയാണ്.","Never allow yourself to feel disappointed.":"നിരാശയ്ക്ക് ഒരിക്കലും നിങ്ങളുടെ മനസ്സിൽ ഇടം നൽകരുത്.","The riches they receive will be in exact proportion to the definiteness of their vision.":"മനുഷ്യർക്ക് ലഭിക്കുന്ന സമ്പത്ത് അവരുടെ സങ്കൽപ്പത്തിന്റെ വ്യക്തതയ്ക്കും, ലക്ഷ്യത്തിന്റെ ദൃഢതയ്ക്കും, വിശ്വാസത്തിന്റെ ആഴത്തിനും തുല്യമായിരിക്കും.","Text: Wallace D. Wattles, 1910, public domain. Lessons and drawings: The Young Maker Universe.":"മൂലകൃതി: വാലസ് ഡി. വാട്ടിൽസ്, 1910, പകർപ്പവകാശമുക്തം. പാഠങ്ങളും ചിത്രങ്ങളും: The Young Maker Universe.","Read the method, test it in your own life, keep what works.":"രീതി വായിക്കുക, സ്വന്തം ജീവിതത്തിൽ പരീക്ഷിക്കുക, ഫലിക്കുന്നത് നിലനിർത്തുക.","Play chapter 17, Summary of the science":"അദ്ധ്യായം 17 കാണുക, ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Part 5 · Chapter 17":"ഭാഗം 5 · അദ്ധ്യായം 17","Finished":"പൂർത്തിയായി","About 7 minutes · narrated · 3 question sets":"ഏകദേശം 7 മിനിറ്റ് · ശബ്ദവിവരണം · 3 ചോദ്യഭാഗങ്ങൾ","Play without voice":"ശബ്ദമില്ലാതെ കാണുക","Chapter 17 · results":"അദ്ധ്യായം 17 · ഫലം","1 of 5":"5-ൽ 1","First-try answers. Replay any step to review it.":"ആദ്യ ശ്രമത്തിലെ ഉത്തരങ്ങൾ. ഏത് ഘട്ടവും വീണ്ടും കണ്ട് ഓർമ്മ പുതുക്കാം.","Wattles: “The riches they receive will be in exact proportion to the definiteness of their vision.”":"വാട്ടിൽസ്: “അവർക്ക് കിട്ടുന്ന സമ്പത്ത് അവരുടെ വിഷൻ എത്ര കൃത്യമാണോ, കൃത്യമായി അതിന്റെ അനുപാതത്തിലായിരിക്കും.”","Back to contents":"ഉള്ളടക്കത്തിലേക്ക് മടങ്ങുക","Replay chapter":"അദ്ധ്യായം വീണ്ടും കാണുക","CC":"CC","Voice":"ശബ്ദം","Narrator voice":"വിവരണ ശബ്ദം","Narration off":"വിവരണം ഓഫ്","Space play or pause · ← → steps · C captions · M narration. Voices come from your device. Indian English voices are listed first; Edge on Windows has the most natural one (Prabhat).":"സ്പേസ്: പ്ലേ അല്ലെങ്കിൽ പോസ് · ← → ഘട്ടങ്ങൾ · C ക്യാപ്ഷൻ · M ശബ്ദവിവരണം. ശബ്ദങ്ങൾ നിങ്ങളുടെ ഉപകരണത്തിൽ നിന്നാണ്. മലയാളം ശബ്ദങ്ങൾ ആദ്യം കാണിക്കും. വിൻഡോസിലെ Edge-ലാണ് ഏറ്റവും സ്വാഭാവികമായ ശബ്ദം (Midhun).","Lesson animation":"പാഠത്തിന്റെ ആനിമേഷൻ","Play with narration":"ശബ്ദവിവരണത്തോടെ കാണുക","Previous step":"മുമ്പത്തെ ഘട്ടം","Play":"പ്ലേ","Next step":"അടുത്ത ഘട്ടം","Lesson steps":"പാഠത്തിലെ ഘട്ടങ്ങൾ","Step 1: Summary of the science":"ഘട്ടം 1: ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Step 2: A thought in the substance":"ഘട്ടം 2: സത്തയിലെ ഒരു ചിന്ത","A thought in the substance":"സത്തയിലെ ഒരു ചിന്ത","Step 3: Creative and grateful":"ഘട്ടം 3: സൃഷ്ടിയും നന്ദിയും","Creative and grateful":"സൃഷ്ടിയും നന്ദിയും","Step 4: The clear picture":"ഘട്ടം 4: വ്യക്തമായ ചിത്രം","The clear picture":"വ്യക്തമായ ചിത്രം","Step 5: Quick check":"ഘട്ടം 5: Quick check","Quick check":"Quick check","Step 6: Act in your present place":"ഘട്ടം 6: ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Act in your present place":"ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Step 7: More life for everyone":"ഘട്ടം 7: എല്ലാവർക്കും കൂടുതൽ ജീവൻ","More life for everyone":"എല്ലാവർക്കും കൂടുതൽ ജീവൻ","Step 8: Quick check":"ഘട്ടം 8: Quick check","Step 9: All nine steps together":"ഘട്ടം 9: ഒൻപത് ഘട്ടങ്ങളും ഒരുമിച്ച്","All nine steps together":"ഒൻപത് ഘട്ടങ്ങളും ഒരുമിച്ച്","Step 10: In exact proportion":"ഘട്ടം 10: കൃത്യമായ അനുപാതത്തിൽ","In exact proportion":"കൃത്യമായ അനുപാതത്തിൽ","Step 11: To sum up":"ഘട്ടം 11: ചുരുക്കത്തിൽ","To sum up":"ചുരുക്കത്തിൽ","Step 12: Chapter practice":"ഘട്ടം 12: Chapter practice","Chapter practice":"Chapter practice","Step 13: Finished":"ഘട്ടം 13: പൂർത്തിയായി","Captions (C)":"ക്യാപ്ഷൻ (C)","Speed":"വേഗത","Voice settings":"ശബ്ദ ക്രമീകരണങ്ങൾ","The Science of Getting Rich":"സമ്പന്നനാകാനുള്ള ശാസ്ത്രം","Wattles":"വാട്ടിൽസ്","quoted by Wattles":"വാട്ടിൽസ് ഉദ്ധരിച്ചത്","“Golden Rule” Jones of Toledo":"ടൊളീഡോയിലെ “ഗോൾഡൻ റൂൾ” ജോൺസ്","Every act is either a success or a failure.":"ഓരോ പ്രവൃത്തിയും ഒന്നുകിൽ വിജയം, അല്ലെങ്കിൽ പരാജയം.","your present place":"ഇപ്പോഴത്തെ സ്ഥാനം","work left undone":"ചെയ്യാതെ വിട്ട ജോലി","Do all you can, where you are.":"ഉള്ളിടത്ത്, കഴിയുന്നതെല്ലാം ചെയ്യുക.","smaller than the place":"സ്ഥാനത്തേക്കാൾ ചെറുത്","carried along by others":"മറ്റുള്ളവർ ചുമക്കുന്നു","larger than the place":"സ്ഥാനത്തേക്കാൾ വലുത്","more than filled: you advance":"നിറഞ്ഞു കവിഞ്ഞു: നിങ്ങൾ മുന്നേറുന്നു","the plane of the water":"ജലത്തിന്റെ തലം","a higher plane":"ഉയർന്ന തലം","new organs":"പുതിയ അവയവങ്ങൾ","a new species":"പുതിയ ജീവി ഇനം","evolution is caused by excess of life":"പരിണാമത്തിന് കാരണം നിറഞ്ഞു കവിയുന്ന ജീവൻ","MON":"തിങ്കൾ","TUE":"ചൊവ്വ","WED":"ബുധൻ","THU":"വ്യാഴം","FRI":"വെള്ളി","SAT":"ശനി","SUN":"ഞായർ","one thing left undone":"ചെയ്യാതെ വിട്ട ഒരു കാര്യം","a small act":"ഒരു ചെറിയ പ്രവൃത്തി","the door of opportunity":"അവസരത്തിന്റെ വാതിൽ","Do, every day, all that can be done that day.":"ഓരോ ദിവസവും, അന്ന് ചെയ്യാവുന്നതെല്ലാം ചെയ്യുക.","How does a person advance beyond the present place, in Wattles' view?":"വാട്ടിൽസിന്റെ കാഴ്ചപ്പാടിൽ, ഒരാൾ ഇപ്പോഴത്തെ സ്ഥാനത്തിനപ്പുറം എങ്ങനെ മുന്നേറുന്നു?","By moving to a bigger place first, then working fully":"വലിയൊരു സ്ഥാനത്തേക്ക് മാറിയ ശേഷം മാത്രം കഠിനാധ്വാനം ചെയ്ത്","By more than filling the present place, doing all that can be done each day":"നിലവിലെ സ്ഥാനത്തേക്കാൾ ഉയർന്നുനിന്ന് ഓരോ ദിവസത്തെയും ജോലികൾ പൂർണ്ണതയോടെ ചെയ്ത്","By also doing tomorrow's work today":"നാളത്തെ ജോലികൾ കൂടി ഇന്ന് തന്നെ ചെയ്യാൻ ഓടിനടന്ന്","That waits for the place. He says you advance by being larger than the place you already have.":"അല്ല. അത് സ്ഥാനത്തിനായി കാത്തിരിക്കലാണ്. ഇപ്പോഴുള്ള സ്ഥാനത്തേക്കാൾ വലുതാകുമ്പോഴാണ് മുന്നേറുന്നത് എന്ന് അദ്ദേഹം പറയുന്നു.","Right. Like the overflowing glass, the excess of life is what lifts you to a higher plane.":"ശരിയുത്തരം! നിലവിലെ പദവിയേക്കാൾ വളരുമ്പോഴാണ് സ്വാഭാവികമായും ഉയർന്ന പദവികളിലേക്ക് നാം എത്തുന്നത്.","Continue":"തുടരുക","He warns against that. Do all that can be done today, not a week's work in a day.":"അല്ല. അദ്ദേഹം അതിനെതിരെ മുന്നറിയിപ്പ് നൽകുന്നു. ഇന്ന് ചെയ്യാവുന്നതെല്ലാം ചെയ്യുക, ഒരാഴ്ചത്തെ ജോലി ഒരു ദിവസം കൊണ്ടല്ല.","Monday":"തിങ്കളാഴ്ച","12 repairs · 4 succeed":"12 റിപ്പയർ · 4 വിജയം","Tuesday":"ചൊവ്വാഴ്ച","6 repairs · 6 succeed":"6 റിപ്പയർ · 6 വിജയം","BIJU’S PHONE REPAIR SHOP · KOLLAM":"ബിജു ഫോൺ റിപ്പയർ · കൊല്ലം","Do not overwork. Do not rush.":"അമിതമായി ജോലി ചെയ്യരുത്. ഓടരുത്.","The efficiency of each separate act":"ഓരോ പ്രവൃത്തിയുടെയും കാര്യക്ഷമത","more weak acts, more failures":"ദുർബല പ്രവൃത്തി കൂടുമ്പോൾ, പരാജയം കൂടും","a bigger shop":"വലിയൊരു കട","the mind at one time":"മനസ്സ് ഒരു സമയത്ത്","the work at another":"ജോലി മറ്റൊരു സമയത്ത്","weak":"ദുർബലം","Put power into each act":"ഓരോ പ്രവൃത്തിയിലും ശക്തി നിറയ്ക്കുക","vision and act, at the same moment":"വിഷനും പ്രവൃത്തിയും, ഒരേ നിമിഷം","Leisure hours":"ഒഴിവു സമയം","fill in the details of the picture":"ചിത്രത്തിന്റെ വിശദാംശങ്ങൾ പൂരിപ്പിക്കുക","Working hours":"ജോലി സമയം","one glance at it is enough":"ഒരു നോട്ടം മതി","days":"ദിവസങ്ങൾ","each success opens the next":"ഓരോ വിജയവും അടുത്തത് തുറക്കുന്നു","   const ca = label(p, 'carried along by others', 860, 452, m('carried'), { size: 28, fill: C.dim, anchor: 'start' });

/* a week of days and one small act */
function daysScene(p, m) {
  const names = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'], ok = [1, 1, 0, 1, 1, 0, 1];
  names.forEach((n, i) => {
    const x = 300 + i * 166, g = G(p, { x, y: 170, o: 0 }); show(g, .1 + i * .06, .4);
    mk('rect', { x: -60, y: -60, width: 120, height: 120, rx: 6, fill: C.board, stroke: C.faint, 'stroke-width': 2.5 }, g);
    T(g, n, { x: 0, y: -26, size: 22, font: FM, fill: C.dim, anchor: 'middle', ls: 3 });
    const t = i === 2 ? m('leave', .2) : m('each', .2 + i * .12);
    const mark = Pth(g, ok[i] ? tickD : crossD, { stroke: ok[i] ? C.goldHi : C.loss, 'stroke-width': 4 }, { dw: 0, y: 24 }); draw(mark, t, .4, E.out);
    if (ok[i]) { const glow = G(g, { o: 0 }); mk('rect', { x: -60, y: -60, width: 120, height: 120, rx: 6, fill: 'none', stroke: C.gold, 'stroke-width': 3 }, glow); show(glow, m('success', i * .08), .5); }
  });
  const und = T(p, 'one thing left undone', { x: 632, y: 280, size: 24, fill: C.loss, anchor: 'middle', o: 0 }); show(und, m('leave', .5));
  // the small act
  const ground = Pth(p, 'M160 742 H1460', { stroke: C.faint, 'stroke-width': 2 }, { dw: 0 }); draw(ground, .2, .8);
  const you = figure(p, { x: 360, y: 740, col: C.gold, dress: 'shirt', hair: 'short', s: .9, armR: [76, -150], o: 0 }); show(you, .3);
  const hd = you.hand('R');
  const env = envelope(p, hd[0] + 10, hd[1] - 10); env._b.o = 0; pop(env, m('small', -.2));
  const sa = T(p, 'a small act', { x: hd[0] + 10, y: hd[1] - 54, size: 26, fill: C.dim, anchor: 'middle', o: 0 }); show(sa, m('small')); hide(sa, m('door'), .3);
  // the door

  const frame = Pth(p, `M${DX - 10} ${DB} V${DT - 10} H${DX + DW + 10} V${DB}`, { stroke: C.ink, 'stroke-width': 4 }, { dw: 0 }); draw(frame, .3, .8);
  const panel = mk('path', { fill: C.board, stroke: C.ink, 'stroke-width': 3, 'stroke-linejoin': 'round' }, p);
  const td = m('door', .9);
  prog(q => {
    const xr = DX + DW * (1 - .78 * q), sk = 26 * q;
    panel.setAttribute('d', `M${DX} ${DT} L${xr} ${DT - sk} L${xr} ${DB + sk * .6} L${DX} ${DB} Z`);
    light.setAttribute('opacity', (q * .3).toFixed(3));
  }, td, 1.1, E.io);
  tw(env, { x: DX + DW / 2, y: 600 }, m('door'), 1, E.io); tw(env, { o: 0, s: .6 }, m('door', .9), .3);
  const dl = T(p, 'the door of opportunity', { x: DX + DW / 2, y: 400, size: 28, fill: C.goldHi, anchor: 'middle', o: 0, font: FD, italic: true, weight: 600 }); rise(dl, m('door', 1.4));
  const all = heading(p, 'Do, every day, all that can be done that day.', 640, 360, m('all'), { size: 42 });

/* successful action is cumulative */
function growScene(p, m) {
  const axis = Pth(p, 'M140 762 H1480 M140 762 V230', { stroke: C.faint, 'stroke-width': 2 }, { dw: 0 }); draw(axis, .1, .8);
  T(p, 'days', { x: 1480, y: 800, size: 22, font: FM, fill: C.dim, anchor: 'end' });
  const N = 10, pts = [];
  for (let i = 0; i < N; i++) { const f = (Math.exp(2.3 * i / (N - 1)) - 1) / (Math.exp(2.3) - 1); pts.push([210 + i * 128, 730 - 470 * f]); }
  let t = m('one', -.2), gap = 1.0;
  pts.forEach(([x, y], i) => {
    if (i > 0) { const [px, py] = pts[i - 1]; const seg = Pth(p, `M${px} ${py} L${x} ${y}`, { stroke: C.gold, 'stroke-width': 3 }, { dw: 0 }); draw(seg, t - gap * .55, gap * .5, E.out); }
    const r = 10 + i * 2.4, n = G(p, { x, y }); mk('circle', { r, fill: C.board, stroke: C.goldHi, 'stroke-width': 3 }, n); pop(n, t, .4);
    t += gap; gap *= .76;
  });
  const lbl = T(p, 'each success opens the next', { x: 980, y: 716, size: 26, fill: C.dim, o: 0 }); show(lbl, m('one', .8));
  const fast = T(p, 'faster and faster', { x: 1060, y: 330, size: 34, font: FD, italic: true, weight: 600, fill: C.goldHi, anchor: 'end', o: 0 }); rise(fast, m('faster', .2));
  // things attach themselves to the leading success
  const [lx, ly] = pts[N - 1];
  const starts = [[1500, 300], [1520, 520], [1100, 180], [1460, 700], [960, 300], [1300, 120], [1530, 420], [1220, 640]];
  starts.forEach(([sx, sy], i) => {
    const d = G(p, { x: sx, y: sy, o: 0 }); mk('circle', { r: 7, fill: C.gold }, d);
    const a = (i / starts.length) * Math.PI * 2, tx = lx + Math.cos(a) * 46, ty = ly + Math.sin(a) * 46;
    show(d, m('attach', i * .15), .3); tw(d, { x: tx, y: ty }, m('attach', .2 + i * .15), .8, E.io);
  });
  const cum = T(p, 'Successful action is cumulative.', { x: 140, y: 150, size: 56, font: FD, weight: 600, o: 0 }); rise(cum, m('cum'));
  const st = T(p, 'all that can be done each day, each act done well', { x: 140, y: 214, size: 30, fill: C.goldHi, o: 0 }); rise(st, m('step', .4));
  return {};
}
