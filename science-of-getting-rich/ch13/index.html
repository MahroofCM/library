if (document.documentElement.lang === 'ml') window.SG_TR = {"\"Thinking the form of a slow-growing oak tree, it moves accordingly, and produces the tree.\"":"\"സാവധാനം വളരുന്ന ഒരു ഓക്ക് മരത്തിന്റെ രൂപം ചിന്തിച്ചുകൊണ്ട്, അത് അതിനനുസരിച്ച് ചലിക്കുകയും ആ മരം ഉണ്ടാക്കുകയും ചെയ്യുന്നു.\"","The Young Maker Universe · Interactive classics":"The Young Maker Universe · ഇന്ററാക്ടീവ് ക്ലാസിക്കുകൾ","The Science of":"സമ്പന്നനാകാനുള്ള","Getting Rich":"ശാസ്ത്രം","WALLACE D. WATTLES · 1910 · 17 CHAPTERS":"വാലസ് ഡി. വാട്ടിൽസ് · 1910 · 17 അദ്ധ്യായങ്ങൾ","A thought held clearly becomes a thing. Wattles' short manual, rebuilt as seventeen narrated lessons you can watch, hear and test yourself on.":"വ്യക്തമായി മനസ്സിൽ പിടിക്കുന്ന ഒരു ചിന്ത ഒരു വസ്തുവായി മാറുന്നു. വാട്ടിൽസിന്റെ ചെറിയ കൈപ്പുസ്തകം, കാണാനും കേൾക്കാനും സ്വയം പരീക്ഷിക്കാനും കഴിയുന്ന 17 ശബ്ദവിവരണ പാഠങ്ങളായി പുതുക്കിയെടുത്തിരിക്കുന്നു.","Open the book":"പുസ്തകം തുറക്കുക","Continue: chapter 17":"തുടരാം: അദ്ധ്യായം 17","There is a thinking stuff from which all things are made. A thought, in this substance, produces the thing that is imaged by the thought.":"എല്ലാ വസ്തുക്കളും ഉണ്ടായിരിക്കുന്നത് ഒരു ചിന്തിക്കുന്ന സത്തയിൽ നിന്നാണ്. ഈ സത്തയിലെ ഒരു ചിന്ത, ആ ചിന്ത സങ്കൽപ്പിക്കുന്ന വസ്തുവിനെ ഉണ്ടാക്കുന്നു.","The creed · Chapter 4":"വിശ്വാസപ്രമാണം · അദ്ധ്യായം 4","An oak tree drawn in gold lines":"സ്വർണ്ണവരകളിൽ വരച്ച ഒരു ഓക്ക് മരം","← Cover":"← പുറംചട്ട","Contents":"ഉള്ളടക്കം","Seventeen short chapters in five parts, each an animated, narrated lesson with quick checks. Open any chapter for its core idea and one line in Wattles' own words.":"അഞ്ച് ഭാഗങ്ങളിലായി പതിനേഴ് ചെറിയ അദ്ധ്യായങ്ങൾ. ഓരോന്നും പെട്ടെന്നുള്ള പരിശോധനകളുള്ള, ശബ്ദവിവരണത്തോടെയുള്ള ഒരു ആനിമേറ്റഡ് പാഠം. ഏത് അദ്ധ്യായം തുറന്നാലും അതിന്റെ കാതലായ ആശയവും വാട്ടിൽസിന്റെ സ്വന്തം വാക്കുകളിൽ ഒരു വരിയും കാണാം.","CONTINUE READING · PART 5 · CHAPTER 17":"വായന തുടരാം · PART 5 · CHAPTER 17","Summary of the science":"ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","The whole method on one page: thinking substance, a clear picture, faith, gratitude, and efficient action that gives more than it takes.":"മുഴുവൻ രീതിയും ഒറ്റ പേജിൽ: ചിന്തിക്കുന്ന സത്ത, വ്യക്തമായ ചിത്രം, വിശ്വാസം, നന്ദി, പിന്നെ എടുക്കുന്നതിലും കൂടുതൽ കൊടുക്കുന്ന കാര്യക്ഷമമായ പ്രവൃത്തി.","Completed. Replay any time.":"പൂർത്തിയാക്കി. എപ്പോൾ വേണമെങ്കിലും വീണ്ടും കാണാം.","Play lesson":"പാഠം കാണുക","Part 1":"ഭാഗം 1","The right and the science":"അവകാശവും ശാസ്ത്രവും","The right to be rich":"സമ്പന്നനാകാനുള്ള അവകാശം","Completed":"പൂർത്തിയായി","Wattles opens with permission. Body, mind and soul all grow by using things, and things cost money, so wanting more is simply life wanting to develop. Poverty is not holier.":"വാട്ടിൽസ് തുടങ്ങുന്നത് ഒരു അനുവാദത്തോടെയാണ്. ശരീരവും മനസ്സും ആത്മാവും വളരുന്നത് വസ്തുക്കൾ ഉപയോഗിച്ചാണ്, വസ്തുക്കൾക്ക് പണം വേണം. അതുകൊണ്ട് കൂടുതൽ ആഗ്രഹിക്കുന്നത് ജീവൻ വികസിക്കാൻ ആഗ്രഹിക്കുന്നതു മാത്രമാണ്. ദാരിദ്ര്യം കൂടുതൽ വിശുദ്ധമല്ല.","The object of all life is development.":"എല്ലാ ജീവന്റെയും ആത്യന്തിക ലക്ഷ്യം വികാസമാണ്.","Replay lesson":"പാഠം വീണ്ടും കാണുക","There is a science of getting rich":"സമ്പന്നനാകാൻ കൃത്യമായൊരു ശാസ്ത്രമുണ്ട്","Two people work the same trade on the same street and one prospers. Talent, thrift and location do not explain it. A Certain Way of doing things does, and anyone who can read can learn it.":"ഒരേ തെരുവിൽ ഒരേ ജോലി ചെയ്യുന്ന രണ്ടുപേർ. ഒരാൾ മാത്രം രക്ഷപ്പെടുന്നു. കഴിവോ മിതവ്യയമോ സ്ഥലമോ അതിന് കാരണമല്ല. കാര്യങ്ങൾ ചെയ്യുന്ന ഒരു നിശ്ചിത മാർഗമാണ് കാരണം. വായിക്കാൻ അറിയുന്ന ആർക്കും അത് പഠിക്കാം.","Like causes always produce like effects.":"ഒരേ കാരണങ്ങൾ എപ്പോഴും ഒരേ ഫലങ്ങൾ തന്നെ ഉണ്ടാക്കുന്നു.","Is opportunity monopolized?":"അവസരങ്ങൾ ആരുടെയെങ്കിലും കുത്തകയാണോ?","Nobody is kept poor because someone fenced off the supply. Opportunity moves like a tide toward new fields. The supply of raw material, and of ideas, has no ceiling.":"ആരോ ലഭ്യത വേലികെട്ടി അടച്ചതുകൊണ്ടല്ല ആരും ദരിദ്രരായി തുടരുന്നത്. അവസരം ഒരു വേലിയേറ്റം പോലെ പുതിയ മേഖലകളിലേക്ക് നീങ്ങുന്നു. അസംസ്കൃത വസ്തുക്കളുടെയും ആശയങ്ങളുടെയും ലഭ്യതയ്ക്ക് ഒരു പരിധിയുമില്ല.","There is abundance of opportunity for the man who will go with the tide.":"ഒഴുക്കിനൊപ്പം നീങ്ങാൻ തയ്യാറുള്ളവർക്ക് അവസരങ്ങൾ അനന്തമാണ്.","Part 2":"ഭാഗം 2","Thinking substance":"ചിന്തിക്കുന്ന പ്രപഞ്ചസത്ത","The first principle":"ഒന്നാമത്തെ അടിസ്ഥാനതത്വം","The creed: one thinking substance fills the universe, a thought held in it produces the form, and a person can impress a thought upon it. Wattles asks you to accept this and test it by acting on it.":"വിശ്വാസപ്രമാണം: ഒരു ചിന്തിക്കുന്ന സത്ത പ്രപഞ്ചം മുഴുവൻ നിറഞ്ഞിരിക്കുന്നു, അതിൽ പിടിക്കുന്ന ഒരു ചിന്ത രൂപം ഉണ്ടാക്കുന്നു, ഒരു മനുഷ്യന് അതിൽ ഒരു ചിന്ത പതിപ്പിക്കാൻ കഴിയും. ഇത് അംഗീകരിക്കാനും, അതനുസരിച്ച് പ്രവർത്തിച്ച് പരീക്ഷിക്കാനും വാട്ടിൽസ് ആവശ്യപ്പെടുന്നു.","Thought is the only power which can produce tangible riches from the Formless Substance.":"രൂപരഹിതമായ സത്തയിൽ നിന്ന് സമ്പത്ത് സൃഷ്ടിക്കാൻ കഴിയുന്ന ഒരേയൊരു ശക്തി ചിന്തയാണ്.","Increasing life":"ജീവിതത്തിന്റെ വികാസം","Life always seeks to become more, and the source of all things wants more life for everyone. So you never need to take from someone else. Rise out of competition into creation.":"ജീവൻ എപ്പോഴും കൂടുതൽ ആകാൻ ശ്രമിക്കുന്നു, എല്ലാറ്റിന്റെയും ഉറവിടം എല്ലാവർക്കും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. അതുകൊണ്ട് മറ്റൊരാളിൽ നിന്ന് ഒന്നും എടുക്കേണ്ടതില്ല. മത്സരത്തിൽ നിന്ന് സൃഷ്ടിയിലേക്ക് ഉയരുക.","You are to become a creator, not a competitor.":"നിങ്ങൾ ഒരു സ്രഷ്ടാവാകണം, വെറുമൊരു മത്സരാർത്ഥിയാകരുത്.","How riches come to you":"സമ്പത്ത് നിങ്ങളിലേക്ക് എത്തുന്ന വഴി","Give every person more in use value than you take in cash value. What you want arrives through people and trade, in deals that serve them too. And ask largely.":"ഓരോരുത്തരിൽ നിന്നും പണമൂല്യമായി എടുക്കുന്നതിനെക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം അവർക്ക് കൊടുക്കുക. നിങ്ങൾ ആഗ്രഹിക്കുന്നത് ആളുകളിലൂടെയും കച്ചവടത്തിലൂടെയും, അവർക്കും ഗുണമുള്ള ഇടപാടുകളിലൂടെ വന്നുചേരുന്നു. വലുതായി ചോദിക്കുക.","Give every man more in use value than you take from him in cash value.":"വാങ്ങുന്ന പണത്തേക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം ആളുകൾക്ക് തിരിച്ചുനൽകുക.","Gratitude":"കൃതജ്ഞത","Gratitude keeps your mind close to the source of supply and out of complaint and competition. It is also where faith comes from: a grateful mind expects good things.":"നന്ദി നിങ്ങളുടെ മനസ്സിനെ എല്ലാറ്റിന്റെയും ഉറവിടത്തോട് ചേർത്തുനിർത്തുന്നു, പരാതിയിൽ നിന്നും മത്സരത്തിൽ നിന്നും അകറ്റിനിർത്തുന്നു. വിശ്വാസം വരുന്നതും അവിടെ നിന്നാണ്: നന്ദിയുള്ള മനസ്സ് നല്ലത് പ്രതീക്ഷിക്കുന്നു.","Faith is born of gratitude.":"വിശ്വാസം ജനിക്കുന്നത് ആത്മാർത്ഥമായ കൃതജ്ഞതയിൽ നിന്നാണ്.","Part 3":"ഭാഗം 3","Thinking in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള ചിന്ത","A vague wish transmits nothing. Form a clear, detailed picture of what you want, hold it like a helmsman holds a heading, and live as if you already own it.":"അവ്യക്തമായ ഒരു ആഗ്രഹം ഒന്നും എത്തിക്കുന്നില്ല. നിങ്ങൾക്ക് വേണ്ടതിന്റെ വ്യക്തവും വിശദവുമായ ഒരു ചിത്രം ഉണ്ടാക്കുക. കപ്പിത്താൻ ദിശ വിടാതെ പിടിക്കുന്നതുപോലെ അത് മുറുകെ പിടിക്കുക. അത് ഇപ്പോഴേ സ്വന്തമായി എന്ന മട്ടിൽ ജീവിക്കുക.","You must know what you want, and be definite.":"നിങ്ങൾക്ക് എന്താണ് വേണ്ടതെന്ന് വ്യക്തമായി അറിയണം; അതിൽ പൂർണ്ണമായ വ്യക്തത വേണം.","How to use the will":"ഇച്ഛാശക്തി എങ്ങനെ ഉപയോഗിക്കാം","Never aim your will at other people or at the universe. Aim it at yourself, to keep your attention on the picture and off pictures of lack.":"നിങ്ങളുടെ ഇച്ഛ ഒരിക്കലും മറ്റുള്ളവരുടെ നേരെയോ പ്രപഞ്ചത്തിന്റെ നേരെയോ തിരിക്കരുത്. നിങ്ങളിലേക്കു തന്നെ തിരിക്കുക. ശ്രദ്ധ ആ ചിത്രത്തിൽ നിർത്താനും ഇല്ലായ്മയുടെ ചിത്രങ്ങളിൽ നിന്ന് മാറ്റാനും.","To get rich, you need only to use your will power upon yourself.":"സമ്പന്നനാകാൻ നിങ്ങളുടെ ഇച്ഛാശക്തി സ്വന്തം മനസ്സിൽ പ്രയോഗിച്ചാൽ മാത്രം മതി.","Further use of the will":"ഇച്ഛാശക്തിയുടെ കൂടുതൽ പ്രയോഗങ്ങൾ","Stop retelling past money troubles. Pick one system and stay with it. The best help you can give anyone is a working example.":"പഴയ പണപ്രശ്നങ്ങൾ വീണ്ടും വീണ്ടും പറയുന്നത് നിർത്തുക. ഒരു രീതി തിരഞ്ഞെടുത്ത് അതിൽ ഉറച്ചുനിൽക്കുക. ആർക്കും നിങ്ങൾ കൊടുക്കാവുന്ന ഏറ്റവും നല്ല സഹായം, ഫലം കണ്ട ഒരു മാതൃകയാകുക എന്നതാണ്.","An ounce of doing things is worth a pound of theorizing.":"ഒരു റാത്തൽ സിദ്ധാന്തത്തേക്കാൾ വിലയുണ്ട് ഒരു ഔൺസ് പ്രവൃത്തിക്ക്.","Part 4":"ഭാഗം 4","Acting in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള പ്രവൃത്തി","Thought sets things moving toward you; action is how you receive them. Act now, in your present work and place, not in some imagined future one.":"ചിന്ത കാര്യങ്ങളെ നിങ്ങളുടെ നേർക്ക് ചലിപ്പിക്കുന്നു; പ്രവൃത്തിയിലൂടെയാണ് നിങ്ങൾ അവയെ സ്വീകരിക്കുന്നത്. ഇപ്പോൾ പ്രവർത്തിക്കുക, ഇപ്പോഴത്തെ ജോലിയിലും സ്ഥലത്തും. സങ്കൽപ്പത്തിലെ ഏതോ ഭാവിജോലിയിലല്ല.","By thought, the thing you want is brought to you; by action you receive it.":"ചിന്തയിലൂടെ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് നിങ്ങളിലേക്ക് വരുന്നു; പ്രവൃത്തിയിലൂടെ നിങ്ങൾ അത് സ്വീകരിക്കുന്നു.","Efficient action":"കാര്യക്ഷമമായ പ്രവർത്തനം","Do every day all that can be done that day, and do each act well. Volume is not the measure. A day of inefficient acts is a failed day.":"ഓരോ ദിവസവും അന്ന് ചെയ്യാവുന്നതെല്ലാം ചെയ്യുക, ഓരോ കാര്യവും നന്നായി ചെയ്യുക. എത്ര ചെയ്തു എന്നതല്ല അളവ്. കാര്യക്ഷമമല്ലാത്ത പ്രവൃത്തികൾ നിറഞ്ഞ ദിവസം ഒരു പരാജയപ്പെട്ട ദിവസമാണ്.","Every act is, in itself, either a success or a failure.":"ഓരോ പ്രവൃത്തിയും അതിൽത്തന്നെ ഒന്നുകിൽ ഒരു വിജയമാണ്, അല്ലെങ്കിൽ ഒരു പരാജയമാണ്.","Getting into the right business":"ശരിയായ ബിസിനസിലേക്ക്","Use your strongest faculties, or follow the work you most want to do. Change by growth, not by panic. When in doubt, wait and give thanks.":"നിങ്ങളുടെ ഏറ്റവും ശക്തമായ കഴിവുകൾ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ഏറ്റവും ചെയ്യാൻ ഇഷ്ടമുള്ള ജോലി തിരഞ്ഞെടുക്കുക. മാറ്റം വളർച്ചയിലൂടെയാകട്ടെ, പേടിച്ചോടിയല്ല. സംശയമുള്ളപ്പോൾ കാത്തിരിക്കുക, നന്ദി പറയുക.","Go as fast as you can, but never hurry.":"കഴിയുന്നത്ര വേഗത്തിൽ പോവുക, പക്ഷേ തിടുക്കം കൂട്ടരുത്.","The impression of increase":"പുരോഗതിയുടെ അനുഭവം പകരുക","Everyone you deal with wants more life. Leave each of them with the sense that dealing with you advances them. Never seek power over others.":"നിങ്ങൾ ഇടപെടുന്ന എല്ലാവരും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. നിങ്ങളുമായുള്ള ഇടപാട് തങ്ങളെ മുന്നോട്ട് കൊണ്ടുപോകുന്നു എന്ന തോന്നൽ ഓരോരുത്തർക്കും നൽകുക. മറ്റുള്ളവരുടെ മേൽ ഒരിക്കലും അധികാരം തേടരുത്.","What I want for myself, I want for everybody.":"എനിക്കായി ഞാൻ ആഗ്രഹിക്കുന്നത് എന്തോ, അത് മറ്റെല്ലാവർക്കുമായി ഞാൻ ആഗ്രഹിക്കുന്നു.","The advancing man":"മുന്നേറുന്ന വ്യക്തി","Doctor, teacher, preacher or wage earner, the law is the same. Be too big for your present place and carry a clear picture of the person you are becoming.":"ഡോക്ടറോ അധ്യാപകനോ പ്രസംഗകനോ ശമ്പളക്കാരനോ ആകട്ടെ, നിയമം ഒന്നുതന്നെ. ഇപ്പോഴത്തെ സ്ഥാനത്തെക്കാൾ വലുതാകുക, നിങ്ങൾ ആയിത്തീരുന്ന വ്യക്തിയുടെ വ്യക്തമായ ചിത്രം കൂടെ കൊണ്ടുനടക്കുക.","There is a Power which never fails to present opportunity to the Advancing Man.":"മുന്നേറാൻ ദൃഢനിശ്ചയമുള്ള വ്യക്തിക്ക് അവസരങ്ങൾ ഒരുക്കുന്നതിൽ പ്രപഞ്ചം ഒരിക്കലും പരാജയപ്പെടാറില്ല.","Part 5":"ഭാഗം 5","Cautions and summary":"മുന്നറിയിപ്പുകളും സംഗ്രഹവും","Some cautions":"പ്രധാനപ്പെട്ട ചില മുന്നറിയിപ്പുകൾ","Guard your speech. Do not plan around imagined disasters. A seeming failure usually clears the way for something larger than you asked for.":"നിങ്ങളുടെ സംസാരം ശ്രദ്ധിക്കുക. സങ്കൽപ്പത്തിലെ ദുരന്തങ്ങളെ മുന്നിൽ കണ്ട് പദ്ധതിയിടരുത്. പരാജയം എന്ന് തോന്നുന്നത് പലപ്പോഴും നിങ്ങൾ ചോദിച്ചതിനെക്കാൾ വലിയ ഒന്നിന് വഴിയൊരുക്കുകയാണ്.","Never allow yourself to feel disappointed.":"നിരാശയ്ക്ക് ഒരിക്കലും നിങ്ങളുടെ മനസ്സിൽ ഇടം നൽകരുത്.","The riches they receive will be in exact proportion to the definiteness of their vision.":"മനുഷ്യർക്ക് ലഭിക്കുന്ന സമ്പത്ത് അവരുടെ സങ്കൽപ്പത്തിന്റെ വ്യക്തതയ്ക്കും, ലക്ഷ്യത്തിന്റെ ദൃഢതയ്ക്കും, വിശ്വാസത്തിന്റെ ആഴത്തിനും തുല്യമായിരിക്കും.","Text: Wallace D. Wattles, 1910, public domain. Lessons and drawings: The Young Maker Universe.":"മൂലകൃതി: വാലസ് ഡി. വാട്ടിൽസ്, 1910, പകർപ്പവകാശമുക്തം. പാഠങ്ങളും ചിത്രങ്ങളും: The Young Maker Universe.","Read the method, test it in your own life, keep what works.":"രീതി വായിക്കുക, സ്വന്തം ജീവിതത്തിൽ പരീക്ഷിക്കുക, ഫലിക്കുന്നത് നിലനിർത്തുക.","Play chapter 17, Summary of the science":"അദ്ധ്യായം 17 കാണുക, ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Part 5 · Chapter 17":"ഭാഗം 5 · അദ്ധ്യായം 17","Finished":"പൂർത്തിയായി","About 7 minutes · narrated · 3 question sets":"ഏകദേശം 7 മിനിറ്റ് · ശബ്ദവിവരണം · 3 ചോദ്യഭാഗങ്ങൾ","Play without voice":"ശബ്ദമില്ലാതെ കാണുക","Chapter 17 · results":"അദ്ധ്യായം 17 · ഫലം","1 of 5":"5-ൽ 1","First-try answers. Replay any step to review it.":"ആദ്യ ശ്രമത്തിലെ ഉത്തരങ്ങൾ. ഏത് ഘട്ടവും വീണ്ടും കണ്ട് ഓർമ്മ പുതുക്കാം.","Wattles: “The riches they receive will be in exact proportion to the definiteness of their vision.”":"വാട്ടിൽസ്: “അവർക്ക് കിട്ടുന്ന സമ്പത്ത് അവരുടെ വിഷൻ എത്ര കൃത്യമാണോ, കൃത്യമായി അതിന്റെ അനുപാതത്തിലായിരിക്കും.”","Back to contents":"ഉള്ളടക്കത്തിലേക്ക് മടങ്ങുക","Replay chapter":"അദ്ധ്യായം വീണ്ടും കാണുക","CC":"CC","Voice":"ശബ്ദം","Narrator voice":"വിവരണ ശബ്ദം","Narration off":"വിവരണം ഓഫ്","Space play or pause · ← → steps · C captions · M narration. Voices come from your device. Indian English voices are listed first; Edge on Windows has the most natural one (Prabhat).":"സ്പേസ്: പ്ലേ അല്ലെങ്കിൽ പോസ് · ← → ഘട്ടങ്ങൾ · C ക്യാപ്ഷൻ · M ശബ്ദവിവരണം. ശബ്ദങ്ങൾ നിങ്ങളുടെ ഉപകരണത്തിൽ നിന്നാണ്. മലയാളം ശബ്ദങ്ങൾ ആദ്യം കാണിക്കും. വിൻഡോസിലെ Edge-ലാണ് ഏറ്റവും സ്വാഭാവികമായ ശബ്ദം (Midhun).","Lesson animation":"പാഠത്തിന്റെ ആനിമേഷൻ","Play with narration":"ശബ്ദവിവരണത്തോടെ കാണുക","Previous step":"മുമ്പത്തെ ഘട്ടം","Play":"പ്ലേ","Next step":"അടുത്ത ഘട്ടം","Lesson steps":"പാഠത്തിലെ ഘട്ടങ്ങൾ","Step 1: Summary of the science":"ഘട്ടം 1: ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Step 2: A thought in the substance":"ഘട്ടം 2: സത്തയിലെ ഒരു ചിന്ത","A thought in the substance":"സത്തയിലെ ഒരു ചിന്ത","Step 3: Creative and grateful":"ഘട്ടം 3: സൃഷ്ടിയും നന്ദിയും","Creative and grateful":"സൃഷ്ടിയും നന്ദിയും","Step 4: The clear picture":"ഘട്ടം 4: വ്യക്തമായ ചിത്രം","The clear picture":"വ്യക്തമായ ചിത്രം","Step 5: Quick check":"ഘട്ടം 5: Quick check","Quick check":"Quick check","Step 6: Act in your present place":"ഘട്ടം 6: ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Act in your present place":"ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Step 7: More life for everyone":"ഘട്ടം 7: എല്ലാവർക്കും കൂടുതൽ ജീവൻ","More life for everyone":"എല്ലാവർക്കും കൂടുതൽ ജീവൻ","Step 8: Quick check":"ഘട്ടം 8: Quick check","Step 9: All nine steps together":"ഘട്ടം 9: ഒൻപത് ഘട്ടങ്ങളും ഒരുമിച്ച്","All nine steps together":"ഒൻപത് ഘട്ടങ്ങളും ഒരുമിച്ച്","Step 10: In exact proportion":"ഘട്ടം 10: കൃത്യമായ അനുപാതത്തിൽ","In exact proportion":"കൃത്യമായ അനുപാതത്തിൽ","Step 11: To sum up":"ഘട്ടം 11: ചുരുക്കത്തിൽ","To sum up":"ചുരുക്കത്തിൽ","Step 12: Chapter practice":"ഘട്ടം 12: Chapter practice","Chapter practice":"Chapter practice","Step 13: Finished":"ഘട്ടം 13: പൂർത്തിയായി","Captions (C)":"ക്യാപ്ഷൻ (C)","Speed":"വേഗത","Voice settings":"ശബ്ദ ക്രമീകരണങ്ങൾ","The Science of Getting Rich":"സമ്പന്നനാകാനുള്ള ശാസ്ത്രം","Wattles":"വാട്ടിൽസ്","quoted by Wattles":"വാട്ടിൽസ് ഉദ്ധരിച്ചത്","“Golden Rule” Jones of Toledo":"ടൊളീഡോയിലെ “ഗോൾഡൻ റൂൾ” ജോൺസ്","the same tools":"ഒരേ ഉപകരണങ്ങൾ","a handsome chair":"മനോഹരമായ കസേര","a botch":"അലങ്കോലം","talent alone does not make anyone rich":"കഴിവ് മാത്രം ആരെയും സമ്പന്നരാക്കില്ല","every trade needs its faculties":"ഓരോ തൊഴിലിനും അതിന്റെ കഴിവുകൾ വേണം","The faculties are tools.":"കഴിവുകൾ ഉപകരണങ്ങളാണ്.","Use them in the Right Way.":"അവ ശരിയായ രീതിയിൽ ഉപയോഗിക്കുക.","music":"സംഗീതം","numbers":"കണക്ക്","people":"ആളുകൾ","hands":"കൈവേല","words":"വാക്കുകൾ","best fitted":"ഏറ്റവും യോജിച്ചത്","every talent, at least in seed":"എല്ലാ കഴിവും, വിത്തായെങ്കിലും","Which business?":"ഏത് ബിസിനസ്?","Easier: use your strongest tools.":"എളുപ്പം: ഏറ്റവും ശക്തമായ ഉപകരണങ്ങൾ.","Not fixed at birth.":"ജന്മനാ നിശ്ചയിച്ചതല്ല.","make your tools":"ഉപകരണങ്ങൾ ഉണ്ടാക്കുക","as you go along":"മുന്നോട്ടു പോകുംതോറും","Easiest: what you are best fitted for":"ഏറ്റവും എളുപ്പം: ഏറ്റവും യോജിച്ചത്","Most satisfying: what you want to do":"ഏറ്റവും സംതൃപ്തി: ആഗ്രഹിക്കുന്നത്","TAXI":"ടാക്സി","Shameer, a taxi driver in Abu Dhabi":"ഷമീർ, അബുദാബിയിലെ ടാക്സി ഡ്രൈവർ","desire = power seeking expression":"ആഗ്രഹം = പുറത്തുവരാൻ ശ്രമിക്കുന്ന ശക്തി","his own kitchen":"സ്വന്തം അടുക്കള","the present job, a means":"ഇപ്പോഴത്തെ ജോലി, ഒരു മാർഗം","Shameer drives a taxi but longs to cook. In Wattles' view, what does that desire tell him?":"ഷമീർ ടാക്സി ഓടിക്കുന്നു, പക്ഷേ പാചകം ചെയ്യാൻ കൊതിക്കുന്നു. വാട്ടിൽസിന്റെ കാഴ്ചപ്പാടിൽ, ആ ആഗ്രഹം അയാളോട് എന്ത് പറയുന്നു?","That he lacks the talent, since he was not trained as a cook":"അയാൾക്ക് അതിനുള്ള കഴിവില്ല എന്ന്","That the power to cook is in him, seeking expression":"പാചകത്തിനുള്ള സർഗ്ഗാത്മക ശേഷി അയാളിൽ ഒളിഞ്ഞിരിപ്പുണ്ട് എന്ന്","That he must quit the taxi job tomorrow":"നാളെത്തന്നെ ജോലി ഉപേക്ഷിക്കണം എന്ന്","Wattles says every talent is there at least in seed, and you can make your tools as you go.":"അല്ല. എല്ലാ കഴിവും വിത്തായെങ്കിലും ഉണ്ടെന്നും, മുന്നോട്ടു പോകുംതോറും ഉപകരണങ്ങൾ ഉണ്ടാക്കാമെന്നും വാട്ടിൽസ് പറയുന്നു.","Right. Desire is a manifestation of power. Where there is no power, there is no desire.":"ശരിയുത്തരം! ആഗ്രഹം എന്നത് പുറത്തേക്ക് വരാൻ തുടിക്കുന്ന കഴിവാണ്.","Continue":"തുടരുക","He says change by growth. Never take sudden action while in doubt.":"അല്ല. വളർച്ചയിലൂടെ മാറുക എന്നാണ് അദ്ദേഹം പറയുന്നത്. സംശയമുള്ളപ്പോൾ ഒരിക്കലും പെട്ടെന്ന് നടപടി എടുക്കരുത്.","the work you are in":"ഇപ്പോഴത്തെ ജോലി","the work you want":"ആഗ്രഹിക്കുന്ന ജോലി","a leap in doubt":"സംശയത്തിലെ ചാട്ടം","Change by growth.":"വളർച്ചയിലൂടെ മാറുക.","Sudden change is fine,":"പെട്ടെന്നുള്ള മാറ്റം ആകാം,","after careful thought.":"നന്നായി ആലോചിച്ച ശേഷം.","When in doubt, wait.":"സംശയമെങ്കിൽ, കാത്തിരിക്കുക.","the picture":"ചിത്രം","give thanks":"നന്ദി പറയുക","day 1":"ദിവസം 1","day 2":"ദിവസം 2","no mistake":"തെറ്റില്ല","haste":"തിടുക്കം","fear":"ഭയം","doubt":"സംശയം","more life to all, less to none":"എല്ലാവർക്കും കൂടുതൽ ജീവിതം, ആർക്കും കുറവില്ല","THE CREATIVE PLANE":"സൃഷ്ടിയുടെ തലം","THE COMPETITIVE PLANE":"മത്സരത്തിന്റെ തലം","taken":"എടുത്തു","a better one, farther on":"അൽപ്പം മുന്നിൽ, അതിലും നല്ലത്","a competitor again":"വീണ്ടും മത്സരാർത്ഥി","HALT":"നിർത്തൂ","thank you":"നന്ദി","There is enough for all.":"എല്ലാവർക്കും വേണ്ടത്ര ഉണ്ട്.","Go as fast as you can,":"കഴിയുന്നത്ര വേഗത്തിൽ പോവുക,","but never hurry.":"പക്ഷേ തിടുക്കം കൂട്ടരുത്.","True or false?":"ശരിയോ തെറ്റോ?","Wattles tells you to go as fast as you can.":"വേഗത നല്ലതാണ്, എന്നാൽ അനാവശ്യ ധൃതി അപകടമാണ്.","True":"ശരി","False":"തെറ്റ്","When you hurry, you drop back to the competitive plane.":"ധൃതികൂട്ടുമ്പോൾ നമ്മൾ മത്സരബുദ്ധിയിലേക്ക് വഴുതിവീഴുന്നു.","If someone takes the opening you wanted, your chance is gone.":"ഒരവസരം നഷ്ടപ്പെട്ടാൽ പിന്നെ ഒരിക്കലും പുതിയ അവസരം ലഭിക്കില്ല.","True. Speed is fine. Hurry is the problem.":"ശരി. വേഗം നല്ലതാണ്. തിടുക്കമാണ് പ്രശ്നം.","Look again. He says go as fast as you can, but never hurry.":"ഒന്നുകൂടി നോക്കൂ. കഴിയുന്നത്ര വേഗത്തിൽ പോവുക, പക്ഷേ തിടുക്കം കൂട്ടരുത് എന്നാണ് അദ്ദേഹം പറയുന്നത്.","True. In the moment you hurry, you become a competitor.":"ശരി. തിടുക്കം കൂട്ടുന്ന നിമിഷം, നിങ്ങൾ മത്സരാർത്ഥിയാകുന്നു.","Look at where the figure lands when it rushes.":"ഓടിപ്പിടിക്കുമ്പോൾ ആ രൂപം എവിടെ എത്തുന്നു എന്ന് നോക്കൂ.","Look at the second doorway.":"രണ്ടാമത്തെ വാതിൽ നോക്കൂ.","False. If one space is taken, a better one opens a little farther on.":"പ്രപഞ്ചത്തിൽ അവസരങ്ങൾ അനന്തമാണ്.","Chapter 13 in four lines":"അദ്ധ്യായം 13, നാല് വരികളിൽ","Your faculties are tools. Use them the Right Way.":"കഴിവുകൾ ഉപകരണങ്ങളാണ്. ശരിയായ രീതിയിൽ ഉപയോഗിക്കുക.","Do what you want. Desire is power seeking expression.":"ആഗ്രഹിക്കുന്നത് ചെയ്യുക. ആഗ്രഹം പുറത്തുവരാൻ ശ്രമിക്കുന്ന ശക്തിയാണ്.","Change by growth. When in doubt, wait and give thanks.":"വളർച്ചയിലൂടെ മാറുക. സംശയമെങ്കിൽ, കാത്തിരുന്ന് നന്ദി പറയുക.","Chapter practice · 1 of 3":"Chapter practice · 3-ൽ 1","Rasheed, an accountant in Sharjah, dreams of a tailoring unit back home in Malappuram. He is not yet sure. What would Wattles advise?":"തയ്യൽക്കട സ്വപ്നം കാണുന്ന അക്കൗണ്ടന്റായ റഷീദിന് ഇനിയും ഉറപ്പായിട്ടില്ലെങ്കിൽ വാട്ടിൽസിന്റെ ഉപദേശം എന്തായിരിക്കും?","Resign tomorrow and go, before someone else opens one":"നാളെത്തന്നെ ജോലി രാജി വെക്കുക","Give up the idea, since he was trained in accounts, not tailoring":"അക്കൗണ്ടിംഗ് മാത്രം പഠി l the customers":"വേഗത്തിൽ ഓടിപ്പിടിക്കുക","Go as fast as you can, but never hurry. Halt, hold the picture, and give thanks":"ശാന്തനാവുക, അനാവശ്യ ധൃതി ഒഴിവാക്കി ലക്ഷ്യത്തിൽ ഉറച്ചുനിൽക്കുക","Close the shop, since the space is now taken":"കട പൂട്ടുക","That is the competitive plane. No one can beat you to the thing you want.":"അല്ല. അത് മത്സരത്തിന്റെ തലമാണ്. നിങ്ങൾ ആഗ്രഹിക്കുന്നത് ആർക്കും നിങ്ങളിൽ നിന്ന് തട്ടിയെടുക്കാനാവില്ല.","Right. Hurry turns a creator into a competitor.":"അനാവശ്യ ധൃതി മത്സരബുദ്ധിയിൽ നിന്നാണ് ഉണ്ടാകുന്നത്.","If one space is taken, he says, a better one opens a little farther on.":"അല്ല. ഒരു ഇടം എടുക്കപ്പെട്ടാൽ, കുറച്ചുകൂടി മുന്നിൽ അതിലും നല്ലൊരെണ്ണം തുറക്കും എന്ന് അദ്ദേഹം പറയുന്നു.","Chapter 13 complete":"അദ്ധ്യായം 13 പൂർത്തിയായി"};
