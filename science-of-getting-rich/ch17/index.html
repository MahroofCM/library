if (document.documentElement.lang === 'ml') window.SG_TR = {"\"Thinking the form of a slow-growing oak tree, it moves accordingly, and produces the tree.\"":"\"സാവധാനം വളരുന്ന ഒരു ഓക്ക് മരത്തിന്റെ രൂപം ചിന്തിച്ചുകൊണ്ട്, അത് അതിനനുസരിച്ച് ചലിക്കുകയും ആ മരം ഉണ്ടാക്കുകയും ചെയ്യുന്നു.\"","The Young Maker Universe · Interactive classics":"The Young Maker Universe · ഇന്ററാക്ടീവ് ക്ലാസിക്കുകൾ","The Science of":"സമ്പന്നനാകാനുള്ള","Getting Rich":"ശാസ്ത്രം","WALLACE D. WATTLES · 1910 · 17 CHAPTERS":"വാലസ് ഡി. വാട്ടിൽസ് · 1910 · 17 അദ്ധ്യായങ്ങൾ","A thought held clearly becomes a thing. Wattles' short manual, rebuilt as seventeen narrated lessons you can watch, hear and test yourself on.":"വ്യക്തമായി മനസ്സിൽ പിടിക്കുന്ന ഒരു ചിന്ത ഒരു വസ്തുവായി മാറുന്നു. വാട്ടിൽസിന്റെ ചെറിയ കൈപ്പുസ്തകം, കാണാനും കേൾക്കാനും സ്വയം പരീക്ഷിക്കാനും കഴിയുന്ന 17 ശബ്ദവിവരണ പാഠങ്ങളായി പുതുക്കിയെടുത്തിരിക്കുന്നു.","Open the book":"പുസ്തകം തുറക്കുക","Continue: chapter 17":"തുടരാം: അദ്ധ്യായം 17","There is a thinking stuff from which all things are made. A thought, in this substance, produces the thing that is imaged by the thought.":"എല്ലാ വസ്തുക്കളും ഉണ്ടായിരിക്കുന്നത് ഒരു ചിന്തിക്കുന്ന സത്തയിൽ നിന്നാണ്. ഈ സത്തയിലെ ഒരു ചിന്ത, ആ ചിന്ത സങ്കൽപ്പിക്കുന്ന വസ്തുവിനെ ഉണ്ടാക്കുന്നു.","The creed · Chapter 4":"വിശ്വാസപ്രമാണം · അദ്ധ്യായം 4","An oak tree drawn in gold lines":"സ്വർണ്ണവരകളിൽ വരച്ച ഒരു ഓക്ക് മരം","← Cover":"← പുറംചട്ട","Contents":"ഉള്ളടക്കം","Seventeen short chapters in five parts, each an animated, narrated lesson with quick checks. Open any chapter for its core idea and one line in Wattles' own words.":"അഞ്ച് ഭാഗങ്ങളിലായി പതിനേഴ് ചെറിയ അദ്ധ്യായങ്ങൾ. ഓരോന്നും പെട്ടെന്നുള്ള പരിശോധനകളുള്ള, ശബ്ദവിവരണത്തോടെയുള്ള ഒരു ആനിമേറ്റഡ് പാഠം. ഏത് അദ്ധ്യായം തുറന്നാലും അതിന്റെ കാതലായ ആശയവും വാട്ടിൽസിന്റെ സ്വന്തം വാക്കുകളിൽ ഒരു വരിയും കാണാം.","CONTINUE READING · PART 5 · CHAPTER 17":"വായന തുടരാം · PART 5 · CHAPTER 17","Summary of the science":"ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","The whole method on one page: thinking substance, a clear picture, faith, gratitude, and efficient action that gives more than it takes.":"മുഴുവൻ രീതിയും ഒറ്റ പേജിൽ: ചിന്തിക്കുന്ന സത്ത, വ്യക്തമായ ചിത്രം, വിശ്വാസം, നന്ദി, പിന്നെ എടുക്കുന്നതിലും കൂടുതൽ കൊടുക്കുന്ന കാര്യക്ഷമമായ പ്രവൃത്തി.","Completed. Replay any time.":"പൂർത്തിയാക്കി. എപ്പോൾ വേണമെങ്കിലും വീണ്ടും കാണാം.","Play lesson":"പാഠം കാണുക","Part 1":"ഭാഗം 1","The right and the science":"അവകാശവും ശാസ്ത്രവും","The right to be rich":"സമ്പന്നനാകാനുള്ള അവകാശം","Completed":"പൂർത്തിയായി","Wattles opens with permission. Body, mind and soul all grow by using things, and things cost money, so wanting more is simply life wanting to develop. Poverty is not holier.":"വാട്ടിൽസ് തുടങ്ങുന്നത് ഒരു അനുവാദത്തോടെയാണ്. ശരീരവും മനസ്സും ആത്മാവും വളരുന്നത് വസ്തുക്കൾ ഉപയോഗിച്ചാണ്, വസ്തുക്കൾക്ക് പണം വേണം. അതുകൊണ്ട് കൂടുതൽ ആഗ്രഹിക്കുന്നത് ജീവൻ വികസിക്കാൻ ആഗ്രഹിക്കുന്നതു മാത്രമാണ്. ദാരിദ്ര്യം കൂടുതൽ വിശുദ്ധമല്ല.","The object of all life is development.":"എല്ലാ ജീവന്റെയും ആത്യന്തിക ലക്ഷ്യം വികാസമാണ്.","Replay lesson":"പാഠം വീണ്ടും കാണുക","There is a science of getting rich":"സമ്പന്നനാകാൻ കൃത്യമായൊരു ശാസ്ത്രമുണ്ട്","Two people work the same trade on the same street and one prospers. Talent, thrift and location do not explain it. A Certain Way of doing things does, and anyone who can read can learn it.":"ഒരേ തെരുവിൽ ഒരേ ജോലി ചെയ്യുന്ന രണ്ടുപേർ. ഒരാൾ മാത്രം രക്ഷപ്പെടുന്നു. കഴിവോ മിതവ്യയമോ സ്ഥലമോ അതിന് കാരണമല്ല. കാര്യങ്ങൾ ചെയ്യുന്ന ഒരു നിശ്ചിത മാർഗമാണ് കാരണം. വായിക്കാൻ അറിയുന്ന ആർക്കും അത് പഠിക്കാം.","Like causes always produce like effects.":"ഒരേ കാരണങ്ങൾ എപ്പോഴും ഒരേ ഫലങ്ങൾ തന്നെ ഉണ്ടാക്കുന്നു.","Is opportunity monopolized?":"അവസരങ്ങൾ ആരുടെയെങ്കിലും കുത്തകയാണോ?","Nobody is kept poor because someone fenced off the supply. Opportunity moves like a tide toward new fields. The supply of raw material, and of ideas, has no ceiling.":"ആരോ ലഭ്യത വേലികെട്ടി അടച്ചതുകൊണ്ടല്ല ആരും ദരിദ്രരായി തുടരുന്നത്. അവസരം ഒരു വേലിയേറ്റം പോലെ പുതിയ മേഖലകളിലേക്ക് നീങ്ങുന്നു. അസംസ്കൃത വസ്തുക്കളുടെയും ആശയങ്ങളുടെയും ലഭ്യതയ്ക്ക് ഒരു പരിധിയുമില്ല.","There is abundance of opportunity for the man who will go with the tide.":"ഒഴുക്കിനൊപ്പം നീങ്ങാൻ തയ്യാറുള്ളവർക്ക് അവസരങ്ങൾ അനന്തമാണ്.","Part 2":"ഭാഗം 2","Thinking substance":"ചിന്തിക്കുന്ന പ്രപഞ്ചസത്ത","The first principle":"ഒന്നാമത്തെ അടിസ്ഥാനതത്വം","The creed: one thinking substance fills the universe, a thought held in it produces the form, and a person can impress a thought upon it. Wattles asks you to accept this and test it by acting on it.":"വിശ്വാസപ്രമാണം: ഒരു ചിന്തിക്കുന്ന സത്ത പ്രപഞ്ചം മുഴുവൻ നിറഞ്ഞിരിക്കുന്നു, അതിൽ പിടിക്കുന്ന ഒരു ചിന്ത രൂപം ഉണ്ടാക്കുന്നു, ഒരു മനുഷ്യന് അതിൽ ഒരു ചിന്ത പതിപ്പിക്കാൻ കഴിയും. ഇത് അംഗീകരിക്കാനും, അതനുസരിച്ച് പ്രവർത്തിച്ച് പരീക്ഷിക്കാനും വാട്ടിൽസ് ആവശ്യപ്പെടുന്നു.","Thought is the only power which can produce tangible riches from the Formless Substance.":"രൂപരഹിതമായ സത്തയിൽ നിന്ന് സമ്പത്ത് സൃഷ്ടിക്കാൻ കഴിയുന്ന ഒരേയൊരു ശക്തി ചിന്തയാണ്.","Increasing life":"ജീവിതത്തിന്റെ വികാസം","Life always seeks to become more, and the source of all things wants more life for everyone. So you never need to take from someone else. Rise out of competition into creation.":"ജീവൻ എപ്പോഴും കൂടുതൽ ആകാൻ ശ്രമിക്കുന്നു, എല്ലാറ്റിന്റെയും ഉറവിടം എല്ലാവർക്കും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. അതുകൊണ്ട് മറ്റൊരാളിൽ നിന്ന് ഒന്നും എടുക്കേണ്ടതില്ല. മത്സരത്തിൽ നിന്ന് സൃഷ്ടിയിലേക്ക് ഉയരുക.","You are to become a creator, not a competitor.":"നിങ്ങൾ ഒരു സ്രഷ്ടാവാകണം, വെറുമൊരു മത്സരാർത്ഥിയാകരുത്.","How riches come to you":"സമ്പത്ത് നിങ്ങളിലേക്ക് എത്തുന്ന വഴി","Give every person more in use value than you take in cash value. What you want arrives through people and trade, in deals that serve them too. And ask largely.":"ഓരോരുത്തരിൽ നിന്നും പണമൂല്യമായി എടുക്കുന്നതിനെക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം അവർക്ക് കൊടുക്കുക. നിങ്ങൾ ആഗ്രഹിക്കുന്നത് ആളുകളിലൂടെയും കച്ചവടത്തിലൂടെയും, അവർക്കും ഗുണമുള്ള ഇടപാടുകളിലൂടെ വന്നുചേരുന്നു. വലുതായി ചോദിക്കുക.","Give every man more in use value than you take from him in cash value.":"വാങ്ങുന്ന പണത്തേക്കാൾ കൂടുതൽ ഉപയോഗമൂല്യം ആളുകൾക്ക് തിരിച്ചുനൽകുക.","Gratitude":"നന്ദി","Gratitude keeps your mind close to the source of supply and out of complaint and competition. It is also where faith comes from: a grateful mind expects good things.":"നന്ദി നിങ്ങളുടെ മനസ്സിനെ എല്ലാറ്റിന്റെയും ഉറവിടത്തോട് ചേർത്തുനിർത്തുന്നു, പരാതിയിൽ നിന്നും മത്സരത്തിൽ നിന്നും അകറ്റിനിർത്തുന്നു. വിശ്വാസം വരുന്നതും അവിടെ നിന്നാണ്: നന്ദിയുള്ള മനസ്സ് നല്ലത് പ്രതീക്ഷിക്കുന്നു.","Faith is born of gratitude.":"വിശ്വാസം ജനിക്കുന്നത് ആത്മാർത്ഥമായ കൃതജ്ഞതയിൽ നിന്നാണ്.","Part 3":"ഭാഗം 3","Thinking in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള ചിന്ത","A vague wish transmits nothing. Form a clear, detailed picture of what you want, hold it like a helmsman holds a heading, and live as if you already own it.":"അവ്യക്തമായ ഒരു ആഗ്രഹം ഒന്നും എത്തിക്കുന്നില്ല. നിങ്ങൾക്ക് വേണ്ടതിന്റെ വ്യക്തവും വിശദവുമായ ഒരു ചിത്രം ഉണ്ടാക്കുക. കപ്പിത്താൻ ദിശ വിടാതെ പിടിക്കുന്നതുപോലെ അത് മുറുകെ പിടിക്കുക. അത് ഇപ്പോഴേ സ്വന്തമായി എന്ന മട്ടിൽ ജീവിക്കുക.","You must know what you want, and be definite.":"നിങ്ങൾക്ക് എന്താണ് വേണ്ടതെന്ന് വ്യക്തമായി അറിയണം; അതിൽ പൂർണ്ണമായ വ്യക്തത വേണം.","How to use the will":"ഇച്ഛാശക്തി എങ്ങനെ ഉപയോഗിക്കാം","Never aim your will at other people or at the universe. Aim it at yourself, to keep your attention on the picture and off pictures of lack.":"നിങ്ങളുടെ ഇച്ഛ ഒരിക്കലും മറ്റുള്ളവരുടെ നേരെയോ പ്രപഞ്ചത്തിന്റെ നേരെയോ തിരിക്കരുത്. നിങ്ങളിലേക്കു തന്നെ തിരിക്കുക. ശ്രദ്ധ ആ ചിത്രത്തിൽ നിർത്താനും ഇല്ലായ്മയുടെ ചിത്രങ്ങളിൽ നിന്ന് മാറ്റാനും.","To get rich, you need only to use your will power upon yourself.":"സമ്പന്നനാകാൻ നിങ്ങളുടെ ഇച്ഛാശക്തി സ്വന്തം മനസ്സിൽ പ്രയോഗിച്ചാൽ മാത്രം മതി.","Further use of the will":"ഇച്ഛാശക്തിയുടെ കൂടുതൽ പ്രയോഗങ്ങൾ","Stop retelling past money troubles. Pick one system and stay with it. The best help you can give anyone is a working example.":"പഴയ പണപ്രശ്നങ്ങൾ വീണ്ടും വീണ്ടും പറയുന്നത് നിർത്തുക. ഒരു രീതി തിരഞ്ഞെടുത്ത് അതിൽ ഉറച്ചുനിൽക്കുക. ആർക്കും നിങ്ങൾ കൊടുക്കാവുന്ന ഏറ്റവും നല്ല സഹായം, ഫലം കണ്ട ഒരു മാതൃകയാകുക എന്നതാണ്.","An ounce of doing things is worth a pound of theorizing.":"ഒരു റാത്തൽ സിദ്ധാന്തത്തേക്കാൾ വിലയുണ്ട് ഒരു ഔൺസ് പ്രവൃത്തിക്ക്.","Part 4":"ഭാഗം 4","Acting in the Certain Way":"കൃത്യമായ ശൈലിയിലുള്ള പ്രവൃത്തി","Thought sets things moving toward you; action is how you receive them. Act now, in your present work and place, not in some imagined future one.":"ചിന്ത കാര്യങ്ങളെ നിങ്ങളുടെ നേർക്ക് ചലിപ്പിക്കുന്നു; പ്രവൃത്തിയിലൂടെയാണ് നിങ്ങൾ അവയെ സ്വീകരിക്കുന്നത്. ഇപ്പോൾ പ്രവർത്തിക്കുക, ഇപ്പോഴത്തെ ജോലിയിലും സ്ഥലത്തും. സങ്കൽപ്പത്തിലെ ഏതോ ഭാവിജോലിയിലല്ല.","By thought, the thing you want is brought to you; by action you receive it.":"ചിന്തയിലൂടെ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് നിങ്ങളിലേക്ക് വരുന്നു; പ്രവൃത്തിയിലൂടെ നിങ്ങൾ അത് സ്വീകരിക്കുന്നു.","Efficient action":"കാര്യക്ഷമമായ പ്രവർത്തനം","Do every day all that can be done that day, and do each act well. Volume is not the measure. A day of inefficient acts is a failed day.":"ഓരോ ദിവസവും അന്ന് ചെയ്യാവുന്നതെല്ലാം ചെയ്യുക, ഓരോ കാര്യവും നന്നായി ചെയ്യുക. എത്ര ചെയ്തു എന്നതല്ല അളവ്. കാര്യക്ഷമമല്ലാത്ത പ്രവൃത്തികൾ നിറഞ്ഞ ദിവസം ഒരു പരാജയപ്പെട്ട ദിവസമാണ്.","Every act is, in itself, either a success or a failure.":"ഓരോ പ്രവൃത്തിയും അതിൽത്തന്നെ ഒന്നുകിൽ ഒരു വിജയമാണ്, അല്ലെങ്കിൽ ഒരു പരാജയമാണ്.","Getting into the right business":"ശരിയായ മേഖല തിരഞ്ഞെടുക്കൽ","Use your strongest faculties, or follow the work you most want to do. Change by growth, not by panic. When in doubt, wait and give thanks.":"നിങ്ങളുടെ ഏറ്റവും ശക്തമായ കഴിവുകൾ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ഏറ്റവും ചെയ്യാൻ ഇഷ്ടമുള്ള ജോലി തിരഞ്ഞെടുക്കുക. മാറ്റം വളർച്ചയിലൂടെയാകട്ടെ, പേടിച്ചോടിയല്ല. സംശയമുള്ളപ്പോൾ കാത്തിരിക്കുക, നന്ദി പറയുക.","Go as fast as you can, but never hurry.":"സാധ്യമായത്ര വേഗത്തിൽ മുന്നേറുക, എന്നാൽ ഒരിക്കലും അനാവശ്യമായി ധൃതികൂട്ടരുത്.","The impression of increase":"പുരോഗതിയുടെ അനുഭവം പകരുക","Everyone you deal with wants more life. Leave each of them with the sense that dealing with you advances them. Never seek power over others.":"നിങ്ങൾ ഇടപെടുന്ന എല്ലാവരും കൂടുതൽ ജീവൻ ആഗ്രഹിക്കുന്നു. നിങ്ങളുമായുള്ള ഇടപാട് തങ്ങളെ മുന്നോട്ട് കൊണ്ടുപോകുന്നു എന്ന തോന്നൽ ഓരോരുത്തർക്കും നൽകുക. മറ്റുള്ളവരുടെ മേൽ ഒരിക്കലും അധികാരം തേടരുത്.","What I want for myself, I want for everybody.":"എനിക്കായി ഞാൻ ആഗ്രഹിക്കുന്നത് എന്തോ, അത് മറ്റെല്ലാവർക്കുമായി ഞാൻ ആഗ്രഹിക്കുന്നു.","The advancing man":"മുന്നേറുന്ന വ്യക്തി","Doctor, teacher, preacher or wage earner, the law is the same. Be too big for your present place and carry a clear picture of the person you are becoming.":"ഡോക്ടറോ അധ്യാപകനോ പ്രസംഗകനോ ശമ്പളക്കാരനോ ആകട്ടെ, നിയമം ഒന്നുതന്നെ. ഇപ്പോഴത്തെ സ്ഥാനത്തെക്കാൾ വലുതാകുക, നിങ്ങൾ ആയിത്തീരുന്ന വ്യക്തിയുടെ വ്യക്തമായ ചിത്രം കൂടെ കൊണ്ടുനടക്കുക.","There is a Power which never fails to present opportunity to the Advancing Man.":"മുന്നേറാൻ ദൃഢനിശ്ചയമുള്ള വ്യക്തിക്ക് അവസരങ്ങൾ ഒരുക്കുന്നതിൽ പ്രപഞ്ചം ഒരിക്കലും പരാജയപ്പെടാറില്ല.","Part 5":"ഭാഗം 5","Cautions and summary":"മുന്നറിയിപ്പുകളും സംഗ്രഹവും","Some cautions":"പ്രധാനപ്പെട്ട ചില മുന്നറിയിപ്പുകൾ","Guard your speech. Do not plan around imagined disasters. A seeming failure usually clears the way for something larger than you asked for.":"നിങ്ങളുടെ സംസാരം ശ്രദ്ധിക്കുക. സങ്കൽപ്പത്തിലെ ദുരന്തങ്ങളെ മുന്നിൽ കണ്ട് പദ്ധതിയിടരുത്. പരാജയം എന്ന് തോന്നുന്നത് പലപ്പോഴും നിങ്ങൾ ചോദിച്ചതിനെക്കാൾ വലിയ ഒന്നിന് വഴിയൊരുക്കുകയാണ്.","Never allow yourself to feel disappointed.":"നിരാശയ്ക്ക് ഒരിക്കലും നിങ്ങളുടെ മനസ്സിൽ ഇടം നൽകരുത്.","The riches they receive will be in exact proportion to the definiteness of their vision.":"മനുഷ്യർക്ക് ലഭിക്കുന്ന സമ്പത്ത് അവരുടെ സങ്കൽപ്പത്തിന്റെ വ്യക്തതയ്ക്കും, ലക്ഷ്യത്തിന്റെ ദൃഢതയ്ക്കും, വിശ്വാസത്തിന്റെ ആഴത്തിനും തുല്യമായിരിക്കും.","Text: Wallace D. Wattles, 1910, public domain. Lessons and drawings: The Young Maker Universe.":"മൂലകൃതി: വാലസ് ഡി. വാട്ടിൽസ്, 1910, പകർപ്പവകാശമുക്തം. പാഠങ്ങളും ചിത്രങ്ങളും: The Young Maker Universe.","Read the method, test it in your own life, keep what works.":"രീതി വായിക്കുക, സ്വന്തം ജീവിതത്തിൽ പരീക്ഷിക്കുക, ഫലിക്കുന്നത് നിലനിർത്തുക.","Play chapter 17, Summary of the science":"അദ്ധ്യായം 17 കാണുക, ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Part 5 · Chapter 17":"ഭാഗം 5 · അദ്ധ്യായം 17","Finished":"പൂർത്തിയായി","About 7 minutes · narrated · 3 question sets":"ഏകദേശം 7 മിനിറ്റ് · ശബ്ദവിവരണം · 3 ചോദ്യഭാഗങ്ങൾ","Play without voice":"ശബ്ദമില്ലാതെ കാണുക","Chapter 17 · results":"അദ്ധ്യായം 17 · ഫലം","1 of 5":"5-ൽ 1","First-try answers. Replay any step to review it.":"ആദ്യ ശ്രമത്തിലെ ഉത്തരങ്ങൾ. ഏത് ഘട്ടവും വീണ്ടും കണ്ട് ഓർമ്മ പുതുക്കാം.","Wattles: “The riches they receive will be in exact proportion to the definiteness of their vision.”":"വാട്ടിൽസ്: “അവർക്ക് കിട്ടുന്ന സമ്പത്ത് അവരുടെ വിഷൻ എത്ര കൃത്യമാണോ, കൃത്യമായി അതിന്റെ അനുപാതത്തിലായിരിക്കും.”","Back to contents":"ഉള്ളടക്കത്തിലേക്ക് മടങ്ങുക","Replay chapter":"അദ്ധ്യായം വീണ്ടും കാണുക","CC":"CC","Voice":"ശബ്ദം","Narrator voice":"വിവരണ ശബ്ദം","Narration off":"വിവരണം ഓഫ്","Space play or pause · ← → steps · C captions · M narration. Voices come from your device. Indian English voices are listed first; Edge on Windows has the most natural one (Prabhat).":"സ്പേസ്: പ്ലേ അല്ലെങ്കിൽ പോസ് · ← → ഘട്ടങ്ങൾ · C ക്യാപ്ഷൻ · M ശബ്ദവിവരണം. ശബ്ദങ്ങൾ നിങ്ങളുടെ ഉപകരണത്തിൽ നിന്നാണ്. മലയാളം ശബ്ദങ്ങൾ ആദ്യം കാണിക്കും. വിൻഡോസിലെ Edge-ലാണ് ഏറ്റവും സ്വാഭാവികമായ ശബ്ദം (Midhun).","Lesson animation":"പാഠത്തിന്റെ ആനിമേഷൻ","Play with narration":"ശബ്ദവിവരണത്തോടെ കാണുക","Previous step":"മുമ്പത്തെ ഘട്ടം","Play":"പ്ലേ","Next step":"അടുത്ത ഘട്ടം","Lesson steps":"പാഠത്തിലെ ഘട്ടങ്ങൾ","Step 1: Summary of the science":"ഘട്ടം 1: ശാസ്ത്രത്തിന്റെ സംഗ്രഹം","Step 2: A thought in the substance":"ഘട്ടം 2: സത്തയിലെ ഒരു ചിന്ത","A thought in the substance":"സത്തയിലെ ഒരു ചിന്ത","Step 3: Creative and grateful":"ഘട്ടം 3: സൃഷ്ടിയും നന്ദിയും","Creative and grateful":"സൃഷ്ടിയും നന്ദിയും","Step 4: The clear picture":"ഘട്ടം 4: വ്യക്തമായ ചിത്രം","The clear picture":"വ്യക്തമായ ചിത്രം","Step 5: Quick check":"ഘട്ടം 5: Quick check","Quick check":"Quick check","Step 6: Act in your present place":"ഘട്ടം 6: ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Act in your present place":"ഇപ്പോഴുള്ള ഇടത്ത് പ്രവർത്തിക്കുക","Step 7: Mo function icon(p, k, x, y, s, col) {
  const g = G(p, { x, y, s });

// the strip of nine steps across the top: `lit` are already lit, `lights` = [[index, time], …] light up now
function strip(p, lit = [], lights = []) {
  const kick = T(p, 'THE NINE STEPS', { x: 372, y: 82, size: 22, fill: C.dim, font: FM, anchor: 'end', ls: 2, o: 0 }); show(kick, .1);
  const at = {}; lights.forEach(([i, t]) => { at[i] = t; });
  for (let i = 0; i < 9; i++) {
    const x = 430 + i * 92, y = 74;
    const base = G(p, { x, y, o: 0 }); show(base, .1 + i * .03);
    mk('circle', { r: 30, fill: C.board, stroke: C.faint, 'stroke-width': 2 }, base);
    icon(base, i, 0, 0, .9, C.faint);
    if (lit.includes(i) || i in at) {
      const on = G(p, { x, y });
      mk('circle', { r: 30, fill: C.board, stroke: C.gold, 'stroke-width': 2.5 }, on);
      icon(on, i, 0, 0, .9, C.goldHi);
      if (i in at) pop(on, at[i]); else { on._b.o = 0; show(on, .15 + i * .03); }
    }
  }
}

function givingScene(p, m) {
  // a scale: use value outweighs cash value
  const PX = 400, PY = 300, ARM = 210, HANG = 150;
  const post = Pth(p, `M${PX} ${PY} V740 M${PX - 80} 740 H${PX + 80}`, { stroke: C.dim, 'stroke-width': 3 }, { dw: 0 }); draw(post, .1, .6);
  mk('circle', { cx: PX, cy: PY, r: 8, fill: C.dim }, p);
  const beam = mk('path', { d: `M${-ARM} 0 H${ARM}`, stroke: C.ink, 'stroke-width': 5, 'stroke-linecap': 'round' }, p);
  const pan = (col, label, n, coin) => {
    const g = mk('g', {}, p);
    mk('path', { d: `M0 0 L-60 ${HANG} M0 0 L60 ${HANG}`, stroke: C.dim, 'stroke-width': 1.5 }, g);
    mk('path', { d: `M-84 ${HANG} Q0 ${HANG + 40} 84 ${HANG}Z`, fill: C.board, stroke: col, 'stroke-width': 3 }, g);
    const tt = mk('text', { x: 0, y: HANG + 84, 'text-anchor': 'middle', 'font-family': FT, 'font-size': 28, fill: col }, g); tt.textContent = label;
    for (let i = 0; i < n; i++) mk('rect', { x: -48 + (i % 4) * 26 - 10, y: HANG - 20 - Math.floor(i / 4) * 24, width: 20, height: 20, rx: coin ? 10 : 3, fill: C.board, stroke: col, 'stroke-width': 2.2 }, g);
    return g;
  };
  const L = pan(C.gold, 'use value', 8, false), R = pan(C.cash, 'cash value', 3, true);
  const tA = m('tilt', -.6);
  clockRun(t => {
    const a = t > tA ? -9 * E.io(Math.min(1, (t - tA) / 1.3)) : 0;
    const rad = a * Math.PI / 180, c = Math.cos(rad), s = Math.sin(rad);
    beam.setAttribute('transform', `translate(${PX} ${PY}) rotate(${a.toFixed(2)})`);
    L.setAttribute('transform', `translate(${(PX - ARM * c).toFixed(1)} ${(PY - ARM * s).toFixed(1)})`);
    R.setAttribute('transform', `translate(${(PX + ARM * c).toFixed(1)} ${(PY + ARM * s).toFixed(1)})`);
  }, 60);
  label(p, 'each deal makes for more life', 400, 200, m('tilt', .6), { size: 32, fill: C.goldHi, font: FD, italic: true, weight: 600 });
  // the impression of increase
  const CX = 950, CY = 650;
  const you = figure(p, { x: CX, y: 760, s: .6, col: C.gold, o: 0 }); show(you, m('nine', -.3));
  label(p, 'you', CX, 800, m('nine'), { size: 22, fill: C.dim });
  for (let k = 0; k < 3; k++) {
    const c = mk('circle', { cx: CX, cy: CY, r: 40, fill: 'none', stroke: C.gold, 'stroke-width': 2.5, opacity: 0 }, p);
    prog(q => { c.setAttribute('r', (40 + 520 * q).toFixed(1)); c.setAttribute('opacity', q > 0 ? (.9 * (1 - q)).toFixed(3) : 0); }, m('ripple') + k * .7, 2.4, E.out);
  }
  const who = [['customer', 1180], ['supplier', 1320], ['colleague', 1460]];
  who.forEach(([n, x], i) => {
    const f = figure(p, { x, y: 760, s: .48, o: 0 }); show(f, m('shop', i * .3));
    label(p, n, x, 800, m('shop', i * .3), { size: 22, fill: C.dim });

    tw(f, { o: 1 }, m('more', .3 + i * .25), .3);
  });

function proportionScene(p, m) {
  strip(p, [0, 1, 2, 3, 4, 5, 6, 7, 8], []);
  const ct = heading(p, 'They will certainly get rich.', 120, 210, m('cert', .2), { size: 50, anchor: 'start', italic: true, fill: C.goldHi });
  hide(ct, m('prop', -.5), .3);
  const q = quoteBlock(p, 'the riches they receive will be in exact proportion to the definiteness of their vision, the fixity of their purpose, the steadiness of their faith, and the depth of their gratitude.', 120, 176, m('prop', -.3), { size: 36, maxChars: 76 });
  const BASE = 760, H = 300;
  const names = [['vision', 'definiteness', 'v'], ['purpose', 'fixity', 'p'], ['faith', 'steadiness', 'f'], ['gratitude', 'depth', 'g']];
  const bars = names.map(([n, a, k], i) => {
    const x = 200 + i * 170;
    const out = G(p, { o: 0 }); show(out, m('prop', .2 + i * .08));
    mk('rect', { x: x - 40, y: BASE - H, width: 80, height: H, rx: 4, fill: 'none', stroke: C.faint, 'stroke-width': 2 }, out);
    const r = mk('rect', { x: x - 40, y: BASE, width: 80, height: 0, rx: 4, fill: C.gold, opacity: .9 }, p);
    label(p, n, x, BASE + 40, m(k), { size: 26, fill: C.goldHi, font: FD, italic: true, weight: 600 });
    label(p, a, x, BASE - H - 18, m(k, .2), { size: 22, fill: C.dim });
    return { r, t0: m(k, .1) };
  });
  const eq = T(p, '=', { x: 920, y: 600, size: 80, fill: C.dim, font: FD, anchor: 'middle', o: 0 }); show(eq, m('prop', 1));
  const RX = 1180;
  const rout = Pth(p, `M${RX - 110} ${BASE} V${BASE - 360} H${RX + 110} V${BASE}`, { stroke: C.dim, 'stroke-width': 2 }, { dw: 0 }); draw(rout, m('cert'), .8);
  const rich = mk('rect', { x: RX - 110, y: BASE, width: 220, height: 0, rx: 4, fill: C.goldHi, opacity: .9 }, p);
  label(p, 'riches', RX, BASE + 40, m('cert', .3), { size: 30, fill: C.goldHi, font: FD, italic: true, weight: 600 });
  clockRun(t => {
    let sum = 0;
    bars.forEach(b => { const h = H * E.out(Math.max(0, Math.min(1, (t - b.t0) / 1.4))); b.r.setAttribute('y', (BASE - h).toFixed(1)); b.r.setAttribute('height', h.toFixed(1)); sum += h; });
    const rh = sum / (4 * H) * 360; rich.setAttribute('y', (BASE - rh).toFixed(1)); rich.setAttribute('height', rh.toFixed(1));
  }, 120);
}
