function c1Row(m, card, kind, str, mark, y, { x = 52, maxW, size = 29 } = {}) {

  mmCue(m, g, mark, 'rise', { dy: 10 });

}

function c1Strike(p, c, t, color = MM.bad) {

// A two-line speech bubble: line 1 on one mark, line 2 on another. Tail at the bottom left.
function c1Bubble2(m, p, l1, l2, mk1, mk2, { x, y, w = 600, tail = 'left' }) {

  put(bg, { y: top + h / 2 });

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'mm-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('mm:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
