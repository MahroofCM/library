// A row inside a science card: a tick, cross or dot and a wrapped line, left-anchored at (x, y).
function c2Row(m, card, kind, str, mark, y, { x = 52, maxW, size = 29 } = {}) {
  const g = G(card, { x, y });
  const col = kind === 'ok' ? MM.good : kind === 'no' ? MM.bad : MM.gold;
  if (kind === 'ok') path(g, 'M-14 0L-4 10L14 -12', { stroke: col, 'stroke-width': 4.5 });
  else if (kind === 'no') path(g, 'M-11 -11L11 11M11 -11L-11 11', { stroke: col, 'stroke-width': 4.5 });
  else mmDot(g, 0, 0, 7, col);
  const t = mmPara(g, str, { x: 34, y: 10, size, maxW: maxW || card._w - x - 70, anchor: 'start', weight: 400 });
  g._h = t._h;
  mmCue(m, g, mark, 'rise', { dy: 10 });
  return g;
}
function c2ChipL(p, str, color, x, y, o = {}) { const c = mmChip(p, str, color, { ...o, x: 0, y }); put(c, { x: x + c._w / 2 }); return c; }
function c2Strike(p, x0, x1, y, t, color = MM.bad) {
  const s = path(p, `M${x0} ${y + 10}L${x1} ${y - 10}`, { stroke: color, 'stroke-width': 4 }, { d: 0 });

// The mango tree, ground at y = 0. Parts: ._roots (paths to draw) ._canopy ._spots (fruit positions, world coords)
function c2Tree(p, { x = 0, y = 0, s = 1, o = 1, rootCol = C2.root } = {}) {
