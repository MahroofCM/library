// Thought cloud for the sources beat: empty at first; ._fill holds tiny files that appear later.
function mmThoughtC3(p, x, y) {
  const g = G(p, { x, y });
  [[-60, 0, 46], [0, -24, 56], [60, 0, 46], [-30, 30, 40], [34, 30, 40]].forEach(([cx, cy, r]) => mk('circle', { cx, cy, r, fill: '#141b1f', stroke: MM.gold, 'stroke-width': 2, 'stroke-opacity': .6 }, g));
  mk('ellipse', { cx: 0, cy: 6, rx: 80, ry: 40, fill: '#141b1f' }, g);
  [[-70, 88, 10], [-90, 116, 7]].forEach(([cx, cy, r]) => mk('circle', { cx, cy, r, fill: '#141b1f', stroke: MM.gold, 'stroke-width': 2, 'stroke-opacity': .6 }, g));
  g._fill = [[-40, 0], [0, -10], [40, 0], [0, 26]].map(([fx, fy]) => { const f = G(g, { x: fx, y: fy, o: 0 }); path(f, 'M-14 10V-12H-4L0 -16H14V10Z', { fill: '#d9cfb3', stroke: MM.heard, 'stroke-width': 1.5 }); return f; });
  return g;
}

  p2a: 'ശക്തമായ ഒരു വികാരം അവന്റെ യുക്തിയെ മറികടക്കുന്നു', p2b: 'അവന് കുറച്ചുകൂടി സാമ്പത്തിക അറിവ് മതി', p2c: 'വലിയ കുടുംബങ്ങളിൽ സമ്പാദ്യം ഒരിക്കലും നടക്കില്ല',
  p2y: 'ശരി. കൂറും അംഗീകാരവും പദ്ധതിക്ക് എതിരെ വലിക്കുന്നു. ആ വികാരത്തിന് പേരിടുന്നതാണ് ആദ്യ നീക്കം.',
  p2nb: 'പദ്ധതി ശരിയാണെന്ന് അവന് ഇതിനകം അറിയാം. തടസ്സം വികാരമാണ്, അറിവല്ല.',
  p2nc: 'ധാരാളം കുടുംബങ്ങൾ സമ്പാദിക്കുന്നുണ്ട്. പ്രശ്നം സമ്പാദ്യത്തിന് അവൻ നൽകുന്ന അർത്ഥമാണ്.',
  p3p: 'ഇവയിൽ ഏതാണ് വെർബൽ പ്രോഗ്രാമിംഗ്?',
  p3a: 'ഉപ്പ അരിപ്പാത്രത്തിൽ പണം ഒളിപ്പിക്കുന്നത് കാണുന്നത്', p3b: 'ഉമ്മാമ്മ “പണക്കാരെല്ലാം കള്ളന്മാരാ” എന്ന് വീണ്ടും വീണ്ടും പറയുന്നത് കേൾക്കുന്നത്', p3c: 'പത്താം വയസ്സിൽ ഒരു കടം കാരണം കുടുംബത്തിന് സ്ഥലം നഷ്ടപ്പെട്ടത്',
  p3y: 'അതെ. വെർബൽ പ്രോഗ്രാമിംഗ് എന്നാൽ കേട്ടത്, സത്യമായി തോന്നുംവരെ ആവർത്തിച്ച്.',
  p3na: 'അത് കണ്ട കാര്യമാണ്: മോഡലിംഗ്.', p3nc: 'അത് അനുഭവിച്ചതാണ്: ഒരു പ്രത്യേക സംഭവം.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'പണത്തെക്കുറിച്ചുള്ള അഞ്ച് മിനിറ്റ് സംസാരം കൊണ്ട് ആരുടെയും സാമ്പത്തിക ഭാവി മുഴുവൻ പ്രവചിക്കാം.',
  p4r2: 'വീട്ടിൽ നിന്ന് പഠിച്ച പണശീലങ്ങൾ മുതിർന്നാലും കൂടെ വരാറുണ്ട്.',
  p4r3: 'ഒരു കാര്യം പലതവണ കേട്ടാൽ അത് കൂടുതൽ സത്യമായി തോന്നും.',
  p4r4: 'ഒരു പണ പ്രഖ്യാപനം ഉറക്കെ പറഞ്ഞാൽ മതി, ബാങ്ക് ബാലൻസ് മാറും.',
  p4w1: 'തെറ്റ്. വീട്ടിലെ ശീലങ്ങൾ കൂടെ വരും, പക്ഷേ വരുമാനം ആരോഗ്യം, വിദ്യാഭ്യാസം, കുടുംബസ്വത്ത്, സമ്പദ്‌വ്യവസ്ഥ, ഭാഗ്യം എന്നിവയെയും ആശ്രയിക്കുന്നു.',
  p4w2: 'ശരി. ദീർഘകാല പഠനങ്ങൾ ഉൾപ്പെടെ, മാതാപിതാക്കളുടെ സംസാരവും മാതൃകയും ചെറുപ്പക്കാരുടെ പണം കൈകാര്യം ചെയ്യലിനെ തുടർന്നും സ്വാധീനിക്കുന്നു എന്ന് കണ്ടെത്തുന്നു.',
  p4w3: 'ശരി. ഇല്യൂസറി ട്രൂത്ത് ഇഫക്ട്, 1977-ൽ ആദ്യമായി റിപ്പോർട്ട് ചെയ്തു, പിന്നീട് പലതവണ ആവർത്തിച്ചു.',
  p4w4: 'തെറ്റ്. വാക്കുകൾ ശ്രദ്ധ തിരിക്കാൻ സഹായിക്കും; മാറ്റം വരുന്നത് ആവർത്തിക്കുന്ന പുതിയ പ്രവൃത്തികളിൽ നിന്നാണ്.',
});
const PRACTICE = [
  { id: 'p-first', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-pull', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 0, L('p2y'), [null, L('p2nb'), L('p2nc')]) },
  { id: 'p-verbal', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['f'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['t'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'mm-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('mm:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'mm-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (ML ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

mmDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '500 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '500 30px "Noto Serif Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit', '600 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
