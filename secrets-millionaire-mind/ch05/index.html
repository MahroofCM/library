// A badge for heard / saw / lived.
function c5Badge(p, k, { x = 0, y = 0, r = 118, s = 1, o = 1, label = true } = {}) {
  const g = G(p, { x, y, s, o });
  mmGlow(g, 0, 0, r * 1.45, k, .7);

  g._icon = path(g, d, { stroke: MM[k], 'stroke-width': 5, fill: k === 'lived' ? 'rgba(240,163,94,.15)' : 'none' });
  put(g._icon, { s: r / 118 });
  if (k === 'saw') mk('circle', { cx: 0, cy: 0, r: 14 * r / 118, fill: MM.saw }, g);
  if (label) g._label = mmText(g, L(k + 'L'), { x: 0, y: r + 72, size: 36, fill: MM[k], font: SERIF, weight: 600, maxW: 380 });
  return g;
}
// Kerala room interior: back wall, a doorway on the left, window with night outside.
function c5Room(p, { door = true } = {}) {

}

  p2y: 'ശരി. “ഉപ്പാന്റെ കയ്യിലാ പൈസ” എന്നത് “പണം എന്റെ കയ്യിൽ നിൽക്കേണ്ടതല്ല” എന്നായി മാറി.',
  p2nb: 'മാങ്ങ ഒരു പശ്ചാത്തലം മാത്രം. പാഠം പണം ആരുടെ കയ്യിൽ എന്നതായിരുന്നു.',
  p2nc: 'അവളുടെ കഥയിൽ മതവുമായി ബന്ധമൊന്നുമില്ല. കുട്ടിക്കാലത്ത് അനുഭവിച്ച ഒരു രീതിയാണത്.',
  p3p: 'നസ്രീനും ജുനൈദും പണത്തെച്ചൊല്ലി വഴക്ക് തുടരുന്നു. ഈ അധ്യായം ആദ്യം നിർദ്ദേശിക്കുന്നത് എന്താണ്?',
  p3a: 'വെവ്വേറെ അക്കൗണ്ട് തുറന്ന് ഇനി അതേക്കുറിച്ച് സംസാരിക്കാതിരിക്കുക', p3b: 'ഓരോരുത്തരും സ്വന്തം പണക്കഥയും പണം തങ്ങൾക്ക് എന്താണെന്നും പങ്കുവെക്കുക', p3c: 'കൂടുതൽ സമ്പാദിക്കുന്നയാൾ തീരുമാനിക്കട്ടെ',
  p3y: 'അതെ. കേട്ടതും കണ്ടതും അനുഭവിച്ചതും, പണം ഓരോരുത്തർക്കും എന്താണെന്നും പങ്കുവെക്കൂ. എന്നിട്ട് ഒന്നിച്ച് നിയമങ്ങൾ ഉണ്ടാക്കൂ.',
  p3na: 'വെവ്വേറെ പണം ചിലപ്പോൾ നടക്കും, പക്ഷേ സംസാരം ഒഴിവാക്കിയാൽ ബ്ലൂപ്രിന്റുകൾ ഉള്ളിൽ ഏറ്റുമുട്ടിക്കൊണ്ടിരിക്കും.',
  p3nc: 'അത് ഒരു ബ്ലൂപ്രിന്റിനെ മറ്റേതിന് മുകളിൽ വെക്കുന്നു. രണ്ടുപേരും അംഗീകരിക്കുന്ന നിയമങ്ങളാണ് ലക്ഷ്യം.',
  p4p: 'ഗവേഷണം എന്താണ് സൂചിപ്പിക്കുന്നത്? ഓരോന്നും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'വിവാഹമോചിതരെക്കുറിച്ചുള്ള ഒരു പഠനത്തിൽ, ഏറ്റവും കൂടുതൽ പേർ പറഞ്ഞ കാരണം പ്രതിബദ്ധതയില്ലായ്മയാണ്.',
  p4r2: '4,000-ലധികം അമേരിക്കൻ ദമ്പതികളുടെ പഠനത്തിൽ, മറ്റ് തർക്കങ്ങളെക്കാൾ ശക്തമായി വിവാഹമോചനം പ്രവചിച്ചത് പണത്തർക്കങ്ങളാണ്.',
  p4r3: 'ഓഹരിവിപണിയുടെ മോശം വർഷങ്ങളിൽ വളർന്നവർ മുതിർന്നപ്പോൾ കൂടുതൽ സാമ്പത്തിക റിസ്ക് എടുത്തു.',
  p4r4: 'കുട്ടിക്കാലത്തെ അനുഭവങ്ങൾ മാത്രമാണ് റിസ്ക് എടുക്കലിനെ സ്വാധീനിച്ചതെന്നും പിന്നീടുള്ള വർഷങ്ങൾക്ക് പങ്കില്ലെന്നും ഗവേഷകർ കണ്ടെത്തി.',
  p4w1: 'ശരി. നാലിൽ മൂന്നുപേരും പ്രതിബദ്ധതയില്ലായ്മ പറഞ്ഞു. പിന്നെ വഞ്ചനയും നിരന്തര വഴക്കും; പണപ്രശ്നങ്ങൾ മൂന്നിൽ ഒരാൾ (സ്കോട്ട് തുടങ്ങിയവർ, 2013).',
  p4w2: 'ശരി. പഠിച്ച മറ്റ് തർക്കങ്ങളെക്കാൾ ശക്തമായി വിവാഹമോചനം പ്രവചിച്ചത് പണത്തർക്കങ്ങളാണ് (ഡ്യൂ, ബ്രിറ്റ് & ഹസ്റ്റൺ, 2012).',
  p4w3: 'തെറ്റ്. അവർ കുറഞ്ഞ സാമ്പത്തിക റിസ്കാണ് എടുത്തത്, പതിറ്റാണ്ടുകൾക്ക് ശേഷവും (മാൽമെൻഡിയർ & നാഗൽ, 2011).',
  p4w4: 'തെറ്റ്. പിന്നീടുള്ള അനുഭവങ്ങളും പ്രധാനമായിരുന്നു, ഏറ്റവും പുതിയവയ്ക്ക് ഏറ്റവും കൂടുതൽ. പഴയവ പതിറ്റാണ്ടുകൾക്ക് ശേഷവും അടയാളം വെച്ചു.',
});

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'mm-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('mm:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'mm-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (ML ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

mmDefs();

const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '500 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '500 30px "Noto Serif Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit', '600 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
