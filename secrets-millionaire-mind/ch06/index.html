const stat = e => { e.setAttribute('data-static', '1'); return e; };
const C6HOT = MM.lived, C6COOL = MM.heard;
function c6Floor(p, y = 800) {
  mk('rect', { x: 0, y, width: 1600, height: 900 - y, fill: MM.floor }, p);
  path(p, `M0 ${y}H1600`, { stroke: MM.gold, 'stroke-width': 1.5, opacity: .25 });

// A row inside a science card: a tick, cross or dot and a wrapped line, left-anchored at (x, y). kind: 'ok' | 'no' | 'q'.
function c6Row(m, card, kind, str, mark, y, { x = 52, maxW, size = 29 } = {}) {
  const g = G(card, { x, y });
  const col = kind === 'ok' ? MM.good : kind === 'no' ? MM.bad : MM.gold;
  if (kind === 'ok') path(g, 'M-14 0L-4 10L14 -12', { stroke: col, 'stroke-width': 4.5 });
  else if (kind === 'no') path(g, 'M-11 -11L11 11M11 -11L-11 11', { stroke: col, 'stroke-width': 4.5 });
  else mmDot(g, 0, 0, 7, col);
  const t = mmPara(g, str, { x: 34, y: 10, size, maxW: maxW || card._w - x - 70, anchor: 'start', weight: 400 });
  g._h = t._h;
  mmCue(m, g, mark, 'rise', { dy: 10 });
  return g;
}
const c6Cite = (card, str, y, x = 86) => stat(mmText(card, str, { x, y, size: 20, fill: MM.dim, anchor: 'start', maxW: card._w - x - 30 }));
// A chip whose left edge is at x.
function c6ChipL(p, str, color, x, y, o = {}) { const c = mmChip(p, str, color, { ...o, x: 0, y }); put(c, { x: x + c._w / 2 }); return c; }
function c6Strike(p, c, t, color = MM.bad) {
  const x = st(c).x, y = st(c).y;
  const s = path(p, `M${x - c._w / 2 - 6} ${y + 10}L${x + c._w / 2 + 6} ${y - 10}`, { stroke: color, 'stroke-width': 4 }, { d: 0 });
  draw(s, t, .35);
  return s;
}
// Thermostat dial: 16° to 32° over 270 degrees. ._ptr rotates (r in degrees); ._hub glows.
const c6Ang = v => -135 + (v - 16) / 16 * 270;
function c6Dial(p, { x = 0, y = 0, r = 160, v = 24, o = 1 } = {}) {
  const g = G(p, { x, y, o });
  mk('circle', { cx: 0, cy: 0, r, fill: '#10171b', stroke: MM.gold, 'stroke-width': 3 }, g);
  mk('circle', { cx: 0, cy: 0, r: r - 16, fill: 'none', stroke: MM.faint, 'stroke-width': 1.5 }, g);
  for (let k = 16; k <= 32; k++) {
    const a = c6Ang(k) * Math.PI / 180, big = k % 4 === 0, r1 = r - 22, r2 = r1 - (big ? 22 : 10);
    path(g, `M${(Math.sin(a) * r1).toFixed(1)} ${(-Math.cos(a) * r1).toFixed(1)}L${(Math.sin(a) * r2).toFixed(1)} ${(-Math.cos(a) * r2).toFixed(1)}`,
      { stroke: k <= 22 ? C6COOL : k >= 27 ? C6HOT : MM.gold, 'stroke-width': big ? 3.5 : 2, opacity: big ? 1 : .7 });
    if (big) stat(T(g, String(k), { x: Math.sin(a) * (r1 - 44), y: -Math.cos(a) * (r1 - 44) + r * .05, size: Math.max(18, r * .12), fill: MM.dim, font: SANS, anchor: 'middle' }));
  }
  g._ptr = G(g, { r: c6Ang(v) });
  path(g._ptr, `M0 ${r * .14}L0 ${-r + 36}`, { stroke: MM.goldHi, 'stroke-width': Math.max(4, r * .035) });
  g._hub = mk('circle', { cx: 0, cy: 0, r: r * .1, fill: MM.gold }, g);
  return g;
}
// A two-way switch: left label (anchor end), a track with a knob, right label. pos(t) in -1..1 from the caller's clock.
function c6Switch(p, { x, y, w = 180 }) {
  const g = G(p, { x, y });

  g._knob = G(g);
  g._knobC = mk('circle', { cx: 0, cy: 0, r: 22, fill: MM.dim }, g._knob);
  g._w = w;
  return g;
}
const c6Lerp = (a, b, q) => a + (b - a) * q;
// Small person icon for population rows (about 46 px tall).
function c6Fig(p, x, y, color) {
  const g = G(p, { x, y });

}

  p1y: 'അതെ. ആദ്യം തിരിച്ചറിവ്: ഉള്ളിലെ സെറ്റിംഗ് ശ്രദ്ധിക്കൂ. പിന്നെ കഴിവും പ്ലാനും ചേർക്കൂ.',
  p1na: 'ഷോപ്പിംഗിൽ ലാഭിക്കുന്നത് കുറച്ച് സഹായിക്കും, പക്ഷേ സെറ്റിംഗിനെ തൊടില്ല.', p1nc: 'കുറ്റപ്പെടുത്തൽ സെറ്റിംഗിനെ ഒളിപ്പിച്ചുവെക്കും. സ്വന്തം വിശ്വാസം ശ്രദ്ധിച്ച് തുടങ്ങൂ.',
  p2p: 'തെർമോസ്റ്റാറ്റ് ഉദാഹരണത്തിൽ, തുറന്ന ബാൽക്കണി വാതിൽ എന്തിനെയാണ് സൂചിപ്പിക്കുന്നത്?',
  p2a: 'ഒരു താൽക്കാലിക തള്ളൽ, ഒരു ലോട്ടറി പോലെയോ മോശം മാസം പോലെയോ', p2b: 'മണി ബ്ലൂപ്രിന്റ് തന്നെ', p2c: 'നിലനിൽക്കുന്ന ഒരു പുതിയ ശീലം',
  p2y: 'ശരി. തുറന്ന വാതിൽ കുറച്ചുനേരം മുറിയെ മാറ്റും. മുറി എവിടെ നിൽക്കണമെന്ന് സെറ്റിംഗ് തീരുമാനിക്കും.',
  p2nb: 'ബ്ലൂപ്രിന്റ് തെർമോസ്റ്റാറ്റിന്റെ സെറ്റിംഗാണ്, വാതിലല്ല.', p2nc: 'നിലനിൽക്കുന്ന ശീലം തെർമോസ്റ്റാറ്റ് റീസെറ്റ് ചെയ്യുന്നത് പോലെയാണ്.',
  p3p: 'ഈ അധ്യായവും അതിലെ ശാസ്ത്രീയ പരിശോധനകളും വെച്ച് നോക്കിയാൽ, ഏത് മാറ്റമാണ് നിലനിൽക്കാൻ സാധ്യത കൂടുതൽ?',
  p3a: 'ഭാഗ്യം കൊണ്ടുവന്ന ഒരു ബോണസ് വർഷം', p3b: 'എല്ലാ ദിവസവും പണ ചിന്തകൾ ശ്രദ്ധിക്കുന്നതും, പുതിയ കഴിവുകളും സ്ഥിരമായ ഒരു പ്ലാനും', p3c: 'പണക്കാരെക്കുറിച്ചുള്ള ഒരു പുസ്തകം വായിക്കുന്നത്',
  p3y: 'അതെ. ഉള്ളിലെ മാറ്റവും പുറത്തെ കഴിവും ഒരുമിച്ച്. ഭാഗ്യം മാഞ്ഞുപോകും, ശീലവും കഴിവും നിൽക്കും.',
  p3na: 'ഭാഗ്യവർഷം സാധാരണ നിലയിലേക്ക് താഴാറുണ്ട്.', p3nc: 'വായന ഒരു തുടക്കമാണ്. മാറ്റം വരുന്നത് വീണ്ടും വീണ്ടും ചെയ്യുന്നതിലൂടെയാണ്.',
  p4p: 'ശാസ്ത്രീയ പരിശോധന: ഓരോ വാക്യവും ശരിയോ തെറ്റോ എന്ന് അടയാളപ്പെടുത്തൂ.',
  p4r1: 'ഒരു വലിയ വർഷത്തിന് ശേഷമുള്ള ഇടിവ്, ഒളിഞ്ഞിരിക്കുന്ന ഒരു പണ സെറ്റ് പോയിന്റിന്റെ തെളിവാണ്.',
  p4r2: '15 വർഷത്തിൽ, അമേരിക്കയിലെ മിക്ക വലിയ ഫണ്ടുകളും ഒരു ലളിതമായ ഇൻഡക്സ് ഫണ്ടിനേക്കാൾ പിന്നിലായി.',
  p4r3: 'ചിന്തകളെ ഒരടി മാറിനിന്ന് നോക്കുന്നത് കുറഞ്ഞ മാനസിക പ്രശ്നങ്ങളുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.',
  p4r4: 'ബിസിനസ് ഫലം ഉടമയുടെ മനോഭാവത്തെ മാത്രം ആശ്രയിക്കുന്നു, കഴിവിനെയോ മാർക്കറ്റിനെയോ അല്ല.',
  p4w1: 'തെറ്റ്. കുതിപ്പിന് ശേഷമുള്ള ഇടിവ് റിഗ്രഷൻ ടു ദ മീൻ പ്രവചിക്കുന്നതാണ്, പുറത്തെ കാര്യങ്ങൾക്കും പങ്കുണ്ട്.',
  p4w2: 'ശരി. S&P-യുടെ 2024 സ്കോർകാർഡിൽ, 15 വർഷത്തിൽ പത്തിൽ ഒമ്പതോളം വലിയ ഫണ്ടുകളും S&P 500-ന് പിന്നിലായിരുന്നു.',
  p4w3: 'ശരി. 57 പഠനങ്ങളുടെ 2024-ലെ ഒരു റിവ്യൂ, ഡീസെന്ററിംഗും കുറഞ്ഞ പ്രശ്നങ്ങളും തമ്മിൽ മിതമായ ബന്ധം കണ്ടെത്തി.',
  p4w4: 'തെറ്റ്. ഒരു പരീക്ഷണത്തിൽ, മെച്ചപ്പെട്ട മാനേജ്മെന്റ് രീതികൾ മാത്രം ഉൽപ്പാദനക്ഷമത ഏകദേശം 17% കൂട്ടി.',
});
const PRACTICE = [
  { id: 'p-plateau', prompt: [L('p1p')], build: choice([[L('p1a')], [L('p1b')], [L('p1c')]], 1, L('p1y'), [L('p1na'), null, L('p1nc')]) },
  { id: 'p-door', prompt: [L('p2p')], build: choice([[L('p2a')], [L('p2b')], [L('p2c')]], 0, L('p2y'), [null, L('p2nb'), L('p2nc')]) },
  { id: 'p-lasting', prompt: [L('p3p')], build: choice([[L('p3a')], [L('p3b')], [L('p3c')]], 1, L('p3y'), [L('p3na'), null, L('p3nc')]) },
  { id: 'p-science', prompt: [L('p4p')], build: grid([
    { parts: [L('p4r1')], ans: ['f'], why: L('p4w1') },
    { parts: [L('p4r2')], ans: ['t'], why: L('p4w2') },
    { parts: [L('p4r3')], ans: ['t'], why: L('p4w3') },
    { parts: [L('p4r4')], ans: ['f'], why: L('p4w4') },
  ], TF, { multi: false, text: true }) },
];

/* ---------- language switch and the portrait nudge ---------- */
(function () {
  const sw = document.createElement('div');
  sw.className = 'mm-lang'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Language');
  [['en', 'English', ''], ['ml', 'മലയാളം', 'ml']].forEach(([code, label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.setAttribute('aria-pressed', String(LANG === code));
    b.onclick = () => {
      if (code === LANG) return;
      try { localStorage.setItem('mm:lang', code); } catch (e) {}
      const u = new URL(location.href); u.searchParams.set('lang', code); u.searchParams.delete('beat'); u.searchParams.delete('t');
      location.href = u.toString();
    };
    sw.append(b);
  });
  document.getElementById('frame').append(sw);
  const r = document.createElement('div');
  r.className = 'mm-rotate';
  r.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 8a9 9 0 0 1 3-4M21 16a9 9 0 0 1-3 4"/></svg>'
    + (ML ? 'മികച്ച കാഴ്ചയ്ക്ക് ഫോൺ തിരിക്കൂ' : 'Turn your phone sideways for the best view');
  document.body.append(r);
})();

mmDefs();
// Start once the fonts are in, so text measured for wrapping matches what is drawn (never wait more than 2.5 s).
const FONTS = ML ? ['400 30px "Noto Sans Malayalam"', '500 30px "Noto Sans Malayalam"', '600 30px "Noto Sans Malayalam"', '500 30px "Noto Serif Malayalam"', '600 30px "Noto Serif Malayalam"', '500 30px Outfit', '600 30px Outfit']
  : ['400 30px Outfit', '500 30px Outfit', '600 30px Outfit', '600 30px "Cormorant Garamond"', 'italic 500 30px "Cormorant Garamond"'];
Promise.race([Promise.all(FONTS.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
</script>
